<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="beads_data.js"></script>
<script src="beads.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:900px; height:1200px; overflow:hidden; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background: radial-gradient(120% 95% at 50% 108%, #e8864a 0%, #8a4260 36%, #3a2a5c 66%, #171a3c 100%);
    position:relative; display:flex; flex-direction:column; align-items:center;
  }
  .sky { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .sky i { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff6; }
  .dust { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .dust i { position:absolute; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle,#ffd98a,#f0c24b66); animation:fall linear infinite; }
  @keyframes fall { from{transform:translateY(-20px);opacity:0;} 12%{opacity:.9;} to{transform:translateY(1200px);opacity:0;} }

  .title-wrap { margin-top:52px; text-align:center; position:relative; z-index:3; }
  .title { font-size:96px; font-weight:800; letter-spacing:16px;
    background:linear-gradient(180deg,#fff3cf 0%,#ffd97a 38%,#e9a53a 66%,#b06e1f 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 5px 12px rgba(0,0,0,.5)); }
  .title-en { margin-top:6px; font-size:20px; letter-spacing:12px; color:#e9c98a; font-weight:600; opacity:.9; }
  .tagline { margin-top:14px; font-size:27px; color:#f4e3c0; letter-spacing:2px; font-weight:600;
    text-shadow:0 2px 6px rgba(0,0,0,.5); }

  /* 天际线舞台 */
  .stage { position:relative; z-index:2; width:900px; height:430px; margin-top:34px; }
  .bld { position:absolute; bottom:0; filter:drop-shadow(0 10px 14px rgba(0,0,0,.4)); }
  .bld.back { opacity:.82; }
  .ground { position:absolute; left:0; right:0; bottom:0; height:120px; z-index:0;
    background:linear-gradient(180deg,#39513a 0%,#2b3d30 40%,#1e2a24 100%); }
  .ground::after { content:""; position:absolute; top:0; left:0; right:0; height:10px;
    background:linear-gradient(180deg,#4a6848,transparent); }

  .foot { position:relative; z-index:3; margin-top:auto; margin-bottom:26px; text-align:center; }
  .badges { display:flex; justify-content:center; gap:14px; margin-bottom:18px; }
  .badge { font-size:20px; padding:8px 22px; border-radius:999px; font-weight:700; letter-spacing:1px;
    background:rgba(10,12,26,.45); backdrop-filter:blur(6px); }
  .badge.a { color:#ffd97a; border:1.5px solid rgba(240,194,75,.6); }
  .badge.b { color:#9fd8ae; border:1.5px solid rgba(124,200,140,.5); }
  .foot-line { font-size:18px; color:#cbb899; letter-spacing:1px; }
  .foot-line b { color:#ffd97a; font-weight:700; }
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <div class="dust" id="dust"></div>

  <div class="title-wrap">
    <div class="title">拼豆城市</div>
    <div class="title-en">PERLER CITY</div>
    <div class="tagline">每一栋楼，都是你亲手拼出来的一块拼豆</div>
  </div>

  <div class="stage" id="stage">
    <div class="ground"></div>
  </div>

  <div class="foot">
    <div class="badges">
      <div class="badge a">#小红书vibecoding大赛</div>
      <div class="badge b">#vibegame</div>
    </div>
    <div class="foot-line">每一栋楼都是真实的拼豆图纸　｜　<b>互动游戏赛道 · 点开即玩</b></div>
  </div>

  <script>
    // 星星
    var sky = document.getElementById('sky');
    for (var i = 0; i < 46; i++) {
      var s = document.createElement('i');
      s.style.cssText = 'left:' + (Math.random()*100) + '%; top:' + (Math.random()*48) + '%; opacity:' + (0.2+Math.random()*0.5) + ';';
      sky.appendChild(s);
    }
    // 金色微尘
    var dust = document.getElementById('dust');
    for (var i = 0; i < 24; i++) {
      var d = document.createElement('i');
      var sz = 2 + Math.random()*4;
      d.style.cssText = 'left:' + (Math.random()*100) + '%; top:' + (Math.random()*100) + '%; width:' + sz + 'px; height:' + sz + 'px;'
        + 'animation-duration:' + (5+Math.random()*7) + 's; animation-delay:' + (Math.random()*8) + 's;';
      dust.appendChild(d);
    }
    // 天际线：用真实图纸拼出城市
    var SKY = [
      { id:'house',   x:36,  bead:10 },
      { id:'windmill',x:150, bead:12 },
      { id:'cafe',    x:292, bead:9  },
      { id:'watertower',x:402, bead:9 },
      { id:'lighthouse',x:505, bead:11 },
      { id:'school',  x:626, bead:10 },
      { id:'tower',   x:762, bead:9  }
    ];
    var stage = document.getElementById('stage');
    var groundH = 120;
    SKY.forEach(function (s) {
      var b = BEAD.byId(s.id);
      var size = b.rows.length * s.bead;
      var el = document.createElement('div');
      el.className = 'bld';
      el.style.left = s.x + 'px';
      el.style.height = size + 'px';
      el.innerHTML = BEAD.renderSvg(b, s.bead);
      stage.appendChild(el);
    });
  </script>
</body>
</html>
