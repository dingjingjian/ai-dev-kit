<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="beads_data.js"></script>
<script src="beads.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:900px; height:1200px; overflow:hidden; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background: linear-gradient(180deg,#171a3c 0%,#3a2a5c 32%,#7a3f5e 56%,#c25e3a 80%,#e8864a 100%);
    position:relative; display:flex; flex-direction:column; align-items:center;
  }
  /* 太阳辉光 */
  .sun { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:820px; height:820px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,190,120,.55) 0%,rgba(255,150,80,.22) 34%,transparent 66%);
    pointer-events:none; }
  .sky { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .sky i { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff8; }
  .dust { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .dust i { position:absolute; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle,#ffd98a,#f0c24b66); animation:fall linear infinite; }
  @keyframes fall { from{transform:translateY(-20px);opacity:0;} 12%{opacity:.9;} to{transform:translateY(1200px);opacity:0;} }

  .title-wrap { margin-top:44px; text-align:center; position:relative; z-index:4; }
  .title { font-size:100px; font-weight:800; letter-spacing:16px; line-height:1;
    background:linear-gradient(180deg,#fff6d8 0%,#ffd97a 40%,#e9a53a 68%,#b06e1f 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)); }
  .title-en { margin-top:8px; font-size:20px; letter-spacing:14px; color:#ffe6b0; font-weight:600; opacity:.92;
    text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .pill { margin-top:18px; display:inline-flex; align-items:center; padding:10px 26px; border-radius:999px;
    background:rgba(12,14,30,.42); border:1.5px solid rgba(240,194,75,.5); backdrop-filter:blur(6px);
    font-size:26px; font-weight:700; color:#ffeec9; letter-spacing:1px; }

  /* 背景天际线（真实图纸，放在卡片后面） */
  .back-sky { position:absolute; left:0; right:0; bottom:120px; height:300px; z-index:1;
    display:flex; align-items:flex-end; justify-content:space-around; pointer-events:none; }
  .back-sky .bld { opacity:.9; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); }

  /* 主视觉：真实截图卡（倾斜 + 辉光 + 数据徽章） */
  .shot-card { position:relative; z-index:3; margin-top:30px;
    width:300px; height:649px; border-radius:30px; overflow:hidden;
    border:3px solid rgba(255,220,140,.85);
    box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 60px rgba(255,190,110,.28), inset 0 0 0 1px rgba(255,255,255,.08);
    transform:rotate(-3deg); background:#0d0f1c; }
  .shot-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .stat-badge { position:absolute; top:18px; right:-6px; z-index:5;
    background:linear-gradient(180deg,#ffd97a,#e9a53a); color:#3a2a12;
    font-size:24px; font-weight:800; padding:8px 20px; border-radius:14px 4px 4px 14px;
    box-shadow:0 6px 16px rgba(0,0,0,.45); letter-spacing:1px;
    transform:rotate(2deg); }

  .foot { position:relative; z-index:4; margin-top:auto; margin-bottom:26px; text-align:center; }
  .badges { display:flex; justify-content:center; gap:14px; margin-bottom:16px; }
  .badge { font-size:20px; padding:8px 22px; border-radius:999px; font-weight:700; letter-spacing:1px;
    background:rgba(12,14,30,.5); backdrop-filter:blur(6px); }
  .badge.a { color:#ffd97a; border:1.5px solid rgba(240,194,75,.6); }
  .badge.b { color:#9fd8ae; border:1.5px solid rgba(124,200,140,.5); }
  .foot-line { font-size:18px; color:#e6d3ae; letter-spacing:1px; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .foot-line b { color:#ffe9b8; font-weight:800; }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="sky" id="sky"></div>
  <div class="dust" id="dust"></div>

  <div class="title-wrap">
    <div class="title">拼豆城市</div>
    <div class="title-en">PERLER CITY</div>
    <div class="pill">拼豆 × 模拟城市 · 一玩就停不下来</div>
  </div>

  <div class="back-sky" id="backSky"></div>

  <div class="shot-card">
    <div class="stat-badge">36 栋全满 · 人口 199</div>
    <img src="../shots/city-full.png" alt="game">
  </div>

  <div class="foot">
    <div class="badges">
      <div class="badge a">#小红书vibecoding大赛</div>
      <div class="badge b">#vibegame</div>
    </div>
    <div class="foot-line">每一栋楼，都是你亲手拼出来的一块拼豆　｜　<b>互动游戏赛道 · 点开即玩</b></div>
  </div>

  <script>
    var sky = document.getElementById('sky');
    for (var i = 0; i < 44; i++) {
      var s = document.createElement('i');
      s.style.cssText = 'left:' + (Math.random()*100) + '%; top:' + (Math.random()*55) + '%; opacity:' + (0.2+Math.random()*0.55) + ';';
      sky.appendChild(s);
    }
    var dust = document.getElementById('dust');
    for (var i = 0; i < 26; i++) {
      var d = document.createElement('i');
      var sz = 2 + Math.random()*4;
      d.style.cssText = 'left:' + (Math.random()*100) + '%; top:' + (Math.random()*100) + '%; width:' + sz + 'px; height:' + sz + 'px;'
        + 'animation-duration:' + (5+Math.random()*7) + 's; animation-delay:' + (Math.random()*8) + 's;';
      dust.appendChild(d);
    }
    var BACK = ['house','cafe','watertower','windmill','market','lighthouse','school','tower'];
    var bs = document.getElementById('backSky');
    BACK.forEach(function (id, i) {
      var b = BEAD.byId(id);
      var bead = 7;
      var el = document.createElement('div');
      el.className = 'bld';
      el.innerHTML = BEAD.renderSvg(b, bead);
      bs.appendChild(el);
    });
  </script>
</body>
</html>
