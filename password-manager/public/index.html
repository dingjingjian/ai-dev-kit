<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码管理器</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/Sortable.min.js"></script>
</head>
<body>
  <!-- 认证页面 -->
  <div class="auth-container" id="authContainer">
    <div class="auth-box">
      <h1>🔐 密码管理器</h1>
      <p id="authSubtitle">请输入主密码以继续</p>
      <form id="authForm">
        <div class="form-group">
          <label for="masterPassword">主密码</label>
          <input type="password" id="masterPassword" placeholder="输入主密码" required>
        </div>
        <div class="form-group" id="confirmPasswordGroup" style="display: none;">
          <label for="confirmPassword">确认主密码</label>
          <input type="password" id="confirmPassword" placeholder="再次输入主密码">
        </div>
        <div class="form-group" id="hintGroup" style="display: none;">
          <label for="masterHint">密码提示（可选）</label>
          <input type="text" id="masterHint" placeholder="帮助你回忆主密码的提示">
        </div>
        <div id="loginHint" style="display: none; background: #fff3cd; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; color: #856404;"></div>
        <button type="submit" class="btn" id="authBtn">登录</button>
        <div class="error-msg" id="authError"></div>
      </form>
    </div>
  </div>

  <!-- 主应用 -->
  <div class="main-app" id="mainApp">
    <div class="container">
      <div class="header">
        <h1>🔐 密码管理器</h1>
        <div class="header-actions">
          <input type="text" class="search-box" id="searchBox" placeholder="搜索密码记录...">
          <button class="btn btn-sm" onclick="openAddModal()">+ 添加密码</button>
          <button class="btn btn-sm btn-secondary" onclick="exportPasswords()">导出</button>
          <button class="btn btn-sm btn-secondary" onclick="document.getElementById('importFile').click()">导入</button>
          <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importPasswords(event)">
          <button class="btn btn-sm btn-secondary" onclick="openBackupModal()">备份恢复</button>
          <button class="btn btn-sm btn-secondary" onclick="openHintModal()">密码提示</button>
          <button class="btn btn-sm btn-secondary" onclick="logout()">退出</button>
        </div>
      </div>
      
      <div class="content">
        <div class="sidebar">
          <h3>分类</h3>
          <ul class="category-list" id="categoryList"></ul>
          <button class="btn btn-sm btn-secondary" style="width: 100%; margin-top: 15px;" onclick="openCategoryModal()">+ 新建分类</button>
        </div>
        
        <div class="password-list" id="passwordList">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <p>暂无密码记录</p>
            <p style="font-size: 14px; margin-top: 10px;">点击"添加密码"开始管理您的密码</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加/编辑密码模态框 -->
  <div class="modal" id="passwordModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="passwordModalTitle">添加密码</h2>
        <button class="modal-close" onclick="closePasswordModal()">&times;</button>
      </div>
      <form id="passwordForm">
        <input type="hidden" id="passwordId">
        <div class="form-group">
          <label for="pwdTitle">标题 *</label>
          <input type="text" id="pwdTitle" placeholder="例如：GitHub账号" required>
        </div>
        <div class="form-group">
          <label for="pwdCategory">分类</label>
          <select id="pwdCategory"></select>
        </div>
        <div class="form-group">
          <label for="pwdUsername">用户名/邮箱</label>
          <input type="text" id="pwdUsername" placeholder="username@example.com">
        </div>
        <div class="form-group">
          <label for="pwdPassword">密码 *</label>
          <input type="text" id="pwdPassword" placeholder="输入密码" required oninput="checkPasswordStrength(this.value)">
          <div class="strength-indicator">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-text" id="strengthText"></div>
        </div>
        <div class="form-group">
          <label for="pwdUrl">网址</label>
          <input type="text" id="pwdUrl" placeholder="https://example.com">
        </div>
        <div class="form-group">
          <label for="pwdNotes">备注</label>
          <textarea id="pwdNotes" placeholder="添加备注信息..."></textarea>
        </div>
        <button type="submit" class="btn">保存</button>
      </form>
    </div>
  </div>

  <!-- 添加分类模态框 -->
  <div class="modal" id="categoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>新建分类</h2>
        <button class="modal-close" onclick="closeCategoryModal()">&times;</button>
      </div>
      <form id="categoryForm">
        <div class="form-group">
          <label for="catName">分类名称 *</label>
          <input type="text" id="catName" placeholder="例如：社交媒体" required>
        </div>
        <div class="form-group">
          <label for="catIcon">图标</label>
          <select id="catIcon">
            <option value="folder">📁 文件夹</option>
            <option value="globe">🌐 网站</option>
            <option value="app">📱 应用</option>
            <option value="mail">📧 邮箱</option>
            <option value="credit-card">💳 金融</option>
            <option value="users">👥 社交</option>
            <option value="briefcase">💼 工作</option>
            <option value="game">🎮 游戏</option>
            <option value="shopping">🛒 购物</option>
          </select>
        </div>
        <div class="form-group">
          <label for="catColor">颜色</label>
          <input type="color" id="catColor" value="#4A90D9">
        </div>
        <button type="submit" class="btn">创建</button>
      </form>
    </div>
  </div>

  <!-- 密码提示模态框 -->
  <div class="modal" id="hintModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>设置密码提示</h2>
        <button class="modal-close" onclick="closeHintModal()">&times;</button>
      </div>
      <p style="color: #666; font-size: 14px; margin-bottom: 15px;">设置一个提示帮助你回忆主密码。注意：提示会明文存储，不要直接写密码本身。</p>
      <div class="form-group">
        <label for="hintInput">密码提示</label>
        <input type="text" id="hintInput" placeholder="例如：我的生日+名字首字母">
      </div>
      <button class="btn" onclick="saveHint()">保存提示</button>
    </div>
  </div>

  <!-- 备份恢复模态框 -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>备份与恢复</h2>
        <button class="modal-close" onclick="closeBackupModal()">&times;</button>
      </div>
      <div style="margin-bottom: 20px;">
        <h3 style="margin-bottom: 10px; font-size: 16px;">📦 自动备份</h3>
        <p style="color: #666; font-size: 14px; margin-bottom: 15px;">每次修改数据时会自动创建备份，保留最近7天的备份。</p>
        <h3 style="margin-bottom: 10px; font-size: 16px;">📋 备份列表</h3>
        <div id="backupList" style="max-height: 300px; overflow-y: auto;"></div>
      </div>
      <div style="border-top: 1px solid #e1e5eb; padding-top: 20px; margin-top: 20px;">
        <h3 style="margin-bottom: 10px; font-size: 16px;">🔄 从备份恢复</h3>
        <p style="color: #666; font-size: 14px; margin-bottom: 15px;">点击上方备份条目选择，然后输入主密码进行恢复。</p>
        <div class="form-group">
          <label>主密码</label>
          <input type="password" id="restorePassword" placeholder="输入主密码">
        </div>
        <button class="btn" onclick="restoreBackup()">恢复</button>
      </div>
    </div>
  </div>

  <!-- 引入模块化 JS -->
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/passwords.js"></script>
  <script src="js/backup.js"></script>
  <script>
    // 全局状态
    const API_BASE = '/api';
    let currentCategory = 'all';
    let editingPasswordId = null;

    // 初始化
    setupAuthForm();
    setupPasswordForm();
    setupCategoryForm();
    setupSearch();
    initAuth();
  </script>
</body>
</html>
