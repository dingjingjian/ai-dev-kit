<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <title>密码管理器</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/Sortable.min.js"></script>
</head>
<body>
  <!-- 认证页面 -->
  <div class="auth-container" id="authContainer">
    <div class="auth-box">
      <h1>🔐 密码管理器</h1>
      <p id="authSubtitle">请输入主密码以继续</p>
      <form id="authForm">
        <div class="form-group">
          <label for="masterPassword">主密码</label>
          <input type="password" id="masterPassword" placeholder="输入主密码" autocomplete="off" required>
        </div>
        <div class="form-group hidden" id="confirmPasswordGroup">
          <label for="confirmPassword">确认主密码</label>
          <input type="password" id="confirmPassword" placeholder="再次输入主密码" autocomplete="off">
        </div>
        <div class="form-group hidden" id="hintGroup">
          <label for="masterHint">密码提示(可选)</label>
          <input type="text" id="masterHint" placeholder="帮助你回忆主密码的提示">
        </div>
        <div class="login-hint" id="loginHint"></div>
        <button type="submit" class="btn btn-block" id="authBtn">登录</button>
        <div class="error-msg" id="authError"></div>
      </form>
    </div>
  </div>

  <!-- 主应用 -->
  <div class="main-app" id="mainApp">
    <!-- 顶部工具栏 -->
    <header class="header">
      <h1>🔐 密码管理器</h1>
      <div class="header-actions">
        <input type="text" class="search-box" id="searchBox" placeholder="搜索密码记录... (Ctrl+F)" autocomplete="off">
        <button class="btn btn-sm" id="btnAdd" title="添加密码 (Ctrl+N)">+ 添加</button>
        <button class="btn btn-sm btn-secondary" id="btnExport" title="导出 (Ctrl+E)">导出</button>
        <button class="btn btn-sm btn-secondary" id="btnImport">导入</button>
        <input type="file" id="importFile" accept=".json" class="hidden">
        <button class="btn btn-sm btn-secondary" id="btnBackup">备份恢复</button>
        <button class="btn btn-sm btn-secondary" id="btnHint">密码提示</button>
        <button class="btn btn-sm btn-secondary" id="btnLogout">退出</button>
      </div>
    </header>

    <div class="content">
      <!-- 侧栏分类 -->
      <aside class="sidebar">
        <h3>分类</h3>
        <ul class="category-list" id="categoryList"></ul>
        <button class="btn btn-sm btn-secondary btn-block" id="btnNewCategory" style="margin-top: 8px;">+ 新建分类</button>
      </aside>

      <!-- 密码列表 -->
      <main class="password-list" id="passwordList">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <p>暂无密码记录</p>
          <p class="hint">点击"添加"或按 <span class="kbd">Ctrl+N</span> 开始管理您的密码</p>
        </div>
      </main>
    </div>
  </div>

  <!-- 添加/编辑密码模态框 -->
  <div class="modal" id="passwordModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="passwordModalTitle">添加密码</h2>
        <button class="modal-close" data-close="passwordModal" aria-label="关闭">&times;</button>
      </div>
      <form id="passwordForm">
        <input type="hidden" id="passwordId">
        <div class="form-group">
          <label for="pwdTitle">标题 *</label>
          <input type="text" id="pwdTitle" placeholder="例如:GitHub账号" required>
        </div>
        <div class="form-group">
          <label for="pwdCategory">分类</label>
          <select id="pwdCategory"></select>
        </div>
        <div class="form-group">
          <label for="pwdUsername">用户名/邮箱</label>
          <input type="text" id="pwdUsername" placeholder="username@example.com" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="pwdPassword">密码 *</label>
          <input type="text" id="pwdPassword" placeholder="输入密码" required autocomplete="off">
          <div class="strength-indicator"><div class="strength-bar" id="strengthBar"></div></div>
          <div class="strength-text" id="strengthText"></div>
        </div>
        <div class="form-group">
          <label for="pwdUrl">网址</label>
          <input type="text" id="pwdUrl" placeholder="https://example.com" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="pwdNotes">备注</label>
          <textarea id="pwdNotes" placeholder="添加备注信息..."></textarea>
        </div>
        <button type="submit" class="btn btn-block">保存</button>
      </form>
    </div>
  </div>

  <!-- 添加分类模态框 -->
  <div class="modal" id="categoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>新建分类</h2>
        <button class="modal-close" data-close="categoryModal" aria-label="关闭">&times;</button>
      </div>
      <form id="categoryForm">
        <div class="form-group">
          <label for="catName">分类名称 *</label>
          <input type="text" id="catName" placeholder="例如:社交媒体" required>
        </div>
        <div class="form-group">
          <label for="catIcon">图标</label>
          <select id="catIcon">
            <option value="folder">📁 文件夹</option>
            <option value="globe">🌐 网站</option>
            <option value="app">📱 应用</option>
            <option value="mail">📧 邮箱</option>
            <option value="credit-card">💳 金融</option>
            <option value="users">👥 社交</option>
            <option value="briefcase">💼 工作</option>
            <option value="game">🎮 游戏</option>
            <option value="shopping">🛒 购物</option>
          </select>
        </div>
        <div class="form-group">
          <label for="catColor">颜色</label>
          <input type="color" id="catColor" value="#4A90D9">
        </div>
        <button type="submit" class="btn btn-block">创建</button>
      </form>
    </div>
  </div>

  <!-- 密码提示模态框 -->
  <div class="modal" id="hintModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>设置密码提示</h2>
        <button class="modal-close" data-close="hintModal" aria-label="关闭">&times;</button>
      </div>
      <p class="text-muted" style="margin-bottom: 14px;">设置一个提示帮助你回忆主密码。注意:提示会明文存储,不要直接写密码本身。</p>
      <div class="form-group">
        <label for="hintInput">密码提示</label>
        <input type="text" id="hintInput" placeholder="例如:我的生日+名字首字母">
      </div>
      <button class="btn btn-block" id="btnSaveHint">保存提示</button>
    </div>
  </div>

  <!-- 备份恢复模态框 -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>备份与恢复</h2>
        <button class="modal-close" data-close="backupModal" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-section">
        <h3>📦 自动备份</h3>
        <p class="desc">每次修改数据时会自动创建备份,保留最近7天的备份。</p>
        <h3>📋 备份列表</h3>
        <div class="backup-list" id="backupList"></div>
      </div>
      <div class="modal-section">
        <h3>🔄 从备份恢复</h3>
        <p class="desc">点击上方备份条目选择,然后输入主密码进行恢复。</p>
        <div class="form-group">
          <label for="restorePassword">主密码</label>
          <input type="password" id="restorePassword" placeholder="输入主密码" autocomplete="off">
        </div>
        <button class="btn btn-block" id="btnRestore">恢复</button>
      </div>
    </div>
  </div>

  <!-- 引入模块化 JS -->
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/passwords.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
