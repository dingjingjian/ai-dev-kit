<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人工智能计算器 · 应用图标</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 中性浅灰背景，方便截图抠边 */
    background: radial-gradient(1200px 800px at 50% 30%, #f1f5f9 0%, #e2e8f0 55%, #cbd5e1 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }
  .icon {
    width: min(82vmin, 1024px);
    height: min(82vmin, 1024px);
    display: block;
    filter: drop-shadow(0 30px 60px rgba(15, 23, 42, .28));
  }
  .icon svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="icon" role="img" aria-label="人工智能计算器应用图标">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- App 原背景渐变 #111827 → #1f2937 -->
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"    stop-color="#111827"/>
          <stop offset="0.55" stop-color="#1f2937"/>
          <stop offset="1"    stop-color="#0b1220"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"    stop-color="#ffffff" stop-opacity="0.10"/>
          <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <!-- 计算器卡片阴影 -->
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
        </filter>
        <!-- 按键细微高光 -->
        <linearGradient id="keyDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#283548"/>
          <stop offset="1" stop-color="#1b2433"/>
        </linearGradient>
        <linearGradient id="keySec" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#566073"/>
          <stop offset="1" stop-color="#3f4859"/>
        </linearGradient>
        <linearGradient id="keyOp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fb923c"/>
          <stop offset="1" stop-color="#ea580c"/>
        </linearGradient>
        <linearGradient id="keyEq" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#34d399"/>
          <stop offset="1" stop-color="#059669"/>
        </linearGradient>
      </defs>

      <!-- ===== Squircle 底板 ===== -->
      <path d="M0 128 C0 57.3 57.3 0 128 0 L384 0 C454.7 0 512 57.3 512 128 L512 384 C512 454.7 454.7 512 384 512 L128 512 C57.3 512 0 454.7 0 384 Z"
            fill="url(#bg)"/>
      <path d="M0 128 C0 57.3 57.3 0 128 0 L384 0 C454.7 0 512 57.3 512 128 L512 384 C512 454.7 454.7 512 384 512 L128 512 C57.3 512 0 454.7 0 384 Z"
            fill="url(#gloss)"/>

      <!-- ===== 计算器主体卡片（#030712，呼应 .calc） ===== -->
      <g filter="url(#cardShadow)">
        <rect x="72" y="80" width="368" height="376" rx="40" ry="40" fill="#030712"/>
      </g>

      <!-- ===== 白色显示屏（呼应 .screen：白底 + #e5e7eb 细边） ===== -->
      <rect x="96" y="104" width="320" height="92" rx="18" ry="18" fill="#ffffff"/>
      <rect x="96" y="104" width="320" height="92" rx="18" ry="18"
            fill="none" stroke="#e5e7eb" stroke-width="3"/>
      <!-- 顶部小状态点（呼应 App 的 badge） -->
      <circle cx="116" cy="124" r="6" fill="#f97316"/>
      <!-- 算式行（小字，灰） -->
      <text x="402" y="138" text-anchor="end"
            font-family="-apple-system, 'Segoe UI', sans-serif"
            font-size="22" font-weight="700" fill="#6b7280">5 + 3 =</text>
      <!-- 结果行（大字，黑） -->
      <text x="402" y="184" text-anchor="end"
            font-family="-apple-system, 'Segoe UI', sans-serif"
            font-size="52" font-weight="800" fill="#000000">8</text>

      <!-- ===== 按键网格（5 行 × 4 列，间距 8） =====
            列 x: 96, 178, 260, 342  宽 74
            行 y: 204, 250, 296, 342, 388  高 38  -->

      <!-- 第 1 行：AC  ±  %  ÷ -->
      <rect x="96"  y="204" width="74" height="38" rx="11" fill="url(#keySec)"/>
      <rect x="178" y="204" width="74" height="38" rx="11" fill="url(#keySec)"/>
      <rect x="260" y="204" width="74" height="38" rx="11" fill="url(#keySec)"/>
      <rect x="342" y="204" width="74" height="38" rx="11" fill="url(#keyOp)"/>
      <text x="133" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">AC</text>
      <text x="215" y="231" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">±</text>
      <text x="297" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">%</text>
      <text x="379" y="231" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">÷</text>

      <!-- 第 2 行：7  8  9  × -->
      <rect x="96"  y="250" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="178" y="250" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="260" y="250" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="342" y="250" width="74" height="38" rx="11" fill="url(#keyOp)"/>
      <text x="133" y="277" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">7</text>
      <text x="215" y="277" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">8</text>
      <text x="297" y="277" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">9</text>
      <text x="379" y="278" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">×</text>

      <!-- 第 3 行：4  5  6  − -->
      <rect x="96"  y="296" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="178" y="296" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="260" y="296" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="342" y="296" width="74" height="38" rx="11" fill="url(#keyOp)"/>
      <text x="133" y="323" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">4</text>
      <text x="215" y="323" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">5</text>
      <text x="297" y="323" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">6</text>
      <text x="379" y="322" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">−</text>

      <!-- 第 4 行：1  2  3  + -->
      <rect x="96"  y="342" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="178" y="342" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="260" y="342" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="342" y="342" width="74" height="38" rx="11" fill="url(#keyOp)"/>
      <text x="133" y="369" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">1</text>
      <text x="215" y="369" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">2</text>
      <text x="297" y="369" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">3</text>
      <text x="379" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">+</text>

      <!-- 第 5 行：0(占2列)  .  = -->
      <rect x="96"  y="388" width="156" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="260" y="388" width="74" height="38" rx="11" fill="url(#keyDark)"/>
      <rect x="342" y="388" width="74" height="38" rx="11" fill="url(#keyEq)"/>
      <text x="174" y="415" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">0</text>
      <text x="297" y="416" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">.</text>
      <text x="379" y="416" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff" font-family="-apple-system, 'Segoe UI', sans-serif">=</text>
    </svg>
  </div>
</body>
</html>
