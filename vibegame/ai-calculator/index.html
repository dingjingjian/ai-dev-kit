<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>人工智能计算器</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="page">
    <div class="calc">

      <!-- ===== 游戏头部信息 ===== -->
      <header class="head">
        <div class="stats">
          <div class="stat-card stat-score">
            <svg class="ic ic-trophy" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v2h3v3a4 4 0 0 1-4 4h-.35A5.99 5.99 0 0 1 13 16.92V20h4v2H7v-2h4v-3.08A5.99 5.99 0 0 1 7.35 13H7a4 4 0 0 1-4-4V6h3V4zm0 4H5v1a2 2 0 0 0 1 1.73V8zm12 0v2.73A2 2 0 0 0 19 9V8h-1zM9 6v4a3 3 0 0 0 6 0V6H9z"/></svg>
            <div>
              <div class="stat-label">分数</div>
              <div class="stat-value" id="score">0</div>
            </div>
          </div>
          <div class="stat-card stat-combo" id="comboCard">
            <svg class="ic ic-zap" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            <div>
              <div class="stat-label">连击</div>
              <div class="stat-value" id="combo">x0</div>
            </div>
          </div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" id="helpBtn" type="button" aria-label="游戏说明" title="游戏说明">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 5a2 2 0 0 0-2 2h2a1 1 0 1 1 1 1c0 .5-.3.8-.7 1.1L11 12v1h2v-.5l.6-.4A2.5 2.5 0 0 0 12 7zm0 9.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/></svg>
          </button>
          <button class="icon-btn" id="resetBtn" type="button" aria-label="重置游戏" title="重置游戏">
            <svg class="ic ic-rotate" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>
          </button>
        </div>
      </header>

      <!-- ===== 最高分 / 准确率 / 轮次 ===== -->
      <div class="summary">
        <span class="sum-item">最高分: <b id="highScore">0</b></span>
        <span class="sum-item">准确率: <b id="accuracy">0%</b></span>
        <span class="sum-item">轮次: <b id="totalRounds">0</b></span>
      </div>

      <!-- ===== 游戏帮助面板 ===== -->
      <section class="help-panel" id="helpPanel" hidden>
        <div class="help-title">
          <svg class="ic ic-info" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 9a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0v-4h-1a1 1 0 0 1 0-2h2zm0-5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/></svg>
          <h3>游戏说明</h3>
          <button class="help-close" id="helpClose" type="button" aria-label="关闭说明">×</button>
        </div>
        <ul class="help-list">
          <li>使用计算器进行计算</li>
          <li>约 50% 的结果可能是错误的</li>
          <li>仔细检查结果，判断是否正确</li>
          <li>判断正确 +10 分，连击有加成</li>
          <li>判断错误 -5 分，连击中断</li>
          <li>验证阶段：按 C 表示正确，X 表示错误</li>
        </ul>
        <div class="help-note">常见错误：个位数错位、运算错误、小数点错位、数字颠倒</div>
      </section>

      <!-- ===== 显示区域 ===== -->
      <div class="screen">
        <div class="status-ind">
          <span class="badge badge-calc" id="badgeCalc">计算中</span>
          <span class="badge badge-verify" id="badgeVerify">请验证</span>
          <span class="badge badge-ok" id="badgeOk">判断正确!</span>
          <span class="badge badge-no" id="badgeNo">判断错误!</span>
        </div>

        <div class="screen-body">
          <div class="expression" id="expression">&nbsp;</div>
          <div class="result" id="display">0</div>
        </div>

        <div class="screen-foot">
          <div class="verify-bar hide" id="verifyBar">
            <button class="verify-btn verify-ok" id="okBtn" type="button">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 12-12-1.4-1.4z"/></svg>
              <span>正确</span>
              <span class="key-hint">C</span>
            </button>
            <button class="verify-btn verify-no" id="noBtn" type="button">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3l6.3-6.3L2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
              <span>错误</span>
              <span class="key-hint">X</span>
            </button>
          </div>
          <div class="idle-hint" id="idleHint">
            <span class="dot"></span>
            <span id="idleText">输入算式后点击 = 开始验证</span>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>
      </div>

      <!-- ===== 计算器按钮区域 ===== -->
      <div class="keypad" id="keypad">
        <button class="key key-sec" data-action="clear" type="button">AC</button>
        <button class="key key-sec" data-action="sign" type="button">±</button>
        <button class="key key-sec" data-action="percent" type="button">%</button>
        <button class="key key-op" data-op="÷" type="button">÷</button>

        <button class="key" data-num="7" type="button">7</button>
        <button class="key" data-num="8" type="button">8</button>
        <button class="key" data-num="9" type="button">9</button>
        <button class="key key-op" data-op="×" type="button">×</button>

        <button class="key" data-num="4" type="button">4</button>
        <button class="key" data-num="5" type="button">5</button>
        <button class="key" data-num="6" type="button">6</button>
        <button class="key key-op" data-op="-" type="button">−</button>

        <button class="key" data-num="1" type="button">1</button>
        <button class="key" data-num="2" type="button">2</button>
        <button class="key" data-num="3" type="button">3</button>
        <button class="key key-op" data-op="+" type="button">+</button>

        <button class="key key-zero" data-num="0" type="button">0</button>
        <button class="key" data-action="decimal" type="button">.</button>
        <button class="key key-eq" data-action="equals" type="button">=</button>
      </div>

      <div class="foot-tip">支持键盘输入 · 点击 = 后验证结果 · 键盘 C=正确 X=错误</div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script src="./assets/main.js"></script>
</body>
</html>
