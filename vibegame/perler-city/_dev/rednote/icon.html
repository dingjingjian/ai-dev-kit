<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="beads_data.js"></script>
<script src="beads.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:1024px; overflow:hidden; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    width:1024px; height:1024px;
    border-radius:180px;
    background: radial-gradient(120% 120% at 50% 118%, #e8864a 0%, #b25a44 22%, #7a3f5e 42%, #3a2a5c 68%, #171a3c 100%);
    position:relative; display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 3px rgba(255,220,150,.18);
  }
  .sun { position:absolute; left:50%; top:56%; transform:translate(-50%,-50%);
    width:700px; height:700px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,196,120,.5) 0%,rgba(255,150,80,.2) 36%,transparent 66%);
    pointer-events:none; }
  .dust { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .dust i { position:absolute; width:5px; height:5px; border-radius:50%;
    background:radial-gradient(circle,#ffd98a,#f0c24b66); opacity:.8; }
  .logo { position:relative; z-index:3; filter:drop-shadow(0 26px 40px rgba(0,0,0,.45)); }
  .ring { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:660px; height:660px; border-radius:50%;
    border:2px solid rgba(240,194,75,.3); pointer-events:none; }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="dust" id="dust"></div>
  <div class="ring"></div>
  <div class="logo" id="logo"></div>
  <script>
    var dust = document.getElementById('dust');
    for (var i = 0; i < 16; i++) {
      var d = document.createElement('i');
      var sz = 3 + Math.random()*5;
      d.style.cssText = 'left:' + (Math.random()*100) + '%; top:' + (Math.random()*100) + '%; width:' + sz + 'px; height:' + sz + 'px;';
      dust.appendChild(d);
    }
    var b = BEAD.byId('house');
    document.getElementById('logo').innerHTML = BEAD.renderSvg(b, 46);
  </script>
</body>
</html>
