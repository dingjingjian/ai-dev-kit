<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:900px; height:1200px; overflow:hidden; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; position:relative; }
  .bg { position:absolute; inset:0; z-index:0; }
  .bg img { width:100%; height:100%; object-fit:cover; display:block; }
  /* 上下渐变压暗，保证文字可读 */
  .scrim-top { position:absolute; top:0; left:0; right:0; height:400px; z-index:1;
    background:linear-gradient(180deg,rgba(10,10,28,.78) 0%,rgba(10,10,28,.42) 55%,transparent 100%); }
  .scrim-bot { position:absolute; bottom:0; left:0; right:0; height:250px; z-index:1;
    background:linear-gradient(0deg,rgba(10,10,28,.82) 0%,rgba(10,10,28,.4) 60%,transparent 100%); }

  .title-wrap { position:relative; z-index:3; margin-top:64px; text-align:center; }
  .title { font-size:104px; font-weight:800; letter-spacing:18px; line-height:1;
    background:linear-gradient(180deg,#fff6d8 0%,#ffd97a 40%,#e9a53a 68%,#b06e1f 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.6)); }
  .title-en { margin-top:10px; font-size:21px; letter-spacing:15px; color:#ffe8b6; font-weight:600;
    text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .pill { margin-top:20px; display:inline-flex; align-items:center; padding:12px 30px; border-radius:999px;
    background:rgba(12,14,30,.5); border:1.5px solid rgba(255,214,120,.65); backdrop-filter:blur(4px);
    font-size:27px; font-weight:800; color:#fff2d0; letter-spacing:1px;
    box-shadow:0 6px 18px rgba(0,0,0,.4); }

  .foot { position:relative; z-index:3; position:absolute; left:0; right:0; bottom:30px; text-align:center; }
  .badges { display:flex; justify-content:center; gap:14px; margin-bottom:16px; }
  .badge { font-size:20px; padding:8px 22px; border-radius:999px; font-weight:700; letter-spacing:1px;
    background:rgba(12,14,30,.55); backdrop-filter:blur(4px); }
  .badge.a { color:#ffd97a; border:1.5px solid rgba(240,194,75,.65); }
  .badge.b { color:#9fd8ae; border:1.5px solid rgba(124,200,140,.55); }
  .foot-line { font-size:18px; color:#f0dfbc; letter-spacing:1px; text-shadow:0 1px 5px rgba(0,0,0,.7); }
  .foot-line b { color:#ffe9b8; font-weight:800; }
</style>
</head>
<body>
  <div class="bg"><img src="art-cover-bg.png" alt="bg"></div>
  <div class="scrim-top"></div>
  <div class="scrim-bot"></div>

  <div class="title-wrap">
    <div class="title">拼豆城市</div>
    <div class="title-en">PERLER CITY</div>
    <div class="pill">拼豆 × 模拟城市 · 一玩就停不下来</div>
  </div>

  <div class="foot">
    <div class="badges">
      <div class="badge a">#小红书vibecoding大赛</div>
      <div class="badge b">#vibegame</div>
    </div>
    <div class="foot-line">每一栋楼，都是你亲手拼出来的一块拼豆　｜　<b>互动游戏赛道 · 点开即玩</b></div>
  </div>
</body>
</html>
