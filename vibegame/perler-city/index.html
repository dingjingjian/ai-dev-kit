<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#151A24">
<title>拼豆城市 · 一颗豆建一座城</title>
<style>
:root{
  --sky-1:#1B2436; --sky-2:#2A3550; --sky-3:#4A3A52;
  --star-op:.5;              /* 由 JS 按昼夜亮度实时写，白天归零、夜里拉满 */
  --ink:#F2F5FA; --ink-dim:#A9B4C6; --ink-faint:#6E7A8D;
  --gold:#E8B64C; --gold-soft:#F5D483;
  --paper:#23314A;        /* 蓝图用纸：深蓝印纸 */
  --paper-2:#1A2236;
  --paper-line:rgba(120,160,220,0.16);
  --panel:rgba(22,28,40,0.92); --panel-2:#1E2735; --line:rgba(255,255,255,0.10);
  --ok:#5DBE8A; --warn:#E0754B; --bad:#D6544B;
  --ease:cubic-bezier(.2,.7,.3,1);
  --ease-back:cubic-bezier(.2,1.35,.4,1);
  --safe-top:var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --safe-bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --safe-l:0px;
  --safe-r:0px;
}
body.in-app{ --safe-top:calc(var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) + 40px);
             --safe-l:48px; --safe-r:92px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:var(--sky-1);
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  padding-top:var(--safe-top);
  padding-left:var(--safe-l);
  padding-right:var(--safe-r);
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;}
canvas{display:block;}

/* ---------- 背景 ---------- */
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.sky{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% 108%, rgba(232,182,76,0.16), transparent 58%),
    radial-gradient(80% 50% at 12% 4%, rgba(120,160,220,0.14), transparent 60%),
    linear-gradient(178deg, var(--sky-1) 0%, var(--sky-2) 48%, var(--sky-3) 100%);
}
.stars{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--star-op);
  background-image:
    radial-gradient(1.4px 1.4px at 18% 12%, rgba(255,255,255,.9), transparent),
    radial-gradient(1.2px 1.2px at 72% 8%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.6px 1.6px at 44% 20%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.2px 1.2px at 86% 26%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.3px 1.3px at 30% 32%, rgba(255,255,255,.45), transparent);
}

/* ---------- 布局 ---------- */
#app{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;}

/* ---------- 顶栏：统计铭牌 ---------- */
/* 整块顶栏是一条「蓝图标题块」。不再用 3 颗圆角胶囊，
   改成 4 个段落、靠 1px 细线分段，每段一个数值 + 一个标签。 */
#hud{
  flex:0 0 auto;position:relative;display:flex;align-items:stretch;
  background:linear-gradient(180deg, rgba(20,26,38,.94), rgba(14,20,30,.78));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
  box-shadow:0 4px 20px rgba(0,0,0,.32);
}
/* 底边一道金色余晖，和城市画布的暖光衔接 */
#hud::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(232,182,76,.38), transparent);
}
/* 4 段：城市名 / 金币 / 人口 / 幸福。段间用 1px 细线，不用竖向胶囊 */
.hud-left{
  flex:1 1 auto;min-width:0;padding:10px 12px 9px 14px;
  border-right:1px solid rgba(255,255,255,.07);
}
.city-name{
  font-size:20px;font-weight:800;letter-spacing:1.2px;line-height:1.15;
  background:linear-gradient(92deg,#FFF6E2,var(--gold) 46%,#C08A2E);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;
  text-shadow:0 1px 10px rgba(232,182,76,.18), 0 0 18px rgba(232,182,76,.10);
}
.city-sub{font-size:10.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.2px;
  font-variant-numeric:tabular-nums;position:relative;padding-bottom:6px;}
/* 城市名下方一道极细金线，延伸到整个 HUD 宽度，撑起"档案抬头"感 */
.city-sub::after{
  content:"";position:absolute;left:-14px;right:0;bottom:0;height:1px;
  background:linear-gradient(90deg,
    rgba(232,182,76,0) 0%,
    rgba(232,182,76,.55) 6%,
    rgba(232,182,76,.18) 70%,
    rgba(232,182,76,0) 100%);
  pointer-events:none;
}
.hud-stats{display:flex;align-items:stretch;flex:0 0 auto;}
.hud-stat{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:54px;padding:8px 10px 7px;
  border-left:1px solid rgba(255,255,255,.07);
}
.hud-stat b{
  font-size:16px;font-weight:800;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--ink);
  transition:text-shadow .3s,color .3s;
}
.hud-stat b.gold{color:var(--gold-soft);text-shadow:0 0 12px rgba(232,182,76,.32);}
.hud-stat b.pop{color:#A8DCFF;text-shadow:0 0 12px rgba(79,168,199,.32);}
.hud-stat b.happy{color:#F7AEC0;text-shadow:0 0 12px rgba(233,160,176,.32);}
.hud-stat b.bad{color:var(--bad);text-shadow:0 0 12px rgba(214,84,75,.4);}
.hud-stat span{font-size:9px;color:var(--ink-faint);margin-top:2px;letter-spacing:.5px;}
@keyframes statBump{ 0%{transform:translateY(0);} 40%{transform:translateY(-2px);} 100%{transform:translateY(0);} }
.hud-stat.bump b{animation:statBump .38s var(--ease);}

/* 声音开关：HUD 最右一枚纯图标按钮。
   刻意做得比三段统计弱一号 —— 它是设置项，不该和金币/人口/幸福抢注意力。
   两个图标都写在 HTML 里靠 class 切换，不在 JS 里改 DOM。 */
.hud-snd{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:44px;padding:8px 0 7px;
  border-left:1px solid rgba(255,255,255,.07);
  color:var(--ink-faint);
  transition:color .2s var(--ease);
}
.hud-snd svg{
  width:19px;height:19px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.hud-snd:active{color:var(--gold-soft);}
.hud-snd .ico-off{display:none;}
.hud-snd.muted{color:#566072;}
.hud-snd.muted .ico-on{display:none;}
.hud-snd.muted .ico-off{display:block;}

/* ---------- 需求条 ---------- */
/* 首页这三条是「一眼扫过」的信息：现在到底缺什么。原来 8px 太细，
   夹在 HUD 和主屏之间几乎看不见 —— 等于把最重要的引导信号做成了装饰线。
   提到 12px（跟 .mbar 同口径）+ 双层内凹 + 顶部高光，让它有实体感。
   中线的「平衡点」单独加粗到 2px：玩家得先看见基准，才读得出偏向哪边。 */
#demand{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 14px 7px;
}
.dm{flex:1 1 0;display:flex;align-items:center;gap:6px;}
.dm i{
  font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink-faint);
  width:15px;flex:0 0 auto;text-align:center;
}
/* 标签用类别提亮色（与市政面板 .tagt 同口径），三条一眼可分。
   注意 fill 的绿/红是「需求/过剩」语义，跟标签色不在同一个维度上，
   靠位置（标签最左、色块从中线长出去）分开，不会读混。 */
.dm.r i{color:#9CCB84;}
.dm.c i{color:#6FBEDC;}
.dm.i i{color:#EFB65C;}
.dm .bar{
  position:relative;flex:1 1 auto;height:12px;border-radius:6px;
  background:rgba(255,255,255,0.06);overflow:hidden;
  border:1px solid rgba(255,255,255,.045);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.42), inset 0 -1px 0 rgba(255,255,255,.03);
}
/* 首页 12px 条：中线加粗，基准要看得见 */
.dm .bar::after{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;
  background:rgba(255,255,255,0.30);
}
/* 市政面板 6px 条：有文字陪同，中线保持 1px，否则占掉三分之一太高 */
.udm .bar::after{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:rgba(255,255,255,0.22);
}
.dm .fill{
  position:absolute;top:0;bottom:0;border-radius:6px;
  transition:width .35s var(--ease),background .3s;
}
.dm .fill.pos, .udm .fill.pos{background:linear-gradient(90deg,#4E9E73,var(--ok));
  box-shadow:0 0 9px rgba(93,190,138,.60), inset 0 1px 0 rgba(255,255,255,.22);}
.dm .fill.neg, .udm .fill.neg{background:linear-gradient(270deg,#9E4E48,var(--bad));
  box-shadow:0 0 9px rgba(214,84,75,.60), inset 0 1px 0 rgba(255,255,255,.22);}
/* 窄屏：三等分变挤，标签收窄、条优先 */
@media (max-width:360px){
  #demand{gap:6px;padding:4px 10px 6px;}
  .dm{gap:4px;}
  .dm i{font-size:11px;width:13px;}
}

/* ---------- 城市舞台 ---------- */
/* 不画四角金线：舞台的边界感交给画布里的沙盘台基（drawCityBase）去表达，
   DOM 层再叠一层线框反而把「画框」和「画」分成两张皮。 */
#cityWrap{flex:1 1 auto;position:relative;min-height:0;padding:0 10px;}
#cityCanvas{width:100%;height:100%;}
.hint{
  position:absolute;left:0;right:0;bottom:6px;text-align:center;
  font-size:11px;color:var(--ink-faint);pointer-events:none;letter-spacing:.5px;
  transition:opacity .4s var(--ease);
}
@keyframes hintBreath{0%,100%{opacity:.5;}50%{opacity:1;}}
.hint{animation:hintBreath 2.8s ease-in-out infinite;}
.hint.gone{opacity:0;animation:none;}

/* ---------- 底栏：4 颗功能键（图标上 · 文字下） ---------- */
#dock{
  flex:0 0 auto;position:relative;display:flex;gap:6px;
  padding:8px 10px calc(8px + var(--safe-bottom));
}
/* 整段底栏靠 1px 上边线 + 一道金线收口 */
#dock::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
}
#dock button{
  flex:1 1 0;height:54px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:700;letter-spacing:.6px;
  background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,0.10);color:var(--ink-dim);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 2px 8px rgba(0,0,0,.24);
  transition:transform .14s var(--ease),background .2s,border-color .2s,color .2s;
}
/* 图标统一跟随文字色（stroke:currentColor），换主次态不用改两份颜色 */
#dock button svg{
  width:21px;height:21px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
#dock button:active{transform:scale(.95);}
#dock button.primary{
  background:linear-gradient(180deg,#F7DA96,var(--gold) 62%,#DDA63C);
  color:#3A2A08;border-color:rgba(255,255,255,0.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 3px 12px rgba(232,182,76,.34);
}
#dock button.primary:active{background:linear-gradient(180deg,var(--gold-soft),var(--gold));}

/* ---------- 浮层 ---------- */
.overlay{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  background:rgba(11,15,22,0.96);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(12px);
  transition:opacity .26s var(--ease),visibility .26s,transform .32s var(--ease);
  padding-top:var(--safe-top);
}
.overlay.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;}
/* 蓝图/数据/玩法三页都走同一种头部：标题 + 关闭。
   标题用「大号字 + 金色渐变 + 一行小副标题」三段式。 */
.ov-head{
  flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;
  padding:12px 14px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(38,49,66,.55), rgba(38,49,66,0));
}
.ov-title-wrap{min-width:0;}
.ov-title{
  font-size:17px;font-weight:800;letter-spacing:.6px;
  background:linear-gradient(92deg,#FFF3D6,var(--gold) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ov-sub{font-size:10.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.3px;}

/* 浮层底栏：关闭 / 返回一律收在底部，与主屏 dock 同一套视觉语言。
   顶部只留标题，视线从上往下扫完内容，手指自然落在底部的动作上。 */
.ov-foot{
  flex:0 0 auto;position:relative;display:flex;align-items:center;gap:10px;
  padding:9px 12px calc(9px + var(--safe-bottom));
  border-top:1px solid var(--line);
  background:linear-gradient(0deg, rgba(38,49,66,.62), rgba(38,49,66,0));
}
/* 上沿一道金色细线收口，与顶栏的暖金标题呼应 */
.ov-foot::before{
  content:"";position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(232,182,76,.28), transparent);
}
.ov-foot-note{
  flex:1 1 auto;min-width:0;
  font-size:10.5px;color:var(--ink-faint);letter-spacing:.3px;line-height:1.5;
}
.ov-foot-note b{color:var(--gold-soft);font-weight:700;}
.ov-foot-note.ok{color:var(--ok);}
.ov-foot-note.warn{color:var(--warn);}
.ov-foot-note.bad{color:var(--bad);}
.ov-foot button{
  flex:0 0 auto;height:44px;padding:0 18px;border-radius:13px;
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--ink-dim);
  background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 2px 8px rgba(0,0,0,.24);
  transition:transform .14s var(--ease),color .2s,background .2s;
}
.ov-foot button svg{
  width:18px;height:18px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.ov-foot button:active{transform:scale(.94);background:rgba(255,255,255,.13);}
/* 重置是低频但不可逆的操作：常驻红底 + 红描边 + 红字，在底栏一眼可辨。
   原来那版「幽灵样式」（无底无描边、灰字）太隐蔽——玩家要找半天才看见入口在哪，
   而它偏偏是整页唯一一个「点了就回不来」的按钮，藏起来反而是风险。 */
.ov-foot button.ghost{
  padding:0 12px;
  background:linear-gradient(180deg, rgba(214,84,75,.20), rgba(214,84,75,.09));
  border:1px solid rgba(214,84,75,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 8px rgba(214,84,75,.14);
  color:#F09086;
  transition:transform .14s var(--ease),background .2s var(--ease),
             color .2s var(--ease),border-color .2s var(--ease);
}
.ov-foot button.ghost:active{
  transform:scale(.94);
  background:linear-gradient(180deg, rgba(214,84,75,.42), rgba(214,84,75,.26));
  border-color:rgba(214,84,75,.75);
  color:#FFDEDA;
}
.ov-foot button.ghost svg{width:15px;height:15px;stroke-width:1.9;}

.ov-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 12px 18px;}
/* 浮层有 .ov-foot 时：scroll 区域要留出底部 dock 的高度，否则最后一段被遮 */
.ov-scroll.has-foot{padding-bottom:calc(78px + var(--safe-bottom));}
.ov-bar{
  flex:0 0 auto;padding:9px 12px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0));
}
.tabs{display:flex;flex-wrap:wrap;gap:6px;min-width:0;}
.tab{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;
  border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,0.055);
  color:var(--ink-dim);font-size:11.5px;font-weight:700;letter-spacing:.2px;
  transition:background .18s var(--ease),color .18s var(--ease),
             border-color .18s var(--ease),transform .12s var(--ease);
}
.tab:active{transform:scale(.93);}
.tab i{width:7px;height:7px;border-radius:50%;display:block;flex:0 0 auto;
  box-shadow:0 0 0 2px rgba(255,255,255,.08);}
.tab b{font-size:9.5px;font-weight:800;opacity:.55;font-variant-numeric:tabular-nums;}
.tab.on{
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  border-color:rgba(255,255,255,0.42);color:#3A2A08;
  box-shadow:0 2px 9px rgba(232,182,76,.30);
}
.tab.on b{opacity:.78;}
.tab.on i{box-shadow:0 0 0 2px rgba(58,42,8,.20);}

/* ============================================================
   蓝图页：左大右小 + 底部 dock
   取代旧版 N 张同结构卡片。选中态 + 底部单条 CTA，
   类目靠 tab 切换、内容靠缩略图条切换。
   ============================================================ */
.bp-intro{
  font-size:10.5px;color:var(--ink-faint);
  padding:10px 2px 8px;letter-spacing:.3px;
}
.bp-intro b{color:var(--ink-dim);font-weight:700;}

/* 大卡：选中态。整张卡走「蓝印纸 + 白色细坐标」的视觉语言 */
.bp-feat{
  position:relative;overflow:hidden;
  margin:0 0 12px;
  background:linear-gradient(180deg,var(--paper) 0%, var(--paper-2) 100%);
  border:1px solid var(--paper-line);
  border-radius:13px;
  padding:13px 13px 12px;
  box-shadow:0 4px 14px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.04);
}
/* 卡内细密蓝印网格，靠 background-image 拉出来，不影响文字 */
.bp-feat::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
    linear-gradient(rgba(120,160,220,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,160,220,0.06) 1px, transparent 1px);
  background-size:14px 14px, 14px 14px;
}
/* 卡右上角的「图号」:营造档案感 */
.bp-feat::after{
  content:attr(data-no);position:absolute;top:8px;right:11px;
  font-size:9px;font-weight:800;letter-spacing:1.2px;
  color:rgba(120,160,220,0.45);font-variant-numeric:tabular-nums;
  pointer-events:none;
}
.bp-feat-main{position:relative;display:flex;gap:12px;align-items:stretch;}
.bp-feat-thumb{
  flex:0 0 100px;width:100px;height:100px;align-self:flex-start;
  border:1px solid rgba(120,160,220,0.22);
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), 0 4px 12px rgba(0,0,0,.36);
}
.bp-feat-thumb canvas{border-radius:6px;display:block;}
.bp-feat-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px;position:relative;}
.bp-feat-name{
  font-size:16px;font-weight:800;letter-spacing:.4px;color:#F2F5FA;line-height:1.2;
  padding-right:34px; /* 让位给 ::after 图号 */
}
.bp-feat-cat{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:800;letter-spacing:.3px;
  color:#A8C2E4;align-self:flex-start;
}
.bp-feat-cat i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.bp-feat-desc{font-size:11.5px;color:var(--ink-dim);line-height:1.5;}
/* 属性两列：一行 = 标签 + 数值，靠 1px 虚线分隔。
   不做 N 份小卡片，靠 1px dotted 分隔。
   数值列右对齐，类别色按语义：产能 ok / 耗用 warn / 供给 #8FD3FF */
.bp-feat-stats{
  display:grid;grid-template-columns:1fr 1fr;column-gap:12px;row-gap:0;
  margin-top:3px;font-size:10.5px;
}
.bp-feat-stats i{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:3px 0;border-bottom:1px dotted rgba(255,255,255,0.08);
}
.bp-feat-stats i:nth-last-child(-n+2){border-bottom:0;}
.bp-feat-stats b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);}
.bp-feat-stats i.p b{color:var(--ok);}
.bp-feat-stats i.n b{color:var(--warn);}
.bp-feat-stats i.s b{color:#8FD3FF;}
.bp-feat-stats em{font-style:normal;color:var(--ink-faint);}

/* 缩略图条：横向滚动选建筑，比 N 张卡片更克制 */
.bp-strip-wrap{position:relative;margin-top:2px;}
.bp-strip-label{
  font-size:9.5px;font-weight:800;color:var(--ink-faint);
  letter-spacing:1.4px;padding:0 2px 6px;
}
.bp-strip{
  display:flex;flex-wrap:wrap;gap:7px;
  padding:2px 0 4px;
}
.bp-strip-item{
  flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 0 4px;border:1px solid transparent;border-radius:9px;
  background:transparent;cursor:pointer;
  transition:border-color .2s,background .2s,transform .14s var(--ease);
}
.bp-strip-item:active{transform:scale(.96);}
.bp-strip-item.on{
  background:rgba(232,182,76,0.08);
  border-color:rgba(232,182,76,0.45);
  box-shadow:0 0 0 1px rgba(232,182,76,0.18);
}
.bp-strip-item .pic{
  position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  border-radius:7px;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}
.bp-strip-item .pic canvas{border-radius:5px;display:block;}
.bp-strip-item .nm{
  font-size:9.5px;color:var(--ink-faint);letter-spacing:.2px;line-height:1.1;
  text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:0 2px;
}
.bp-strip-item.on .nm{color:var(--gold-soft);font-weight:700;}
.bp-strip-item.locked .pic{opacity:.38;}
.bp-strip-item .badge{
  position:absolute;top:-2px;right:-3px;font-size:8px;font-weight:800;
  padding:1px 4px;border-radius:4px;background:rgba(12,16,24,0.9);
  color:var(--gold-soft);border:1px solid rgba(232,182,76,0.4);
  font-variant-numeric:tabular-nums;
}
.bp-strip-item.locked .badge{background:rgba(12,16,24,0.85);color:var(--ink-faint);
  border-color:rgba(255,255,255,0.1);}
.bp-strip-item .badge.go{background:var(--gold);color:#3A2A08;border-color:transparent;}

/* 蓝图底部 dock：关闭（左）· 档案（中）· 主 CTA（右）。
   一行收口，状态颜色靠整行底色渐变，不靠徽章 */
.bp-dock{
  flex:0 0 auto;position:relative;display:flex;gap:9px;align-items:center;
  padding:9px 12px calc(10px + var(--safe-bottom));
  border-top:1px solid var(--line);
  background:linear-gradient(180deg, rgba(20,26,36,0), rgba(20,26,36,.85));
}
.bp-dock::before{
  content:"";position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(232,182,76,.28), transparent);
}
/* 蓝图关闭键与其它浮层（数据/玩法/市政）的 .ov-foot 关闭键同一套视觉：
   底部右侧、✕ + 「关闭」圆角胶囊、44px、渐变描边与高光一致 */
.bp-dock-x{
  flex:0 0 auto;height:44px;padding:0 18px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--ink-dim);
  background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 2px 8px rgba(0,0,0,.24);
  transition:transform .14s var(--ease),color .2s,background .2s;
}
.bp-dock-x svg{
  width:18px;height:18px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.bp-dock-x:active{transform:scale(.94);background:rgba(255,255,255,.13);}
.bp-dock-info{
  flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  min-width:0;padding-right:6px;
}
.bp-dock-info .nm{font-size:12px;font-weight:800;letter-spacing:.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bp-dock-info .mt{font-size:10px;color:var(--ink-faint);margin-top:2px;
  font-variant-numeric:tabular-nums;}
.bp-dock-info .mt b{color:var(--gold-soft);font-weight:700;}
.bp-dock-cta{
  flex:0 0 auto;min-width:108px;height:46px;padding:0 16px;border-radius:12px;
  font-size:13px;font-weight:800;letter-spacing:.4px;
  background:linear-gradient(180deg,#F7DA96,var(--gold) 62%,#DDA63C);color:#3A2A08;
  border:1px solid rgba(255,255,255,0.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5), 0 3px 12px rgba(232,182,76,0.34);
  transition:transform .14s var(--ease);
}
.bp-dock-cta:active{transform:scale(.96);}
.bp-dock-cta.gray{
  background:rgba(255,255,255,0.07);color:var(--ink-faint);
  border-color:var(--line);box-shadow:none;
}
.bp-dock-cta.blue{
  background:linear-gradient(180deg,#9ADCFF,#4FA8C7);color:#0B2B36;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), 0 3px 12px rgba(79,168,199,0.34);
}
.bp-empty{
  text-align:center;font-size:11.5px;color:var(--ink-faint);
  padding:32px 12px;line-height:1.8;
}

/* ============================================================
   数据页：全屏浮层 + SVG 图表
   ============================================================ */
.dp-title{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:0 1px 10px;margin-bottom:6px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.dp-title-l{display:flex;flex-direction:column;gap:2px;}
.dp-title-l b{
  font-size:18px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(92deg,#FFF3D6,var(--gold) 72%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dp-title-l span{font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.dp-title-r{font-size:20px;font-weight:800;color:var(--gold-soft);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(232,182,76,.35), 0 0 28px rgba(232,182,76,.10);
  letter-spacing:-.3px;}

/* 圆环图 */
.dp-ring-row{
  display:flex;align-items:center;gap:16px;
  padding:10px 0 14px;border-bottom:1px solid rgba(255,255,255,0.07);
}
.dp-ring-row svg{flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(232,182,76,0.10));}
.dp-ring-body{flex:1 1 auto;min-width:0;}
.dp-ring-lbl{font-size:10.5px;color:var(--ink-faint);letter-spacing:.4px;}
.dp-ring-val{font-size:34px;font-weight:800;color:var(--ink);line-height:1.02;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px;
  text-shadow:0 0 18px rgba(232,182,76,0.10);}
.dp-ring-val b{font-size:16px;font-weight:600;color:var(--ink-faint);margin-left:3px;
  text-shadow:none;letter-spacing:0;}
.dp-ring-mood{font-size:11px;color:var(--ink-dim);margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;}

/* 收入堆叠条 */
.dp-inc{padding:10px 0 8px;border-bottom:1px solid rgba(255,255,255,0.07);}
.dp-inc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.dp-inc-h b{font-size:18px;font-weight:800;color:var(--gold-soft);
  font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(232,182,76,0.25);}
.dp-inc-h span{font-size:10px;color:var(--ink-faint);}
.dp-stack{display:flex;height:16px;border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,0.04);
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.45), inset 0 1px 0 rgba(0,0,0,0.20);
  border:1px solid rgba(255,255,255,0.04);}
.dp-stack i{display:block;height:100%;transition:width .3s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.20);}
.dp-stack i.b{background:linear-gradient(180deg,#D4B670,#8E7838);}
.dp-stack i.t{background:linear-gradient(180deg,#8FD3FF,#4FA8C7);}
.dp-stack i.c{background:linear-gradient(180deg,#A8DCFF,#4FA8C7);}
.dp-stack i.z{background:linear-gradient(180deg,#9CCB84,#5DBE8A);}
.dp-stack-l{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;
  font-size:10.5px;color:var(--ink-faint);
}
.dp-stack-l i{display:flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;}
.dp-stack-l .dot{width:8px;height:8px;border-radius:2px;display:inline-block;}
.dp-stack-l .b{background:#8E7838;}
.dp-stack-l .t{background:#4FA8C7;}
.dp-stack-l .c{background:#4FA8C7;}
.dp-stack-l .z{background:#5DBE8A;}
.dp-stack-l b{color:var(--ink);font-weight:700;}

/* 资源行 */
.dp-util{padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.055);}
.dp-util:last-child{border-bottom:0;}
.dp-util-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.dp-util-h b{font-size:12px;font-weight:700;color:var(--ink-dim);letter-spacing:.3px;}
.dp-util-h span{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
.dp-util-h span.bad{color:var(--bad);}
.dp-util-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.40);}
.dp-util-bar span{display:block;height:100%;border-radius:3px;
  background:var(--c, var(--ok));transition:width .3s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20);}
.dp-util-bar.bad span{background:linear-gradient(90deg,#A3433B,var(--bad));}

/* 解锁进度 */
.dp-unlock{
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:center;gap:10px;
}
.dp-unlock .pic{flex:0 0 52px;width:52px;height:52px;
  border:1px solid rgba(255,255,255,0.1);border-radius:8px;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);}
.dp-unlock .pic canvas{border-radius:6px;display:block;}
.dp-unlock-body{flex:1 1 auto;min-width:0;}
.dp-unlock-name{font-size:12.5px;font-weight:700;}
.dp-unlock-hint{font-size:10.5px;color:var(--ink-faint);margin-top:2px;
  font-variant-numeric:tabular-nums;}
.dp-unlock-hint b{color:var(--gold-soft);font-weight:700;}
.dp-unlock-bar{margin-top:6px;height:4px;border-radius:2px;
  background:rgba(255,255,255,0.06);overflow:hidden;}
.dp-unlock-bar span{display:block;height:100%;background:var(--gold-soft);
  border-radius:2px;transition:width .3s var(--ease);}

/* 类别构成 */
.dp-cat{padding:9px 0 4px;}
.dp-cat-h{font-size:10.5px;color:var(--ink-faint);margin-bottom:6px;letter-spacing:.3px;}
.dp-cat-bar{display:flex;height:14px;border-radius:4px;overflow:hidden;
  background:rgba(255,255,255,0.04);box-shadow:inset 0 1px 2px rgba(0,0,0,0.34);}
.dp-cat-bar i{height:100%;transition:width .3s var(--ease);}
.dp-cat-l{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;
  font-size:10.5px;color:var(--ink-faint);}
.dp-cat-l i{display:flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;}
.dp-cat-l .dot{width:8px;height:8px;border-radius:2px;display:inline-block;}
.dp-cat-l b{color:var(--ink);font-weight:700;}

/* ============================================================
   玩法页：分节全屏浮层
   ============================================================ */
.hp{
  padding:14px 0 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.hp:last-child{border-bottom:0;}
.hp-h{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
.hp-num{
  font-size:28px;font-weight:800;line-height:1;
  background:linear-gradient(180deg,#F5D483,#C08A2E);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  letter-spacing:0;flex:0 0 auto;
  text-shadow:0 0 14px rgba(232,182,76,0.15);
}
.hp-title{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.4px;}
.hp-sum{font-size:12.5px;color:var(--gold-soft);font-weight:700;letter-spacing:.2px;
  line-height:1.4;margin-bottom:6px;}
.hp-body{font-size:11.5px;color:var(--ink-dim);line-height:1.75;}
.hp-body em{font-style:normal;color:var(--ink);font-weight:700;}
.hp-body code{
  font-style:normal;padding:0 4px;border-radius:3px;
  background:rgba(255,255,255,0.08);color:#FFE7A6;font-size:10.5px;
  font-family:inherit;
}
.hp-visual{margin-top:8px;display:flex;align-items:center;gap:8px;
  font-size:10.5px;color:var(--ink-faint);}
.hp-visual .mini{height:6px;flex:0 0 auto;border-radius:2px;background:rgba(255,255,255,0.06);
  position:relative;overflow:hidden;}
.hp-visual .mini i{position:absolute;top:0;bottom:0;display:block;}

/* ============================================================
   市政面板（保持旧版排版原则：行+1px 细线、不用卡片）
   ============================================================ */
.uhero{padding:0 1px 11px;margin-bottom:2px;border-bottom:1px solid rgba(255,255,255,.055);}
.uhero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.uhero-title{
  font-size:22px;font-weight:800;letter-spacing:.8px;
  background:linear-gradient(92deg,#FFF3D6,var(--gold) 72%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 18px rgba(232,182,76,0.12);
}
.uhero-sub{font-size:10.5px;color:var(--ink-faint);margin-top:2px;letter-spacing:.2px;}
.uhero-rate{
  flex:0 0 auto;font-size:13px;font-weight:800;color:var(--gold-soft);
  font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(232,182,76,.30);
}
.uhero-bar{
  height:4px;border-radius:2px;margin-top:9px;background:rgba(255,255,255,.07);
  overflow:hidden;
}
.uhero-bar span{
  display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,#3F8F6A,var(--ok));
  transition:width .35s var(--ease);
}
.udiag{
  display:flex;align-items:flex-start;gap:7px;
  margin-top:10px;padding:7px 10px;border-radius:9px;
  font-size:11.5px;line-height:1.5;color:var(--ink-dim);
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
}
.udiag::before{
  content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;
  margin-top:5px;background:currentColor;
}
.udiag.ok{color:var(--ok);background:rgba(93,190,138,.09);border-color:rgba(93,190,138,.20);}
.udiag.warn{color:var(--warn);background:rgba(232,182,76,.09);border-color:rgba(232,182,76,.20);}
.udiag.bad{color:var(--bad);background:rgba(214,84,75,.10);border-color:rgba(214,84,75,.22);}

.ustats{margin-bottom:2px;}
.urow{
  display:flex;align-items:baseline;gap:10px;padding:8px 1px;
  border-bottom:1px solid rgba(255,255,255,.055);
}
.urow:last-child{border-bottom:0;}
.urow-k{
  flex:1 1 auto;font-size:11.5px;color:var(--ink-faint);letter-spacing:.3px;
}
.urow-v{
  flex:0 0 auto;min-width:62px;text-align:right;
  font-size:15px;font-weight:800;color:var(--gold-soft);
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.urow-n{
  flex:0 0 auto;min-width:66px;text-align:right;font-style:normal;
  font-size:10px;color:var(--ink-faint);letter-spacing:.2px;
}

.ucards{margin-bottom:2px;}
.ures{padding:9px 1px 10px;border-bottom:1px solid rgba(255,255,255,.055);}
.ures:last-child{border-bottom:0;}
.ures-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;}
.ures-n{flex:1 1 auto;font-size:12px;font-weight:700;color:var(--ink-dim);letter-spacing:.3px;}
.ures-v{
  flex:0 0 auto;font-size:12px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.ures-v.bad{color:var(--bad);}
.ures .mbar{height:4px;border-radius:2px;}
.ures .mbar span{background:var(--c);border-radius:2px;}
.ures .mbar.short span{background:linear-gradient(90deg,#A3433B,var(--bad));}

.udemand{display:flex;flex-direction:column;gap:2px;margin-bottom:2px;}
.udm{padding:9px 1px 10px;border-bottom:1px solid rgba(255,255,255,.055);}
.udm:last-child{border-bottom:0;}
.udm-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.udm .bar{
  position:relative;height:6px;border-radius:3px;
  background:rgba(255,255,255,.07);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.34);
}
.udm .fill{position:absolute;top:0;height:100%;border-radius:3px;transition:width .35s var(--ease);}
.tagt{font-size:12px;font-weight:700;letter-spacing:.3px;}
.tagt.res{color:#9CCB84;}
.tagt.com{color:#6FBEDC;}
.tagt.ind{color:#EFB65C;}
.udm-h span{font-size:10.5px;font-weight:700;color:var(--ink-faint);}
.udm-h span.up{color:var(--ok);}
.udm-h span.down{color:var(--warn);}

.mtitle{
  font-size:11px;font-weight:800;color:var(--ink-faint);letter-spacing:1.6px;
  margin:22px 0 4px;
}
.mtitle:first-child{margin-top:0;}
.mbar{
  height:12px;border-radius:6px;background:rgba(255,255,255,0.07);overflow:hidden;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.40), inset 0 1px 0 rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,0.04);
}
.mbar span{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,#3F8F6A,var(--ok));
  box-shadow:0 0 8px rgba(93,190,138,.5), inset 0 1px 0 rgba(255,255,255,.20);
  transition:width .3s var(--ease);}
.mbar.short span{background:linear-gradient(90deg,#A3433B,var(--bad));
  box-shadow:0 0 8px rgba(214,84,75,.5);}
.mtip{font-size:10.5px;color:var(--warn);margin-top:5px;line-height:1.5;}
.mtip.box{
  margin-top:0;padding:10px 12px;border-radius:11px;
  font-size:11px;color:var(--ink-dim);line-height:1.65;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
}

/* ---------- 拼豆台 ---------- */
#buildView{background:rgba(9,12,18,0.97);}
.bv-head{
  flex:0 0 auto;position:relative;display:flex;align-items:center;gap:10px;
  padding:10px 14px 9px;border-bottom:1px solid var(--line);
}
.bv-info{flex:1 1 auto;min-width:0;}
.bv-name{font-size:14px;font-weight:800;letter-spacing:.5px;}
.bv-meta{font-size:10px;color:var(--ink-faint);margin-top:1px;}
.bv-pct{font-size:16px;font-weight:800;color:var(--gold-soft);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.bv-stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;}
#boardCanvas{max-width:100%;max-height:100%;}
.palette{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;
  padding:8px 10px;max-height:120px;overflow-y:auto;
}
.bead{
  width:38px;height:38px;border-radius:50%;position:relative;flex:0 0 auto;
  border:2px solid transparent;transition:transform .18s var(--ease-back);
}
.bead.sel{transform:scale(1.18);border-color:#fff;box-shadow:0 0 0 3px rgba(232,182,76,.35);}
.bead .cnt{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;
  border-radius:8px;background:rgba(10,14,20,.9);border:1px solid var(--line);
  font-size:9px;line-height:15px;text-align:center;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;
}
.bead.done .cnt{background:var(--ok);color:#0B2B1A;border-color:transparent;}
.bv-dock{
  flex:0 0 auto;position:relative;display:flex;gap:6px;
  padding:9px 10px calc(10px + var(--safe-bottom));
  border-top:1px solid var(--line);
  background:linear-gradient(0deg, rgba(38,49,66,.5), rgba(38,49,66,0));
}
.bv-dock::before{
  content:"";position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(232,182,76,.28), transparent);
}
.bv-dock button{
  flex:1 1 0;height:52px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:700;letter-spacing:.4px;
  background:linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.10);color:var(--ink-dim);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 2px 8px rgba(0,0,0,.24);
  transition:transform .14s var(--ease),background .2s,color .2s,border-color .2s;
}
.bv-dock button svg{
  width:20px;height:20px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.bv-dock button:active{transform:scale(.94);}
.bv-dock button.on{
  background:rgba(232,182,76,.2);border-color:var(--gold);color:var(--gold-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 0 12px rgba(232,182,76,.22);
}

/* ---------- 弹窗 / toast ---------- */
#modal{align-items:center;justify-content:center;background:rgba(8,11,17,.82);padding:20px;}
.modal-card{
  width:100%;max-width:330px;max-height:80vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#27323F,#1B2432);
  border:1px solid rgba(255,255,255,.11);
  border-radius:18px;padding:18px 16px 14px;text-align:center;
  box-shadow:0 20px 54px rgba(0,0,0,.56), inset 0 1px 0 rgba(255,255,255,.09);
  transform:translateY(10px) scale(.96);transition:transform .28s var(--ease-back);
}
#modal.show .modal-card{transform:none;}
.modal-title{font-size:16px;font-weight:800;letter-spacing:.6px;color:var(--gold-soft);
  text-shadow:0 0 14px rgba(232,182,76,.26);}
.modal-body{font-size:12.5px;line-height:1.75;color:var(--ink-dim);margin:10px 0 14px;
  text-align:left;overflow-y:auto;}
.modal-body b{color:var(--ink);font-weight:700;}
.modal-body .row{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.08);
  padding:4px 0;}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{
  flex:1 1 0;height:40px;border-radius:11px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.08);color:var(--ink-dim);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .14s var(--ease);
}
.modal-btns button:active{transform:scale(.94);}
.modal-btns button.main{
  background:linear-gradient(180deg,#F7DA96,var(--gold) 62%,#DDA63C);color:#3A2A08;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 8px rgba(232,182,76,.28);
}
/* modal 里的「破坏性操作」按钮：常驻红底红描边红字。
   跟 .ov-foot button.ghost 同口径——低频但不可逆的操作要在第一眼就找得到，
   取消按钮仍是金黄高亮（主操作），两个不会撞色。 */
.modal-btns button.ghost{
  background:linear-gradient(180deg, rgba(214,84,75,.22), rgba(214,84,75,.10));
  border:1px solid rgba(214,84,75,.48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 8px rgba(214,84,75,.14);
  color:#F09086;
  transition:transform .14s var(--ease),background .2s var(--ease),
             color .2s var(--ease),border-color .2s var(--ease);
}
.modal-btns button.ghost:active{
  transform:scale(.94);
  background:linear-gradient(180deg, rgba(214,84,75,.44), rgba(214,84,75,.28));
  border-color:rgba(214,84,75,.78);
  color:#FFDEDA;
}
#toast{
  position:fixed;left:50%;bottom:calc(76px + var(--safe-bottom));transform:translate(-50%,10px);
  z-index:40;max-width:80vw;padding:10px 18px;border-radius:21px;
  background:linear-gradient(180deg, rgba(38,49,66,.97), rgba(18,24,34,.97));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 6px 22px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.09);
  font-size:12.5px;color:var(--ink);letter-spacing:.4px;
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease);
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 窄屏适配 ---------- */
@media (max-width:360px){
  .tab{height:26px;padding:0 8px;font-size:11px;gap:4px;}
  .tab b{display:none;}
  .ov-bar{padding:7px 10px 8px;}
  .tabs{gap:5px;}
  .hud-stat{min-width:48px;padding:6px 8px 6px;}
  .hud-stat b{font-size:14.5px;}
  .hud-left{padding:8px 10px 7px 11px;}
  .city-name{font-size:17px;}
}
@media (max-height:620px){
  #hud{padding-top:calc(7px + var(--safe-top));padding-bottom:7px;}
  .city-name{font-size:15px;}
  #demand{gap:5px;padding:5px 10px 6px;}
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars"></div>
<canvas id="dust"></canvas>

<div id="app">
  <header id="hud">
    <div class="hud-left">
      <div class="city-name" id="cityName">荒地</div>
      <div class="city-sub" id="citySub">人口 0 · 岗位 0</div>
    </div>
    <div class="hud-stats">
      <div class="hud-stat"><b id="vCoins" class="gold">0</b><span>金币</span></div>
      <div class="hud-stat"><b id="vPop" class="pop">0</b><span>人口</span></div>
      <div class="hud-stat"><b id="vHappy" class="happy">50</b><span>幸福</span></div>
    </div>
    <button id="btnSound" class="hud-snd" aria-label="声音开关">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9.4h3.3L12 5.4v13.2L7.3 14.6H4z"/><path d="M15.7 9.2a4.2 4.2 0 0 1 0 5.6"/><path d="M18.2 6.6a7.7 7.7 0 0 1 0 10.8"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9.4h3.3L12 5.4v13.2L7.3 14.6H4z"/><path d="M16.2 9.6l4.8 4.8"/><path d="M21 9.6l-4.8 4.8"/></svg>
    </button>
  </header>

  <div id="demand">
    <div class="dm r"><i>住</i><div class="bar"><span class="fill pos" id="dR"></span></div></div>
    <div class="dm c"><i>商</i><div class="bar"><span class="fill pos" id="dC"></span></div></div>
    <div class="dm i"><i>工</i><div class="bar"><span class="fill pos" id="dI"></span></div></div>
  </div>

  <div id="cityWrap">
    <canvas id="cityCanvas"></canvas>
    <div class="hint" id="hintText">点一块空地，从蓝图挑一栋来拼</div>
  </div>

  <nav id="dock">
    <button id="btnBlueprint" class="primary">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      <span>蓝图</span>
    </button>
    <button id="btnUtil">
      <svg viewBox="0 0 24 24"><path d="M3.5 17a9 9 0 1 1 17 0"/><path d="M12 17l4.4-4.9"/><circle cx="12" cy="17" r="1.5"/></svg>
      <span>市政</span>
    </button>
    <button id="btnData">
      <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M6.5 21V12"/><path d="M12 21V5.5"/><path d="M17.5 21v-6"/></svg>
      <span>数据</span>
    </button>
    <button id="btnHelp">
      <svg viewBox="0 0 24 24"><path d="M12 6.5C10.4 5 8.4 4.4 4.5 4.4v13.2c3.9 0 5.9.6 7.5 2.1 1.6-1.5 3.6-2.1 7.5-2.1V4.4c-3.9 0-5.9.6-7.5 2.1z"/><path d="M12 6.5v13.2"/></svg>
      <span>玩法</span>
    </button>
  </nav>
</div>

<!-- 蓝图：选建筑 + 底部 dock 单条 CTA -->
<section id="blueprintView" class="overlay">
  <div class="ov-head">
    <div class="ov-title-wrap">
      <div class="ov-title">蓝图</div>
      <div class="ov-sub" id="bpSub">一栋一图一命运</div>
    </div>
  </div>
  <div class="ov-bar"><div id="bpTabs" class="tabs"></div></div>
  <div class="ov-scroll" id="bpScroll">
    <div class="bp-intro" id="bpIntro">点选下方任一缩略图，<b>底部一键建造</b>。</div>
    <div id="bpFeature"></div>
    <div class="bp-strip-wrap">
      <div class="bp-strip-label" id="bpStripLabel">本类图纸</div>
      <div class="bp-strip" id="bpStrip"></div>
    </div>
  </div>
  <div class="bp-dock">
    <div class="bp-dock-info">
      <div class="nm" id="bpDockName">—</div>
      <div class="mt" id="bpDockMeta">—</div>
    </div>
    <button class="bp-dock-cta" id="bpDockCta">选择建筑</button>
    <button class="bp-dock-x" id="bpClose" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      <span>关闭</span>
    </button>
  </div>
</section>

<!-- 数据：全屏浮层 + SVG 图表 -->
<section id="dataView" class="overlay">
  <div class="ov-head">
    <div class="ov-title-wrap">
      <div class="ov-title">城市数据</div>
      <div class="ov-sub">诊断 · 收入 · 水电网 · 解锁 · 构成</div>
    </div>
  </div>
  <div class="ov-scroll has-foot" id="dataScroll">
    <div class="dp-title">
      <div class="dp-title-l">
        <b id="dpCityName">荒地</b>
        <span id="dpCitySub">人口 0 / 0 · 建筑 0 栋</span>
      </div>
      <div class="dp-title-r" id="dpRate">+0 / 分</div>
    </div>

    <!-- 圆环：幸福度 -->
    <div class="dp-ring-row">
      <svg id="dpRing" width="120" height="120" viewBox="0 0 120 120"></svg>
      <div class="dp-ring-body">
        <div class="dp-ring-lbl">城市幸福度</div>
        <div class="dp-ring-val"><span id="dpHappyVal">50</span><b> · 100</b></div>
        <div class="dp-ring-mood" id="dpHappyMood">平静</div>
      </div>
    </div>

    <!-- 收入堆叠条 -->
    <div class="dp-inc">
      <div class="dp-inc-h">
        <span>收入构成</span>
        <b id="dpIncTotal">+0 / 分</b>
      </div>
      <div class="dp-stack" id="dpIncStack"></div>
      <div class="dp-stack-l" id="dpIncLegend"></div>
    </div>

    <!-- 资源 4 行 -->
    <div class="mtitle" style="margin-top:18px">市政负荷</div>
    <div id="dpUtils"></div>

    <!-- 解锁进度 -->
    <div class="mtitle">下一张图纸</div>
    <div class="dp-unlock" id="dpUnlock"></div>

    <!-- 类别构成 -->
    <div class="mtitle">建筑构成</div>
    <div class="dp-cat">
      <div class="dp-cat-bar" id="dpCatBar"></div>
      <div class="dp-cat-l" id="dpCatLegend"></div>
    </div>
  </div>
  <div class="ov-foot">
    <div class="ov-foot-note" id="dpFootNote">数据每刻都在变，随时回来看</div>
    <button id="btnReset" class="ghost">
      <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.2 4.4v4.6h4.6"/></svg>
      <span>重置城市</span>
    </button>
    <button id="dataClose">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      <span>关闭</span>
    </button>
  </div>
</section>

<!-- 玩法：分节全屏浮层 -->
<section id="helpView" class="overlay">
  <div class="ov-head">
    <div class="ov-title-wrap">
      <div class="ov-title">玩法图鉴</div>
      <div class="ov-sub">六条心法，把豆子变成城市</div>
    </div>
  </div>
  <div class="ov-scroll has-foot" id="helpScroll">
    <!-- hp 段由 JS 注入：避免内联一堆 HTML 重复 -->
    <div id="helpBody"></div>
  </div>
  <div class="ov-foot">
    <div class="ov-foot-note">随时回来翻，<b>第六条</b>最容易忘</div>
    <button id="helpClose">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      <span>关闭</span>
    </button>
  </div>
</section>

<!-- 市政面板（保留原版） -->
<section id="utilView" class="overlay">
  <div class="ov-head">
    <div class="ov-title-wrap">
      <div class="ov-title">市政面板</div>
      <div class="ov-sub" id="utilSub">电 · 水 · 环卫 · 需求</div>
    </div>
  </div>
  <div class="ov-scroll has-foot"><div id="utilBody"></div></div>
  <div class="ov-foot">
    <div class="ov-foot-note">诊断在上，缺什么补什么，别一次铺太开</div>
    <button id="utilClose">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      <span>关闭</span>
    </button>
  </div>
</section>

<!-- 拼豆台（保留原版） -->
<section id="buildView" class="overlay">
  <div class="bv-head">
    <div class="bv-info">
      <div class="bv-name" id="bvName">—</div>
      <div class="bv-meta" id="bvMeta">—</div>
    </div>
    <div class="bv-pct" id="bvPct">0%</div>
  </div>
  <div class="bv-stage"><canvas id="boardCanvas"></canvas></div>
  <div class="palette" id="palette"></div>
  <div class="bv-dock">
    <button id="bvBack">
      <svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
      <span>返回</span>
    </button>
    <button id="btnEraser">
      <svg viewBox="0 0 24 24"><path d="M7.5 20.5H21"/><path d="M12.6 4.8l6.6 6.6a1.7 1.7 0 0 1 0 2.3l-5.1 5.1H9.2l-5-5a1.7 1.7 0 0 1 0-2.3l6.2-6.2a1.7 1.7 0 0 1 2.2 0z"/><path d="M9.2 13.2l5.8 5.6"/></svg>
      <span>橡皮</span>
    </button>
    <button id="btnHint">
      <svg viewBox="0 0 24 24"><path d="M9.5 18.5h5"/><path d="M10.8 21.2h2.4"/><path d="M12 2.8a6.2 6.2 0 0 0-3.7 11.2c.5.4.8 1 .8 1.6v.4h5.8v-.4c0-.6.3-1.2.8-1.6A6.2 6.2 0 0 0 12 2.8z"/></svg>
      <span>提示</span>
    </button>
    <button id="btnClear">
      <svg viewBox="0 0 24 24"><path d="M4 6.8h16"/><path d="M9.8 3.8h4.4"/><path d="M6.2 6.8l1 12.4a1.8 1.8 0 0 0 1.8 1.8h6a1.8 1.8 0 0 0 1.8-1.8l1-12.4"/><path d="M10.2 10.8v6M13.8 10.8v6"/></svg>
      <span>清空</span>
    </button>
  </div>
</section>

<!-- 通用弹窗（确认类） -->
<div id="modal" class="overlay">
  <div class="modal-card">
    <div class="modal-title" id="mdTitle"></div>
    <div class="modal-body" id="mdBody"></div>
    <div class="modal-btns" id="mdBtns"></div>
  </div>
</div>

<div id="toast"></div>

<script src="./main.js"></script>
</body>
</html>
