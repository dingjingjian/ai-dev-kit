<title>核战危机 DEFCON</title>
<!-- 内联空图标：http 场景下抑制浏览器默认的 /favicon.ico 请求（404 会污染冒烟的错误计数） -->
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#05080d; --panel:rgba(10,18,26,.82); --line:rgba(127,212,232,.22);
    --cyan:#7fd4e8; --cyan-dim:#4a8ba0; --amber:#f0b429; --red:#e24b4a;
    --text:#c6d8e2; --text-dim:#6d8899;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;user-select:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* 扫描线 + 暗角：军事终端质感，纯 CSS 不额外消耗 draw call */
  #scan{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(180deg,rgba(127,212,232,.035) 0 1px,transparent 1px 3px)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%)}

  .hud{position:fixed;z-index:10;font-family:var(--mono);font-size:12px;line-height:1.5}
  .panel{background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  /* 顶栏：DEFCON 等级 + 危机值 */
  #top{top:0;left:0;right:0;display:flex;align-items:stretch;
    gap:1px;padding:0;border-bottom:1px solid var(--line);background:var(--panel)}
  #defcon{padding:10px 16px;display:flex;flex-direction:column;gap:2px;min-width:112px;
    border-right:1px solid var(--line)}
  #defcon .lv{font-size:26px;font-weight:700;letter-spacing:2px;color:var(--cyan);
    text-shadow:0 0 14px rgba(127,212,232,.5)}
  #defcon .lb{font-size:10px;color:var(--text-dim);letter-spacing:3px}
  #defcon.d1 .lv{color:var(--red);text-shadow:0 0 16px rgba(226,75,74,.65)}
  #defcon.d2 .lv{color:var(--amber);text-shadow:0 0 14px rgba(240,180,41,.5)}

  #crisis{flex:1;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  #crisis .row{display:flex;justify-content:space-between;font-size:10px;
    color:var(--text-dim);letter-spacing:1px}
  #bar{height:5px;background:rgba(127,212,232,.1);overflow:hidden}
  #bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,#3d8fa8,var(--amber),var(--red));
    transition:width .35s ease}
  #phase{padding:10px 16px;display:flex;flex-direction:column;justify-content:center;
    align-items:flex-end;gap:2px;border-left:1px solid var(--line);min-width:130px}
  #phase .pt{font-size:13px;color:var(--text);letter-spacing:1px}
  #phase .pd{font-size:10px;color:var(--text-dim)}

  /* 左侧阵营列表 */
  #side{left:12px;top:74px;width:196px;padding:8px}
  #side h4{font-size:10px;color:var(--text-dim);letter-spacing:2px;font-weight:400;
    padding:2px 4px 6px}
  .frow{display:flex;align-items:center;gap:6px;padding:3px 4px;font-size:11px}
  .frow .sw{width:8px;height:8px;flex:none;border-radius:1px}
  .frow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow .pp{color:var(--text-dim);font-variant-numeric:tabular-nums}
  .frow.dead{opacity:.35}
  .frow.me .nm{color:#fff}

  /* 右下城市列表 */
  #cities{right:12px;bottom:12px;width:210px;max-height:40vh;overflow:auto;padding:8px}
  #cities h4{font-size:10px;color:var(--text-dim);letter-spacing:2px;font-weight:400;
    padding:2px 4px 6px;position:sticky;top:-8px;background:var(--panel);margin:-8px -8px 0;padding:8px 12px 6px}
  .crow{display:flex;justify-content:space-between;gap:6px;padding:2px 4px;font-size:11px;cursor:pointer}
  .crow:hover{background:rgba(127,212,232,.09)}
  .crow .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .cp{color:var(--text-dim);font-variant-numeric:tabular-nums}
  .crow.gone{opacity:.3;text-decoration:line-through;cursor:default}
  /* 战争阶段：敌方存活城市即可打击目标 */
  .crow.tgt .cn::before{content:"◎ ";color:var(--red);font-size:9px}
  .crow.tgt:hover{background:rgba(226,75,74,.16)}

  /* 底部事件卡 */
  #card{left:50%;transform:translateX(-50%);bottom:12px;width:min(560px,calc(100vw - 24px));
    padding:14px 16px;display:none}
  #card.show{display:block}
  #card .ct{font-family:var(--sans);font-size:15px;color:#fff;margin-bottom:5px}
  #card .cd{font-family:var(--sans);font-size:12px;color:var(--text-dim);
    line-height:1.6;margin-bottom:11px}
  .opts{display:flex;flex-direction:column;gap:5px}
  .opt{text-align:left;background:rgba(127,212,232,.06);border:1px solid var(--line);
    color:var(--text);padding:8px 11px;font-family:var(--sans);font-size:12.5px;
    cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
  .opt:hover{background:rgba(127,212,232,.15)}
  .opt.sel{background:rgba(127,212,232,.24);border-color:var(--cyan)}
  .opt .ol{flex:1}
  .opt .oe{font-size:10.5px;color:var(--amber);opacity:.85;white-space:nowrap}
  .opt .or{display:flex;align-items:center;gap:7px;flex:none}
  .opt .cc{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
  .opt .cc.up{color:var(--red)} .opt .cc.down{color:var(--cyan)} .opt .cc.zero{color:var(--text-dim)}
  .opt .kk{font-size:9px;color:var(--text-dim);border:1px solid var(--line);
    padding:0 4px;line-height:14px}
  #card .timer{height:2px;background:rgba(127,212,232,.12);margin-bottom:11px}
  #card .timer i{display:block;height:100%;background:var(--cyan)}

  /* 战争操作条（与事件卡互斥，同位置）*/
  #warbar{left:50%;transform:translateX(-50%);bottom:12px;padding:9px 15px;display:none;
    align-items:center;gap:14px;white-space:nowrap}
  #warbar.show{display:flex}
  #warbar .am{font-size:11px;color:var(--text-dim);letter-spacing:1px}
  #warbar .am b{color:var(--cyan);font-size:16px;margin-left:6px;font-variant-numeric:tabular-nums}
  #warbar.empty .am b{color:var(--red)}
  #warbar .tip{font-size:10.5px;color:var(--text-dim)}
  #warbar{max-width:calc(100vw - 24px);overflow:hidden}
  #warbar.deny{animation:deny .45s ease}
  @keyframes deny{0%,100%{border-color:var(--line)}45%{border-color:var(--red)}}

  /* 终局 */
  #over{left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 24px));
    padding:20px;display:none}
  #over.show{display:block}
  #over h2{font-family:var(--sans);font-size:17px;color:#fff;font-weight:600;margin-bottom:3px}
  #over .sub{font-size:11px;color:var(--text-dim);margin-bottom:14px}
  #over table{width:100%;border-collapse:collapse;font-size:11.5px}
  #over th{text-align:left;font-weight:400;color:var(--text-dim);font-size:10px;
    letter-spacing:1px;padding:0 4px 6px;border-bottom:1px solid var(--line)}
  #over td{padding:5px 4px;border-bottom:1px solid rgba(127,212,232,.08)}
  #over td.sc{font-variant-numeric:tabular-nums;color:#fff}
  #over tr.me td{background:rgba(127,212,232,.08)}
  #again{margin-top:15px;width:100%;background:rgba(127,212,232,.08);border:1px solid var(--line);
    color:var(--cyan);padding:9px;font-family:var(--mono);font-size:12px;letter-spacing:2px;
    cursor:pointer}
  #again:hover{background:rgba(127,212,232,.18)}

  /* 载入 / 兜底 */
  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:12px;background:var(--bg);
    font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:2px}
  #loader.hide{display:none}
  #fallback{position:fixed;inset:0;z-index:60;display:none;align-items:center;
    justify-content:center;flex-direction:column;gap:10px;background:var(--bg);
    padding:24px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--text-dim)}
  #fallback.show{display:flex}
  #fallback b{color:var(--cyan);font-size:14px;font-weight:400}

  @media (max-width:720px){
    #side{display:none}
    #cities{width:150px;max-height:30vh}
    #defcon{min-width:88px;padding:8px 11px}
    #defcon .lv{font-size:21px}
    #phase{min-width:96px}
  }
</style>
</head>
