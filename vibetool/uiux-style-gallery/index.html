<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>设计风格图鉴</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#a1a1a6;
  --line:#e6e6eb; --line-2:#f0f0f3; --accent:#0071e3; --accent-soft:#eaf3ff;
  --safe-top:var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --safe-bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --safe-l:var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
  --safe-r:var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  --bar-h:56px; --page:640px; --radius:18px;
  --ease:cubic-bezier(.2,.7,.3,1);
  --sh-1:0 1px 2px rgba(16,17,20,.04), 0 8px 22px -14px rgba(16,17,20,.22);
  --sh-2:0 2px 6px rgba(16,17,20,.06), 0 18px 40px -18px rgba(16,17,20,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--bg); min-height:100%;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  touch-action:manipulation;
  padding-left:var(--safe-l); padding-right:var(--safe-r);
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;font-size:inherit;}
code,pre{font-family:"SF Mono",Menlo,Consolas,monospace;}

/* ============ 顶栏（吸顶容器：topbar + tabs 合一，免硬编码偏移） ============ */
.topwrap{
  position:sticky; top:0; z-index:20;
  padding-top:var(--safe-top);
  background:rgba(245,245,247,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.topbar{
  max-width:var(--page); margin:0 auto;
  display:flex; align-items:center; 
  height:var(--bar-h); padding:0 12px;
}
.topbar h1{font-size:17px; font-weight:600; letter-spacing:-.02em; flex:1; text-align:center;}
.topbar .spacer{width:36px; flex-shrink:0;}

/* 分类 tab：短名 + 自动换行，不用横向滚动。
   （1）横滑＝在吸顶栏里再套一个滚动容器，低端 Android（Chrome 61 / Android 8）上会让
       吸顶栏在滑动时渲染残缺，表现为「往下滑显示不全」；且横滑必然把右侧分类推到屏幕外
       点不到。改为 flex-wrap 换行后 5 个分类任何时候都点得到（分组标题仍显示全名）。
   （2）标签必须取短名（2 字），且整行要留出 ~30px 余量：Android 8 的中文字体比新机
       略宽、逐元素宽度取整也会多出十几 px，360px 屏下 3 字标签（落地页/仪表板）会把
       整行顶到第二行换行（新机上却刚好放得下），短名后各机型都是单行。
   （3）间距走子项 margin：Chrome <84 没有 flex gap，基线为 Chrome 61。
   echarts-gallery 从首版起就是「短名 + 换行」，真机无此问题，两边保持一致。 */
.tabs{
  max-width:var(--page); margin:0 auto;
  display:flex; flex-wrap:wrap;
  padding:0 12px 4px;
}
.tab{
  flex-shrink:0; margin:0 6px 8px 0; padding:7px 11px; border-radius:999px;
  font-size:13px; font-weight:500; color:var(--ink-2);
  background:var(--card); border:1px solid var(--line); white-space:nowrap;
  transition:background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
}
.tab:active{transform:scale(.95);}
.tab.active{
  background:var(--ink); color:#fff; border-color:var(--ink);
  box-shadow:0 3px 10px -4px rgba(0,0,0,.5);
}

/* ============ 列表 ============ */
.list{max-width:var(--page); margin:0 auto; padding:16px 16px calc(36px + var(--safe-bottom));}
.section{margin-bottom:26px;}
.section-head{display:flex; align-items:baseline;  margin:0 4px 12px;}
.section-head h2{font-size:16px; font-weight:600; letter-spacing:-.01em;}
.section-head .en{font-size:12px; color:var(--ink-3);}
.section-head .cnt{
  margin-left:auto; font-size:11px; font-weight:500; color:var(--ink-2);
  background:rgba(29,29,31,.05); padding:3px 9px; border-radius:999px;
}
.grid{display:grid; grid-template-columns:1fr; grid-gap:14px;}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr;}}

/* ============ 卡片 ============ */
.card{
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--sh-1); cursor:pointer;
  transition:transform .22s var(--ease), box-shadow .22s var(--ease);
}
@media(hover:hover){
  .card:hover{transform:translateY(-3px); box-shadow:var(--sh-2);}
  .card:hover .chev{color:var(--accent); transform:translateX(2px);}
}
.card:active{transform:scale(.985);}

/* 预览区同时是「混合隔离组」（isolation:isolate）。
   .d67（RGB 分离故障）用了 mix-blend-mode:screen：混合元素的底衬默认要回溯到最近的
   隔离组，页面里没有任何隔离组时会一直落到根，Chrome 于是为整页生成一个高 15417px
   的「不可滚动」合成层（实测 h=15417，DPR3 下 ≈ 46000 设备像素）。不可滚动层要整块
   光栅化，超过 GPU 纹理上限（4096 设备像素）后只画得出最上面一段 —— 安卓 8 上表现
   就是首页往下滑，滑到「活力色块」之后整片空白（4096/3 ≈ 1365 CSS px 正好落在那张
   卡片中间）。同理，filter / backdrop-filter 的渲染表面也被这里挡住不再外溢。
   在 .demo 上建立隔离组后巨型层消失（实测非滚动层最大只剩 640px = 视口高度），
   且观感不变：d67 自己有不透明黑底，混合结果与之前一致。
   isolation 是 Chrome 41+ 能力，基线 Chrome 61 可用；自检见 _dev/layer_check.py。 */
.demo{
  position:relative; height:140px; overflow:hidden; isolation:isolate;
  background:#fff; border-bottom:1px solid var(--line-2);
}
.card-info{padding:13px 14px 14px;}
.card-head{display:flex; align-items:center; }
.card-head .name{font-size:15px; font-weight:600; letter-spacing:-.01em; flex:1; min-width:0;}
.chev{width:15px; height:15px; color:var(--ink-3); flex-shrink:0; transition:transform .22s var(--ease), color .22s var(--ease);}
.card-info .desc{font-size:12px; color:var(--ink-2); margin-top:4px; line-height:1.5;}

/* ============ 详情 ============ */
.detail{max-width:var(--page); margin:0 auto; padding:16px 16px calc(48px + var(--safe-bottom));}
.hero{border-radius:20px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--sh-1); margin-bottom:18px;}
.detail .cat-badge{
  display:inline-block; padding:4px 11px; border-radius:999px;
  font-size:11px; font-weight:500; background:var(--accent-soft); color:var(--accent);
  margin-bottom:10px;
}
.detail h2{font-size:23px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px;}
.detail .en-name{font-size:13px; color:var(--ink-3); margin-bottom:20px;}
.block{
  background:var(--card); border-radius:16px; border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,17,20,.03);
  padding:16px; margin-bottom:14px;
}
.block h3{font-size:14px; font-weight:600; margin-bottom:11px; display:flex; align-items:center; }
/* 竖线与标题的间距：flex gap 在 Chrome<84 无效，且 ::before 与文字（匿名 flex item）无法被
   `> * + *` 兜底规则命中，故间距直接写在 ::before 的 margin 上（新旧内核表现一致） */
.block h3::before{content:""; width:3px; height:14px; border-radius:2px; background:var(--accent); flex-shrink:0; margin-right:8px;}
.h3-b::before{background:#7c5cff !important;}
.h3-c::before{background:#ff9f0a !important;}
.h3-d::before{background:#30b357 !important;}
.block p{font-size:14px; line-height:1.65; color:var(--ink);}
.block p.hint{font-size:12.5px; color:var(--ink-2); line-height:1.55;}

/* AI 提示词 */
.prompt-box{background:#1d1d1f; border-radius:12px; padding:14px; margin-top:11px; border:1px solid rgba(255,255,255,.07);}
.prompt-box pre{
  color:#e8e8ed; font-size:12.5px; line-height:1.68;
  white-space:pre-wrap; word-break:normal; overflow-wrap:break-word;overflow-wrap:anywhere;
  -webkit-user-select:text; user-select:text;
}
.copy-btn{
  margin-top:11px; padding:9px 18px; border-radius:999px;
  background:var(--accent); color:#fff; font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; 
  box-shadow:0 6px 16px -8px rgba(0,113,227,.9);
  transition:transform .18s var(--ease), background .18s var(--ease);
}
/* 同理：图标与文字之间也靠 margin 留白（`> * + *` 命不中文字节点） */
.copy-btn svg{width:14px; height:14px; margin-right:6px;}
.copy-btn:active{transform:scale(.96);}
.copy-btn.done{background:#34c759; box-shadow:0 6px 16px -8px rgba(52,199,89,.9);}

/* 配色 */
.swatches{display:flex; flex-wrap:wrap; }
.swatch{display:flex; flex-direction:column; align-items:center;  width:62px;}
.swatch .chip{
  width:52px; height:52px; border-radius:14px;
  border:1px solid rgba(0,0,0,.07);
  box-shadow:0 3px 8px -3px rgba(0,0,0,.28);
}
.swatch .hex{font-size:10px; color:var(--ink-3); font-family:"SF Mono",Menlo,Consolas,monospace;}
.swatch .cname{font-size:11px; color:var(--ink-2);}

/* 适用场景 */
.scene{display:flex; }
.scene .col{flex:1; min-width:0; padding:13px 14px; border-radius:14px; border:1px solid;}
.scene .col h4{font-size:12px; font-weight:600; margin-bottom:6px;}
.scene .col p{font-size:12.5px; line-height:1.6; color:inherit; opacity:.88;}
.scene .col.good{background:#f0f9f1; border-color:#dbeee0;}
.scene .col.good h4{color:#1a7a35;}
.scene .col.good p{color:#2c5a3a;}
.scene .col.bad{background:#fdf1f1; border-color:#f6dcdc;}
.scene .col.bad h4{color:#a81a1a;}
.scene .col.bad p{color:#5a2d2d;}

/* toast */
.toast{
  position:fixed; left:50%; bottom:calc(32px + var(--safe-bottom));
  transform:translateX(-50%) translateY(16px);
  background:rgba(29,29,31,.92); color:#fff; padding:10px 18px; border-radius:12px;
  font-size:13px; opacity:0; pointer-events:none; z-index:100;
  transition:opacity .3s var(--ease), transform .3s var(--ease);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ==================================================================
   67 种风格 CSS 迷你 demo
   ------------------------------------------------------------------
   约定：
   1) 每个 demo 根节点由 `.demo-body > *` 撑满（width/height 100%），
      因此背景、渐变、网格、绝对定位子元素都能铺满整块预览区。
   2) 所有尺寸用 em，基准字号由 `.demo-body` 控制：
      卡片 11px / 详情页 16px —— 同一套 demo 自动等比缩放。
   3) 类名一律 `.d<编号>`，编号与参照站一致（1-68，缺 54）。
   ================================================================== */
.demo-body{position:absolute; top:0;right:0;bottom:0;left:0; overflow:hidden; font-size:11px;}
.demo-body > *{width:100%; height:100%; position:relative;}

/* ---------- 通用 General ---------- */

/* 1 极简瑞士风 */
.d1{background:#fff; padding:1.5em; display:flex; flex-direction:column; justify-content:space-between;}
.d1 .tag{font-size:.86em; letter-spacing:.24em; font-weight:700; color:#000;}
.d1 .big{font-size:2.15em; font-weight:800; line-height:1.05; letter-spacing:-.03em; color:#000; margin-top:.25em;}
.d1 .row3{display:flex;  border-top:.14em solid #000; padding-top:.55em;}
.d1 .row3 span{font-size:1.35em; font-weight:900; letter-spacing:-.02em; color:#000;}
.d1 .sq{position:absolute; right:1.5em; top:1.5em; width:2.1em; height:2.1em; background:#000;}

/* 2 新拟态 */
.d2{background:#e8ecf2; padding:1.2em; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; grid-gap:1em;}
.d2 > *{border-radius:1.1em; background:#e8ecf2; display:flex; align-items:center; justify-content:center; font-size:1em; font-weight:600; color:#5c6b80; overflow:hidden;}
.d2 .pad{box-shadow:-.5em -.5em 1em rgba(255,255,255,.95), .5em .5em 1em rgba(163,177,198,.65);}
.d2 .in{box-shadow:inset -.4em -.4em .8em rgba(255,255,255,.95), inset .4em .4em .8em rgba(163,177,198,.65); color:#96a3b6; font-weight:400;}
.d2 .rnd{border-radius:50%; box-shadow:-.5em -.5em 1em rgba(255,255,255,.95), .5em .5em 1em rgba(163,177,198,.65); font-size:.95em;}
.d2 .bar{box-shadow:inset -.4em -.4em .8em rgba(255,255,255,.95), inset .4em .4em .8em rgba(163,177,198,.65);}
.d2 .bar i{width:58%; height:.5em; border-radius:.25em; background:#7c93b8; box-shadow:0 0 .5em rgba(124,147,184,.7);}

/* 3 毛玻璃 */
.d3{background:linear-gradient(135deg,#ff3d8b 0%,#5b8def 52%,#7b5bff 100%); display:flex; align-items:center; padding:0 1.4em;}
.d3 .glass{
  width:100%; padding:1.2em 1.1em; border-radius:1.3em;
  background:rgba(255,255,255,.30);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:.14em solid rgba(255,255,255,.72);
  box-shadow:0 .5em 1.6em rgba(70,50,150,.3), inset 0 .12em 0 rgba(255,255,255,.6);
}
.d3 .glass .t{font-size:1.15em; font-weight:700; color:#171733;}
.d3 .glass .l{height:.5em; border-radius:.3em; background:rgba(90,70,180,.5); margin-top:.65em;}
.d3 .glass .l:nth-child(3){width:65%; background:rgba(255,61,139,.62);}

/* 4 粗野主义 */
.d4{background:#fff; padding:1.3em; display:flex; flex-direction:column; justify-content:center;  font-family:"Times New Roman",Georgia,serif;}
.d4 .h{font-size:2.2em; font-weight:900; line-height:.95; letter-spacing:-.02em; color:#000;}
.d4 .row{display:flex; align-items:center; }
.d4 .blk{width:2.6em; height:2.6em; flex-shrink:0; background:#000;}
.d4 .txt{font-size:1em; line-height:1.5; color:#111;}
.d4 .lnk{align-self:flex-start; font-size:.95em; font-weight:700; color:#000; border-bottom:.18em solid #000;}

/* 5 3D 超写实 */
.d5{background:radial-gradient(circle at 50% 32%,#2a2f45,#0d1020 72%); display:flex; align-items:center; justify-content:center; perspective:40em;}
.d5 .cube{
  width:4.4em; height:4.4em; border-radius:1em; position:relative;
  background:linear-gradient(145deg,#8fa8ff,#3b2a7a);
  box-shadow:0 1.4em 2em -1em rgba(0,0,0,.85), inset 0 -.4em .8em rgba(0,0,0,.45), inset 0 .4em .8em rgba(255,255,255,.35);
  transform:rotate(-18deg) rotateX(12deg) translateY(-.5em);
}
.d5 .cube::after{content:""; position:absolute; left:14%; top:12%; width:34%; height:22%; border-radius:50%; background:rgba(255,255,255,.62); filter:blur(.3em);}
.d5 .floor{position:absolute; left:26%; right:26%; bottom:1.5em; height:.45em; border-radius:50%; background:rgba(0,0,0,.6); filter:blur(.35em);}

/* 6 活力色块 */
.d6{background:#fff; padding:.9em; display:grid; grid-template-columns:1.5fr 1fr; grid-template-rows:1fr 1fr; grid-gap:.55em;}
.d6 .k{border-radius:.8em; padding:.7em; display:flex; flex-direction:column; justify-content:center;  font-size:1.05em; font-weight:800; color:#fff; min-width:0;}
.d6 .k small{font-size:.8em; font-weight:600; opacity:.9;}
.d6 .k.a{grid-row:1/3; background:#ff4d6d;}
.d6 .k.b{background:#ffb703; color:#241a00;}
.d6 .k.c{background:#3a86ff;}

/* 7 深色模式 OLED */
.d7{background:#000; padding:1.4em; display:flex; flex-direction:column; justify-content:center; }
.d7 .k{font-size:.95em; color:#8e8e93; letter-spacing:.14em;}
.d7 .v{font-size:2.3em; font-weight:700; line-height:1.05; letter-spacing:-.03em; color:#fff;}
.d7 .v b{color:#30d158;}
.d7 .bar{height:.5em; border-radius:.25em; background:#1c1c1e; overflow:hidden;}
.d7 .bar i{display:block; height:100%; width:68%; border-radius:.25em; background:#30d158; box-shadow:0 0 .5em rgba(48,209,88,.65);}

/* 8 无障碍优先 */
.d8{background:#fff; padding:1.2em; display:flex; flex-direction:column; justify-content:center; }
.d8 .t{font-size:1.5em; font-weight:800; line-height:1.25; letter-spacing:-.02em; color:#111;}
.d8 .f{display:flex; align-items:center;  padding:.6em .7em; border-radius:.5em; border:.14em solid #111; outline:.22em solid #ffb000; outline-offset:.12em;}
.d8 .f i{width:.95em; height:.95em; border-radius:.2em; border:.2em solid #111; flex-shrink:0;}
.d8 .f .lbl{font-size:1em; color:#111;}
.d8 .btn{align-self:flex-start; padding:.55em 1.1em; border-radius:.5em; background:#0b3d91; color:#fff; font-size:1em; font-weight:700;}

/* 9 黏土拟态 */
.d9{background:#eef1ff; padding:1.2em; display:flex; align-items:center; justify-content:center; }
.d9 .blob{
  width:4em; height:4em; flex-shrink:0; border-radius:42% 58% 55% 45%/48% 42% 58% 52%;
  background:linear-gradient(145deg,#c3b5ff,#8f7bf0);
  box-shadow:inset -.5em -.6em 1.2em rgba(80,60,180,.35), inset .5em .6em 1.2em rgba(255,255,255,.75), 0 .8em 1.4em -.6em rgba(120,100,220,.7);
}
.d9 .card{
  flex:1; min-width:0; padding:1em; border-radius:1.4em; background:#fff;
  box-shadow:inset -.4em -.5em 1em rgba(150,140,220,.22), inset .4em .5em 1em #fff, 0 .8em 1.4em -.7em rgba(120,100,220,.6);
  display:flex; flex-direction:column; 
}
.d9 .card b{font-size:1.15em; color:#4a3fa8;}
.d9 .card span{height:.48em; border-radius:.24em; background:#ddd8ff;}
.d9 .card span:last-child{width:58%;}

/* 10 极光渐变 */
.d10{background:#07091a; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.d10::before{
  content:""; position:absolute; top:-30%;right:-30%;bottom:-30%;left:-30%;
  background:radial-gradient(circle,#7b5bff,#00e0ff);
  filter:blur(2.4em); opacity:.78;
}
.d10 .glass{
  position:relative; width:76%; padding:1.1em; border-radius:1.2em;
  background:rgba(10,12,30,.5); border:.12em solid rgba(255,255,255,.24);
  -webkit-backdrop-filter:blur(1em); backdrop-filter:blur(1em);
}
.d10 .glass b{display:block; font-size:1.3em; font-weight:700; color:#fff;}
.d10 .glass span{display:block; font-size:.95em; line-height:1.4; color:#b9c2e8; margin-top:.35em;}

/* 11 复古未来主义 */
.d11{background:#120a24; padding:1.3em; display:flex; flex-direction:column; justify-content:center;  overflow:hidden;}
.d11::before{
  content:""; position:absolute; left:-20%; right:-20%; bottom:-24%; height:72%;
  background:repeating-linear-gradient(90deg,rgba(255,0,200,.5) 0 1px,transparent 1px 12px),
             repeating-linear-gradient(0deg,rgba(255,0,200,.35) 0 1px,transparent 1px 10px);
  transform:perspective(14em) rotateX(62deg);
}
.d11 .t{position:relative; font-size:1.75em; font-weight:900; letter-spacing:.14em; color:#ffd166; text-shadow:.06em .06em 0 #ff2fb9,-.06em -.06em 0 #21d4fd;}
.d11 .s{position:relative; font-size:.95em; letter-spacing:.2em; color:#21d4fd; font-family:"SF Mono",Menlo,Consolas,monospace;}

/* 12 扁平化 */
.d12{background:#fff; padding:1.3em; display:flex; align-items:center; }
.d12 .ic{width:3.2em; height:3.2em; border-radius:.9em; flex-shrink:0;}
.d12 .ic.a{background:#ff6b6b;} .d12 .ic.b{background:#4ecdc4;} .d12 .ic.c{background:#ffe66d;}
.d12 .txt{flex:1; min-width:0;}
.d12 .txt .t{font-size:1.15em; font-weight:600; letter-spacing:-.01em; color:#222;}
