<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>今天我开心了吗？</title>
<style>
:root {
  /* ---------- 主题（配色）：默认「深夜」 ----------
   * 样式规则一律引用这组变量、不写死颜色；其余主题在下方
   * html[data-theme="..."] 里整组覆盖。main.js 把当前模式写到
   * <html data-theme>（「跟随系统」先解析成 dark / light 再写）。
   *
   * 视觉语言（刻意区别于「准时下班打卡」的卡片 + 方块热力图）：
   *   --hero-grad/-glow  封面式页头的渐变与柔光斑
   *   --shadow/-shadow-sm 悬浮卡片投影（代替 1px 实线边框）
   *   --edge            比 --border 更淡的卡片描边
   *   --punch-bg/-border 心情圆点（未选中）的底色与描边 */
  --bg: #0d1117;
  --card: #161b22;
  --card-2: #1c2330;
  --card-trans: rgba(22, 27, 34, 0);
  --border: #2a323d;
  --edge: rgba(255, 255, 255, 0.06);
  --text: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7a86;
  --cell: #1b222c;
  /* 六种心情色 */
  --m1: #ff8c42;  --m1-deep: #f66a0a;  /* 兴奋 橙 */
  --m2: #3fb950;  --m2-deep: #2ea043;  /* 开心 绿 */
  --m3: #58a6ff;  --m3-deep: #1f6feb;  /* 平静 蓝 */
  --m4: #d29922;  --m4-deep: #bb8009;  /* 一般 黄 */
  --m5: #bc8cff;  --m5-deep: #8957ff;  /* 难过 紫 */
  --m6: #f85149;  --m6-deep: #da3633;  /* 愤怒 红 */
  --m1-grad: linear-gradient(135deg, #ff8c42, #f66a0a);
  --m2-grad: linear-gradient(135deg, #3fb950, #2ea043);
  --m3-grad: linear-gradient(135deg, #58a6ff, #1f6feb);
  --m4-grad: linear-gradient(135deg, #d29922, #bb8009);
  --m5-grad: linear-gradient(135deg, #bc8cff, #8957ff);
  --m6-grad: linear-gradient(135deg, #f85149, #da3633);
  --m-ink: #ffffff;
  --hero-grad: linear-gradient(135deg, #33204a 0%, #143243 52%, #0f2c22 100%);
  --hero-border: rgba(188, 140, 255, 0.18);
  --hero-glow: rgba(188, 140, 255, 0.22);
  --punch-bg: rgba(255, 255, 255, 0.08);
  --punch-border: rgba(255, 255, 255, 0.18);
  --shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.28);
  --on-card-dim: rgba(230, 237, 243, 0.62);
  --sheet: rgba(22, 27, 34, 0.92);
  --overlay: rgba(2, 6, 12, 0.65);
  --toast-bg: #2a323d;
  --danger-bg: rgba(218, 54, 51, 0.15);
  --danger-ink: #f85149;
  --danger-border: rgba(218, 54, 51, 0.4);
  --scheme: dark;
  --radius: 14px;
  --radius-lg: 22px;
  --top-gap: 50px;
  --safe-top: calc(var(--top-gap) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --safe-l: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
  --safe-r: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  min-height: var(--app-height, 100vh);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  padding-left: var(--safe-l);
  padding-right: var(--safe-r);
}

.page {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 14px 32px;
  padding-bottom: calc(32px + var(--safe-bottom));
}

/* ---------- 封面式页头（非常规吸顶栏） ----------
 * 整块出血到屏幕边缘、下沿大圆角，配两块柔光斑；内容整体 z-index:1
 * 压在光斑之上。顶部留白沿用 --safe-top（容器内 50px 常量 + 安全区）。 */
.hero {
  position: relative;
  overflow: hidden;
  margin: -14px -14px 0;
  padding: var(--safe-top) 20px 26px;
  background: var(--hero-grad);
  border-bottom: 1px solid var(--hero-border);
  border-radius: 0 0 28px 28px;
  box-shadow: var(--shadow);
}
.hero::before,
.hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, var(--hero-glow) 0%, rgba(0, 0, 0, 0) 70%);
}
.hero::before { top: -70px; right: -56px; width: 200px; height: 200px; }
.hero::after { bottom: -92px; left: -52px; width: 180px; height: 180px; }
.hero-row,
.hero-title,
.hero-sub { position: relative; z-index: 1; }
.hero-row { display: flex; align-items: center; justify-content: space-between; }
.hero-date { font-size: 12px; letter-spacing: 1.2px; color: var(--on-card-dim); }
.icon-btn {
  flex: none;
  width: 34px;
  height: 34px;
  border: 1px solid var(--punch-border);
  border-radius: 50%;
  background: var(--punch-bg);
  color: var(--on-card-dim);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.08s ease, color 0.15s ease;
}
.icon-btn:active { transform: scale(0.92); color: var(--text); }
.hero-title { margin-top: 14px; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; line-height: 1.25; }
.hero-sub { margin-top: 6px; font-size: 12px; color: var(--on-card-dim); min-height: 17px; }

/* ---------- 今日情绪（大圆面 + 六色圆点轮盘） ---------- */
.today {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 12px;
  padding: 16px 16px 12px;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.today-face {
  flex: none;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  line-height: 1;
  background: var(--card-2);
  border: 1px dashed var(--border);
  transition: background 0.18s ease, border-color 0.18s ease;
}
.today-face.is-empty { color: var(--faint); }
.today-face .face-q { font-size: 24px; font-weight: 700; }
.today-face.fm1 { background: var(--m1-grad); border: 1px solid transparent; }
.today-face.fm2 { background: var(--m2-grad); border: 1px solid transparent; }
.today-face.fm3 { background: var(--m3-grad); border: 1px solid transparent; }
.today-face.fm4 { background: var(--m4-grad); border: 1px solid transparent; }
.today-face.fm5 { background: var(--m5-grad); border: 1px solid transparent; }
.today-face.fm6 { background: var(--m6-grad); border: 1px solid transparent; }
.today-meta { flex: 1; min-width: 0; margin-left: 14px; }
.today-kicker { font-size: 10.5px; letter-spacing: 1.6px; color: var(--muted); }
.today-verdict { margin-top: 3px; font-size: 21px; font-weight: 800; line-height: 1.3; min-height: 28px; }
.today-verdict.vm1 { color: var(--m1); }
.today-verdict.vm2 { color: var(--m2); }
.today-verdict.vm3 { color: var(--m3); }
.today-verdict.vm4 { color: var(--m4); }
.today-verdict.vm5 { color: var(--m5); }
.today-verdict.vm6 { color: var(--m6); }
.today-sub { margin-top: 2px; font-size: 11.5px; color: var(--muted); min-height: 16px; }

/* 六个心情圆点：未选中＝中性圆环，选中＝心情渐变 + 同色外圈 + 上浮 */
.mood-wheel {
  flex: 0 0 100%;
  display: flex;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
}
.mood-wheel .punch-btn {
  flex: 1 1 0;
  min-width: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: none;
  border: none;
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.mood-wheel .punch-btn .emoji {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  line-height: 1;
  background: var(--punch-bg);
  border: 1px solid var(--punch-border);
  transition: transform 0.14s ease, background 0.16s ease;
}
.mood-wheel .punch-btn .label { margin-top: 6px; font-size: 10.5px; letter-spacing: 0.5px; color: var(--muted); }
.mood-wheel .punch-btn:active .emoji { transform: scale(0.9); }
.mood-wheel .punch-btn.pm1 .label { color: var(--m1); }
.mood-wheel .punch-btn.pm2 .label { color: var(--m2); }
.mood-wheel .punch-btn.pm3 .label { color: var(--m3); }
.mood-wheel .punch-btn.pm4 .label { color: var(--m4); }
.mood-wheel .punch-btn.pm5 .label { color: var(--m5); }
.mood-wheel .punch-btn.pm6 .label { color: var(--m6); }
.mood-wheel .punch-btn.pm1.on .emoji { background: var(--m1-grad); border-color: transparent; outline: 2px solid var(--m1); outline-offset: 2px; transform: translateY(-3px); }
.mood-wheel .punch-btn.pm2.on .emoji { background: var(--m2-grad); border-color: transparent; outline: 2px solid var(--m2); outline-offset: 2px; transform: translateY(-3px); }
.mood-wheel .punch-btn.pm3.on .emoji { background: var(--m3-grad); border-color: transparent; outline: 2px solid var(--m3); outline-offset: 2px; transform: translateY(-3px); }
.mood-wheel .punch-btn.pm4.on .emoji { background: var(--m4-grad); border-color: transparent; outline: 2px solid var(--m4); outline-offset: 2px; transform: translateY(-3px); }
.mood-wheel .punch-btn.pm5.on .emoji { background: var(--m5-grad); border-color: transparent; outline: 2px solid var(--m5); outline-offset: 2px; transform: translateY(-3px); }
.mood-wheel .punch-btn.pm6.on .emoji { background: var(--m6-grad); border-color: transparent; outline: 2px solid var(--m6); outline-offset: 2px; transform: translateY(-3px); }
.edit-today { flex: 0 0 100%; margin-top: 12px; text-align: center; }
.edit-today button {
  background: none;
  border: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 11.5px;
  text-decoration: underline;
  cursor: pointer;
  padding: 4px 8px;
}

/* ---------- 四项仪表行（一条横排，竖线分隔，不套卡片） ---------- */
.meters {
  display: flex;
  margin-top: 12px;
  padding: 14px 2px;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.meters .stat { flex: 1 1 0; min-width: 0; padding: 0 2px; text-align: center; }
.meters .stat + .stat { border-left: 1px solid var(--edge); }
.meters .stat-num { font-size: 19px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.meters .stat-num .unit { font-size: 10.5px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.meters .stat-num .dash { font-size: 14px; font-weight: 500; color: var(--muted); }
.meters .stat-label { margin-top: 5px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.meters .stat.good .stat-num { color: var(--m2); }
.meters .stat.bad .stat-num { color: var(--m5); }

/* ---------- 卡片 ---------- */
.card {
  margin-top: 12px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card-head { display: flex; align-items: center; margin-bottom: 12px; }
.card-head h2 {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.card-head h2::before {
  content: "";
  flex: none;
  width: 3px;
  height: 13px;
  border-radius: 2px;
  margin-right: 8px;
  background: linear-gradient(180deg, var(--m1), var(--m6));
}
.card-note { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- 横向堆积图：本月心情构成 ---------- */
.stack { display: flex; align-items: center; justify-content: center; height: 22px; }
.stack-seg {
  flex-grow: 0;
  flex-shrink: 0;
  flex-basis: 0;
  min-width: 4px;
  height: 100%;
  border-radius: 999px;
}
.stack-seg + .stack-seg { margin-left: 4px; }
.stack-seg.s1 { background: var(--m1-grad); }
.stack-seg.s2 { background: var(--m2-grad); }
.stack-seg.s3 { background: var(--m3-grad); }
.stack-seg.s4 { background: var(--m4-grad); }
.stack-seg.s5 { background: var(--m5-grad); }
.stack-seg.s6 { background: var(--m6-grad); }
.stack.is-empty { border: 1px dashed var(--border); border-radius: 999px; }
.stack-empty { font-size: 11px; color: var(--faint); }
.mix-legend { display: flex; flex-wrap: wrap; margin: 10px -4px 0; }
.mix-legend .lg {
  width: calc(50% - 8px);
  margin: 4px;
  display: flex;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
}
.mix-legend .lg i { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.mix-legend .lg b { margin-left: auto; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.mix-legend .lg.is-off { opacity: 0.45; }

/* ---------- 心情日历（近半年）：圆点热力图 ---------- */
.hm-nav { display: flex; flex: none; }
.hm-nav-btn {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--card-2);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.08s ease, opacity 0.2s ease, color 0.2s ease;
}
.hm-nav-btn + .hm-nav-btn { margin-left: 6px; }
.hm-nav-btn:active { transform: scale(0.9); color: var(--text); }
.hm-nav-btn.is-off { opacity: 0.3; pointer-events: none; }
.hm-nav-btn svg { width: 15px; height: 15px; display: block; }

.hm-wrap { position: relative; flex: 1; min-width: 0; }
.hm-wrap::before,
.hm-wrap::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 24px;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.hm-wrap::before { left: 0; background: linear-gradient(90deg, var(--card), var(--card-trans)); }
.hm-wrap::after { right: 0; background: linear-gradient(270deg, var(--card), var(--card-trans)); }
.hm-wrap.show-left::before { opacity: 1; }
.hm-wrap.show-right::after { opacity: 1; }

.hm-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.hm-scroll::-webkit-scrollbar { display: none; }
.hm-inner { display: inline-block; }
.hm-months { display: flex; height: 14px; }
.hm-month {
  width: 14px;
  flex: none;
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
  overflow: visible;
}
.hm-body { display: flex; }
.hm-days {
  display: flex;
  flex-direction: column;
  width: 20px;
  flex: none;
  margin-right: 2px;
  padding-top: 17px;
}
.hm-day { height: 14px; font-size: 9px; line-height: 12px; color: var(--muted); }
.hm-weeks { display: flex; margin-top: 3px; }
.hm-week { display: flex; flex-direction: column; flex: none; width: 14px; }
.hm-cell {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--cell);
  margin-bottom: 2px;
  cursor: pointer;
  transition: transform 0.12s ease;
}
.hm-cell.lv1 { background: var(--m1); }
.hm-cell.lv2 { background: var(--m2); }
.hm-cell.lv3 { background: var(--m3); }
.hm-cell.lv4 { background: var(--m4); }
.hm-cell.lv5 { background: var(--m5); }
.hm-cell.lv6 { background: var(--m6); }
/* 注意：类名不能叫 .today —— 会撞上今日区块 .today（那是整块卡片样式） */
.hm-cell.is-today { outline: 1.5px solid var(--text); outline-offset: 1px; }
.hm-cell.future { opacity: 0.35; cursor: default; }
.hm-cell:not(.future):active { transform: scale(0.74); }
.hm-legend {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 10.5px;
  color: var(--muted);
}
.hm-legend .sw {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-left: 6px;
  margin-right: 3px;
  vertical-align: 0;
}
.hm-legend .item { margin-left: 8px; }

/* ---------- 弹层 ---------- */
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--overlay);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 20;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 480px;
  margin: 0 auto;
  max-height: calc(var(--app-height, 100vh) - 40px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--card);
  border: 1px solid var(--edge);
  border-bottom: none;
  border-radius: 26px 26px 0 0;
  padding: 16px 18px 24px;
  padding-bottom: calc(24px + var(--safe-bottom));
  transform: translateY(105%);
  transition: transform 0.24s ease;
  z-index: 21;
}
@supports ((-webkit-backdrop-filter: blur(12px)) or (backdrop-filter: blur(12px))) {
  .sheet {
    background: var(--sheet);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
}
.sheet.show { transform: translateY(0); }
.sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 0 auto 14px;
}
.sheet-title { font-size: 16px; font-weight: 700; }
.sheet-status { margin-top: 6px; font-size: 13px; color: var(--muted); }
.sheet-status b { color: var(--text); }
/* 选心情：3×2 圆角块，与今日轮盘同一套「圆点 + 心情色」语言 */
.pick-grid { display: flex; flex-wrap: wrap; margin: 14px -4px 0; }
.pick-btn {
  width: calc(33.333% - 8px);
  margin: 4px;
  padding: 12px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--card-2);
  border: 1px solid transparent;
  border-radius: 16px;
  color: var(--muted);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.16s ease, color 0.16s ease;
}
.pick-btn .emoji { font-size: 26px; line-height: 1; margin-bottom: 5px; }
.pick-btn:active { transform: scale(0.96); }
.pick-btn.pm1 { color: var(--m1); }
.pick-btn.pm2 { color: var(--m2); }
.pick-btn.pm3 { color: var(--m3); }
.pick-btn.pm4 { color: var(--m4); }
.pick-btn.pm5 { color: var(--m5); }
.pick-btn.pm6 { color: var(--m6); }
.pick-btn.pm1.on { background: var(--m1-grad); color: var(--m-ink); outline: 2px solid var(--m1); outline-offset: 2px; }
.pick-btn.pm2.on { background: var(--m2-grad); color: var(--m-ink); outline: 2px solid var(--m2); outline-offset: 2px; }
.pick-btn.pm3.on { background: var(--m3-grad); color: var(--m-ink); outline: 2px solid var(--m3); outline-offset: 2px; }
.pick-btn.pm4.on { background: var(--m4-grad); color: var(--m-ink); outline: 2px solid var(--m4); outline-offset: 2px; }
.pick-btn.pm5.on { background: var(--m5-grad); color: var(--m-ink); outline: 2px solid var(--m5); outline-offset: 2px; }
.pick-btn.pm6.on { background: var(--m6-grad); color: var(--m-ink); outline: 2px solid var(--m6); outline-offset: 2px; }
.sheet-actions { display: flex; margin-top: 18px; }
.btn {
  flex: 1;
  border: none;
  border-radius: 14px;
  padding: 13px 8px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}
.btn:active { transform: scale(0.97); }
.btn + .btn { margin-left: 10px; }
.btn-primary { background: var(--m2-grad); color: var(--m-ink); }
.btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger-bg); color: var(--danger-ink); border: 1px solid var(--danger-border); }
/* ---------- 居中确认框 ---------- */
.dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  width: calc(100% - 56px);
  max-width: 320px;
  z-index: 22;
  padding: 20px 20px 16px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--edge);
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0.94);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.dialog.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
.dialog-title { font-size: 16px; font-weight: 700; }
.dialog-text { margin-top: 8px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.dialog-actions { display: flex; margin-top: 18px; }
.settings-section { margin-top: 18px; border-top: 1px solid var(--edge); padding-top: 16px; }
.settings-section h3 { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; }

/* ---------- 设置：主题选择 ---------- */
.theme-grid { display: flex; flex-wrap: wrap; margin: -5px; }
.theme-chip {
  width: calc(50% - 10px);
  margin: 5px;
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 11px 12px;
  background: var(--bg);
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, color 0.15s ease;
}
.theme-chip:active { transform: scale(0.97); }
.theme-chip.on {
  border-color: var(--m2);
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--m2);
}
.theme-dots { display: flex; flex: none; margin-right: 9px; }
.theme-dots i {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1px solid rgba(128, 128, 128, 0.4);
}
.theme-dots i + i { margin-left: -4px; }
.theme-name { flex: 1; min-width: 0; }
.theme-tick { flex: none; margin-left: 5px; font-size: 12px; color: var(--m2); opacity: 0; }
.theme-chip.on .theme-tick { opacity: 1; }
.theme-hint { margin-top: 10px; font-size: 11px; line-height: 1.6; color: var(--muted); }

/* ---------- 数据弹层 ---------- */
.data-hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.55; }
.data-text {
  width: 100%;
  min-height: 200px;
  margin-top: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 12px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  line-height: 1.55;
  resize: vertical;
  outline: none;
  color-scheme: var(--scheme);
  -webkit-user-select: text;
  user-select: text;
  -webkit-appearance: none;
  appearance: none;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 72px;
  bottom: calc(72px + var(--safe-bottom));
  transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg);
  color: var(--text);
  font-size: 13px;
  padding: 10px 18px;
  border-radius: 20px;
  border: 1px solid var(--edge);
  box-shadow: var(--shadow-sm);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 30;
  max-width: 82%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.footer-note {
  text-align: center;
  font-size: 11px;
  color: var(--faint);
  margin-top: 18px;
}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-row">
      <span class="hero-date" id="todayDate"></span>
      <button class="icon-btn" id="btnSettings" aria-label="设置">&#9881;</button>
    </div>
    <h1 class="hero-title">今天我开心了吗？</h1>
    <p class="hero-sub" id="heroSub"></p>
  </header>

  <section class="today">
    <div class="today-face is-empty" id="todayFace"></div>
    <div class="today-meta">
      <div class="today-kicker">今天的心情</div>
      <div class="today-verdict" id="todayVerdict"></div>
      <div class="today-sub" id="todaySub"></div>
    </div>
    <div class="mood-wheel" id="punchRow"></div>
    <div class="edit-today" id="editToday"><button id="btnEditToday">撤销今天的记录</button></div>
  </section>

  <div class="meters" id="statsRow"></div>

  <section class="card">
    <div class="card-head">
      <h2>本月心情构成</h2>
      <span class="card-note" id="mixTotal"></span>
    </div>
    <div class="stack" id="mixBar"></div>
    <div class="mix-legend" id="mixLegend"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>心情日历 · 近半年</h2>
      <span class="hm-nav" id="hmNav">
        <button class="hm-nav-btn" id="hmPrev" aria-label="看更早的周">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="hm-nav-btn" id="hmNext" aria-label="看更近的周">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </span>
    </div>
    <div class="hm-body">
      <div class="hm-days" id="hmDays"></div>
      <div class="hm-wrap" id="hmWrap">
        <div class="hm-scroll" id="hmScroll">
          <div class="hm-inner">
            <div class="hm-months" id="hmMonths"></div>
            <div class="hm-weeks" id="hmWeeks"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="hm-legend" id="hmLegend"></div>
  </section>

  <div class="footer-note">数据只存在这台设备上 · 点日历上的圆点可改历史</div>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="daySheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="dayTitle"></div>
  <div class="sheet-status" id="dayStatus"></div>
  <div class="pick-grid" id="pickGrid"></div>
  <div class="sheet-actions">
    <button class="btn btn-danger" id="btnDayClear">清除记录</button>
    <button class="btn btn-ghost" id="btnDayCancel">关闭</button>
  </div>
</div>

<div class="sheet" id="setSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">设置</div>
  <div class="sheet-status">每天记一种心情，颜色即心情。数据仅存在本机。</div>
  <div class="settings-section">
    <h3>主题</h3>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="theme-hint">「跟随系统」随手机的深色 / 浅色模式自动切换。选择只存在本机，下次打开自动沿用。</div>
  </div>
  <div class="settings-section">
    <h3>数据管理</h3>
    <div class="sheet-actions" style="margin-top:0">
      <button class="btn btn-ghost" id="btnExport">导出备份</button>
      <button class="btn btn-ghost" id="btnImport">导入备份</button>
      <button class="btn btn-danger" id="btnClear">清空数据</button>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="btnSetCancel">关闭</button>
  </div>
</div>

<div class="sheet" id="dataSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="dataTitle"></div>
  <div class="data-hint" id="dataHint"></div>
  <textarea class="data-text" id="dataText" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="btnDataCancel">关闭</button>
    <button class="btn btn-primary" id="btnDataConfirm"></button>
  </div>
</div>

<div class="dialog" id="clearDialog">
  <div class="dialog-title">清空全部心情记录？</div>
  <div class="dialog-text" id="clearHint"></div>
  <div class="dialog-actions">
    <button class="btn btn-ghost" id="btnClearCancel">取消</button>
    <button class="btn btn-danger" id="btnClearConfirm">确认清空</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./main.js"></script>
</body>
</html>
