<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Gateway - 本地 AI 网关</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="6" fill="#4f46e5"/>
            <path d="M8 18L14 8L20 18M10 15H18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>AI Gateway</span>
        </div>
        <span class="status-badge" id="statusBadge">Loading...</span>
      </div>
      <div class="header-right">
        <button class="btn btn-ghost" onclick="openSettings()">设置</button>
      </div>
    </header>

    <!-- Gateway Info Card -->
    <section class="gateway-info card">
      <div class="info-grid">
        <div class="info-item">
          <label>统一接入地址</label>
          <div class="info-value copyable" onclick="copyText(this)" data-copy="">
            <code id="gatewayEndpoint">-</code>
            <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </div>
          <p class="hint">将此地址填入智能体的 API Base URL</p>
        </div>
        <div class="info-item">
          <label>网关密钥</label>
          <div class="info-value copyable" onclick="copyText(this)" data-copy="">
            <code id="gatewayKey">-</code>
            <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </div>
          <p class="hint">智能体 API Key 填此值即可</p>
        </div>
        <div class="info-item">
          <label>当前模型</label>
          <div class="info-value">
            <code id="activeModel">未配置</code>
          </div>
          <p class="hint" id="activeProviderName">无活跃 Provider</p>
        </div>
      </div>
    </section>

    <!-- Providers Section -->
    <section class="providers-section">
      <div class="section-header">
        <h2>模型配置</h2>
        <button class="btn btn-primary" onclick="openProviderModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加配置
        </button>
      </div>
      <div id="providerList" class="provider-list">
        <div class="empty-state">加载中...</div>
      </div>
    </section>

    <!-- Logs Section -->
    <section class="logs-section">
      <div class="section-header">
        <h2>请求日志</h2>
        <div class="logs-actions">
          <button class="btn btn-ghost btn-sm" onclick="refreshLogs()">刷新</button>
          <button class="btn btn-ghost btn-sm danger" onclick="clearLogs()">清空</button>
        </div>
      </div>
      <div id="logList" class="log-list">
        <div class="empty-state">暂无日志</div>
      </div>
    </section>
  </div>

  <!-- Provider Modal -->
  <div id="providerModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">添加模型配置</h3>
        <button class="btn-close" onclick="closeProviderModal()">&times;</button>
      </div>
      <form id="providerForm" onsubmit="saveProvider(event)">
        <input type="hidden" id="providerId">
        <div class="form-group">
          <label for="providerName">名称 <span class="required">*</span></label>
          <input type="text" id="providerName" placeholder="如：GLM-4-Flash" required>
        </div>
        <div class="form-group">
          <label for="providerBaseUrl">API Base URL <span class="required">*</span></label>
          <input type="text" id="providerBaseUrl" placeholder="如：https://open.bigmodel.cn/api/paas/v4" required>
          <p class="hint">OpenAI 兼容地址，不需要带 /chat/completions</p>
        </div>
        <div class="form-group">
          <label for="providerApiKey">API Key <span class="required">*</span></label>
          <input type="password" id="providerApiKey" placeholder="sk-..." required>
        </div>
        <div class="form-group">
          <label for="providerModelId">模型 ID <span class="required">*</span></label>
          <input type="text" id="providerModelId" placeholder="如：glm-4-flash" required>
          <p class="hint">实际调用的大模型标识</p>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeProviderModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>网关设置</h3>
        <button class="btn-close" onclick="closeSettings()">&times;</button>
      </div>
      <form id="settingsForm" onsubmit="saveSettings(event)">
        <div class="form-group">
          <label for="settingsPort">监听端口</label>
          <input type="number" id="settingsPort" placeholder="5174">
          <p class="hint">修改后需重启服务生效</p>
        </div>
        <div class="form-group">
          <label for="settingsApiKey">网关密钥</label>
          <div class="input-with-button">
            <input type="text" id="settingsApiKey" placeholder="gw-...">
            <button type="button" class="btn btn-ghost btn-sm" onclick="regenerateKey()">重新生成</button>
          </div>
          <p class="hint">智能体连接网关时使用的密钥</p>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeSettings()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
