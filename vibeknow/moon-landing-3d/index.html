<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>奔月 · 登月全程</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div id="app">
    <main id="stage-wrap">
      <canvas id="stage"></canvas>
      <div id="countdown"></div>
      <div id="telemetry"></div>
      <div id="mission-tag"></div>
      <div id="labels"></div>
      <button id="btn-ignite" class="ignite-btn" type="button">点火发射</button>
      <button id="btn-warp" class="warp-btn" type="button" aria-label="长按加速">
        <span class="w-arrows">▶▶</span>
        <span class="w-label">长按加速</span>
      </button>
      <button id="btn-sound" class="sound-btn" type="button" aria-label="切换音效">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>
          <path class="s-wave" d="M16 8.5a4.5 4.5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path class="s-wave" d="M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <line class="s-off" x1="16" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line class="s-off" x1="21" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="s-label">音效</span>
      </button>
      <div id="desc-box">
        <div id="desc-title"></div>
        <div id="desc-text"></div>
      </div>
      <div id="loader">
        <div class="loader-spin"></div>
        <p>正在加载三维场景…</p>
      </div>
      <div id="fallback" class="fallback">
        <svg class="fb-rocket" viewBox="0 0 64 120" width="64" height="120" aria-hidden="true">
          <polygon points="32,4 20,40 44,40" fill="#cfd8e6"/>
          <rect x="20" y="40" width="24" height="54" rx="4" fill="#e8edf4"/>
          <polygon points="20,80 8,104 20,94" fill="#d94b3a"/>
          <polygon points="44,80 56,104 44,94" fill="#d94b3a"/>
          <rect x="26" y="94" width="12" height="18" rx="2" fill="#3a3f47"/>
          <polygon points="26,112 32,120 38,112" fill="#ffb347"/>
        </svg>
        <p class="fb-text">当前环境不支持 WebGL</p>
        <p class="fb-sub">无法显示 3D 内容，请升级浏览器或更换设备</p>
      </div>
    </main>
    <footer class="bottombar">
      <div id="phase-text" class="phase-text">长征十号 · 静态展示 · 拖动旋转</div>
      <nav class="modes">
        <button id="btn-show" class="mode-btn active" type="button"><span class="dot" style="background:#5cc8ff"></span>展示</button>
        <button id="btn-explode" class="mode-btn" type="button"><span class="dot" style="background:#ffb84d"></span>拆解</button>
        <button id="btn-launch" class="mode-btn" type="button"><span class="dot" style="background:#c3a6ff"></span>登月</button>
      </nav>
      <div class="progress"><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div></div>
    </footer>
  </div>
  <script src="./assets/math.js"></script>
  <script src="./assets/earth-data.js"></script>
  <script src="./assets/clouds-data.js"></script>
  <script src="./assets/moon-data.js"></script>
  <script src="./assets/engine.js"></script>
  <script src="./assets/craft.js"></script>
  <script src="./assets/mission.js"></script>
  <script src="./assets/audio.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
