<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>为了小猫我飞遍全球</title>
<script src="./assets/flexgap.js"></script>
<style>
:root{
  --bg:#f7f3ed; --card:#fffaf3; --line:#e4dccd; --line-soft:#efe9dc;
  --ink:#3a3228; --ink-soft:#7a6f60; --ink-faint:#a89c8a;
  --accent:#e8755a; --accent-deep:#c85a42; --accent-soft:#f6dacd;
  --sky:#b8d4e8; --sky-deep:#7faecf; --leaf:#88a878;
  --gold:#c89a4c; --shadow:0 1px 3px rgba(58,50,40,.06),0 4px 12px rgba(58,50,40,.05);
  --shadow-lg:0 4px 16px rgba(58,50,40,.10),0 12px 32px rgba(58,50,40,.08);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --serif:Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --bar-h:64px; --top-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}

/* ===== 页面切换 ===== */
.page{display:none;position:absolute;inset:0;flex-direction:column}
body.mode-atlas .page-atlas{display:flex}
body.mode-fly .page-fly{display:flex}
body.mode-gene .page-gene{display:flex}

/* ===== 顶栏（纯净，只放标题） ===== */
.topbar{
  flex:0 0 var(--top-h); height:var(--top-h);
  display:flex; align-items:center; justify-content:center;
  padding:0 16px; padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid var(--line); background:var(--card);
}
.topbar h1{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.5px}
.topbar .sub{display:none}

/* ===== 操作栏（底部固定，按钮全站统一） ===== */
.actionbar{
  flex:0 0 var(--bar-h); height:calc(var(--bar-h) + var(--safe-b));
  display:flex; align-items:center; gap:8px; padding:0 14px var(--safe-b);
  border-top:1px solid var(--line); background:var(--card);
}
.bar-btn{
  flex:1; height:42px; border-radius:var(--r-sm);
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:14px; font-weight:500; color:var(--ink-soft);
  background:var(--line-soft); transition:background .15s,color .15s,transform .1s;
}
.bar-btn:active{transform:scale(.97)}
.bar-btn-primary{
  color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  font-weight:600; box-shadow:0 2px 8px rgba(232,117,90,.3);
}
.bar-btn-primary:disabled{opacity:.4;box:none;box-shadow:none;cursor:not-allowed}
.bar-btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.bar-btn[disabled]{opacity:.4;cursor:not-allowed}
.bar-mid{flex:0 0 auto;min-width:64px;color:var(--ink-faint);font-size:13px;text-align:center}

/* ===== 图鉴页 ===== */
.atlas-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hero{
  position:relative; height:180px; margin:12px; border-radius:var(--r-lg);
  overflow:hidden; background:linear-gradient(135deg,#f6dacd,#f4e4d8);
  display:flex; align-items:flex-end; padding:18px 20px;
}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.5),transparent 60%)}
.hero h2{font-family:var(--serif);font-size:22px;font-weight:600;position:relative;z-index:1;line-height:1.3}
.hero p{position:relative;z-index:1;color:var(--ink-soft);font-size:13px;margin-top:4px}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.region-section{padding:0 12px 8px}
.region-head{
  display:flex;align-items:baseline;gap:10px;padding:14px 4px 10px;
}
.region-head h3{font-family:var(--serif);font-size:16px;font-weight:600}
.region-head .count{font-size:12px;color:var(--ink-faint)}
.region-head::after{content:"";flex:1;height:1px;background:var(--line);margin-left:4px}
.cat-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.cat-card{
  background:var(--card); border-radius:var(--r); border:1px solid var(--line);
  overflow:hidden; box-shadow:var(--shadow); position:relative;
  transition:transform .12s,box-shadow .15s;
}
.cat-card:active{transform:scale(.98)}
.cat-thumb{
  width:100%; aspect-ratio:1/1; background:var(--line-soft);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.cat-thumb img{width:100%;height:100%;object-fit:cover}
.cat-thumb .ph{
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),transparent 60%);
  border:2px dashed var(--ink-faint); opacity:.5;
}
.heart-btn{
  position:absolute; top:8px; right:8px;
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,250,243,.92); backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  font-size:18px; color:var(--ink-faint); line-height:1;
  box-shadow:0 1px 4px rgba(58,50,40,.12);
  transition:transform .15s,color .15s,background .15s;
}
.heart-btn:active{transform:scale(.85)}
.heart-btn.on{color:var(--accent);background:#fff}
.heart-btn.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle,rgba(232,117,90,.25),transparent 70%);z-index:-1}
.cat-info{padding:8px 10px 10px}
.cat-name{font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.2}
.cat-origin{font-size:11px;color:var(--ink-faint);margin-top:2px}
.cat-traits{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cat-traits span{
  font-size:10px; padding:2px 6px; border-radius:8px;
  background:var(--line-soft); color:var(--ink-soft);
}

/* ===== 见小猫模式（飞行页） ===== */
.fly-stage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#b8d4e8 0%,#e8f0f6 60%,#f4e8d8 100%)}
.fly-globe{flex:1 1 60%;position:relative;overflow:hidden;min-height:0}
.fly-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fly-overlay{
  position:absolute; inset:0; pointer-events:none;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:16px;
}
.fly-hud-top{
  display:flex; justify-content:space-between; align-items:flex-start;
}
.fly-route{
  background:rgba(58,50,40,.55); color:#fff; border-radius:var(--r-sm);
  padding:8px 14px; font-size:13px; backdrop-filter:blur(8px);
  display:flex; align-items:center; gap:8px; line-height:1.4;
}
.fly-route .arrow{color:var(--accent-soft)}
.fly-progress{
  background:rgba(58,50,40,.55); border-radius:var(--r-sm);
  padding:6px 12px; backdrop-filter:blur(8px); color:#fff; font-size:12px;
}
.fly-hud-bottom{display:flex;justify-content:center}
.fly-status{
  background:rgba(58,50,40,.55); color:#fff; border-radius:20px;
  padding:6px 16px; font-size:12px; backdrop-filter:blur(8px);
  letter-spacing:1px;
}
/* 抵达后下半区信息面板 */
.fly-info{flex:0 0 0;overflow:hidden;transition:flex-basis .4s ease;background:var(--card);border-top:1px solid var(--line)}
body.fly-arrived .fly-info{flex:0 0 30%}
.cat-panel{height:100%;display:flex;gap:14px;padding:10px 14px;align-items:stretch;opacity:0;transition:opacity .3s}
body.fly-arrived .cat-panel{opacity:1}
.cat-panel .pic{flex:0 0 132px;width:132px;align-self:center;border-radius:var(--r);overflow:hidden;background:var(--line-soft);aspect-ratio:1/1}
.cat-panel .pic img{width:100%;height:100%;object-fit:cover}
.cat-panel .body{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:2px 0;gap:4px}
.cat-panel .nm{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}
.cat-panel .meta{font-size:12px;color:var(--ink-faint)}
.cat-panel .intro{font-size:13px;line-height:1.55;color:var(--ink-soft)}
.cat-panel .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.cat-panel .tags span{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent-deep)}
/* 舷窗框（第一视角增强） */
.cockpit-frame{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  transition:opacity .3s; border-radius:0;
  box-shadow:inset 0 0 80px rgba(20,30,50,.25), inset 0 0 160px rgba(20,30,50,.15);
}
body.flying .cockpit-frame{opacity:1}

/* ===== 基因解析页 ===== */
.gene-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 20px}
.gene-hero{
  text-align:center; padding:8px 0 16px;
}
.gene-hero h2{font-family:var(--serif);font-size:20px;font-weight:600}
.gene-hero p{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
.gene-card{
  background:var(--card); border-radius:var(--r); border:1px solid var(--line);
  box-shadow:var(--shadow); padding:16px; margin-bottom:12px;
}
.gene-card h3{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:12px}
.radar-wrap{display:flex;justify-content:center}
.radar-wrap svg{width:100%;max-width:280px;height:auto}
.radar .grid{fill:none;stroke:var(--line);stroke-width:1}
.radar .grid.edge{stroke:var(--ink-faint)}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .face{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:2}
.radar .dot{fill:var(--accent)}
.radar .lab{font-size:11px;fill:var(--ink-soft);font-family:var(--sans)}
.radar .lab.peak{fill:var(--accent-deep);font-weight:600}
.radar .val{font-size:10px;fill:var(--ink-faint)}
/* 基因构成条 */
.gene-bars{display:flex;flex-direction:column;gap:10px}
.gene-bar{display:flex;align-items:center;gap:10px}
.gene-bar .lbl{flex:0 0 56px;font-size:12px;color:var(--ink-soft)}
.gene-bar .track{flex:1;height:10px;background:var(--line-soft);border-radius:5px;overflow:hidden}
.gene-bar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent-soft),var(--accent));transition:width .6s}
.gene-bar .num{flex:0 0 28px;text-align:right;font-size:12px;color:var(--ink-faint)}
/* 人格描述 */
.persona{
  font-family:var(--serif); font-size:15px; line-height:1.7; color:var(--ink);
  padding:14px 16px; background:linear-gradient(135deg,var(--accent-soft),#f8e8dc);
  border-radius:var(--r); margin-bottom:12px;
}
.persona .title{font-size:13px;color:var(--accent-deep);font-weight:600;display:block;margin-bottom:6px;font-family:var(--sans)}
/* 心动猫咪列表 */
.heart-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.heart-list .item{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:var(--line-soft)}
.heart-list .item img{width:100%;height:100%;object-fit:cover}
.heart-list .item .nm{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;padding:12px 6px 4px}
.heart-list .empty{grid-column:1/-1;text-align:center;color:var(--ink-faint);font-size:13px;padding:20px}

/* ===== 加载/降级提示 ===== */
.loader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--ink-soft);font-size:13px;z-index:50;
}
.loader.hide{display:none}
.globe-down{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;color:var(--ink-soft);font-size:13px;text-align:center;padding:24px;
}
body.no-webgl .globe-down{display:flex}

@media (max-width:360px){
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .hero h2{font-size:19px}
}
@media (orientation:portrait) and (min-width:600px){
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
</style>
</head>
<body class="mode-atlas">

<!-- 图鉴页 -->
<main class="page page-atlas">
  <header class="topbar"><h1>为了小猫我飞遍全球</h1></header>
  <div class="atlas-scroll" id="atlasScroll">
    <div class="hero" id="hero">
      <img class="hero-img" id="heroImg" alt="">
      <h2>世界猫咪图鉴</h2>
      <p>心动哪只，就飞去见哪只</p>
    </div>
    <div id="atlasGrid"></div>
  </div>
  <div class="actionbar">
    <button class="bar-btn bar-btn-ghost" id="geneFromAtlasBtn" disabled>基因解析</button>
    <button class="bar-btn bar-btn-primary" id="startFlyBtn" disabled>先心动一只小猫 ♥</button>
  </div>
</main>

<!-- 见小猫模式 -->
<main class="page page-fly">
  <header class="topbar"><h1>见小猫 · 飞行中</h1></header>
  <div class="fly-stage" id="flyStage">
    <div class="fly-globe">
      <canvas class="fly-canvas" id="flyCanvas"></canvas>
      <div class="cockpit-frame"></div>
      <div class="fly-overlay">
        <div class="fly-hud-top">
          <div class="fly-route" id="flyRoute">准备起飞</div>
          <div class="fly-progress" id="flyProgress">0%</div>
        </div>
        <div class="fly-hud-bottom">
          <div class="fly-status" id="flyStatus">巡航中</div>
        </div>
      </div>
      <div class="globe-down">
        <div>🌐 你的设备不支持 3D 飞行</div>
        <div>已为你切换为平铺模式展示小猫</div>
      </div>
    </div>
    <div class="fly-info" id="flyInfo">
      <div class="cat-panel" id="catPanel">
        <div class="pic"><img id="panelImg" alt=""></div>
        <div class="body">
          <div class="nm" id="panelName"></div>
          <div class="meta" id="panelMeta"></div>
          <div class="intro" id="panelIntro"></div>
          <div class="tags" id="panelTags"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="actionbar">
    <button class="bar-btn bar-btn-ghost" id="flyPrevBtn">上一只</button>
    <div class="bar-mid" id="flyMid">— / —</div>
    <button class="bar-btn bar-btn-ghost" id="flyNextBtn">下一只</button>
    <button class="bar-btn bar-btn-primary" id="flyGeneBtn">基因解析</button>
  </div>
</main>

<!-- 基因解析页 -->
<main class="page page-gene">
  <header class="topbar"><h1>爱猫基因解析</h1></header>
  <div class="gene-scroll" id="geneScroll">
    <div class="gene-hero">
      <h2 id="geneTitle">你的爱猫基因</h2>
      <p id="geneSubtitle"></p>
    </div>
    <div class="persona" id="genePersona"></div>
    <div class="gene-card">
      <h3>基因图谱</h3>
      <div class="radar-wrap" id="radarWrap"></div>
    </div>
    <div class="gene-card">
      <h3>地区基因构成</h3>
      <div class="gene-bars" id="regionBars"></div>
    </div>
    <div class="gene-card">
      <h3>特征基因构成</h3>
      <div class="gene-bars" id="traitBars"></div>
    </div>
    <div class="gene-card">
      <h3>你心动的猫咪</h3>
      <div class="heart-list" id="heartList"></div>
    </div>
  </div>
  <div class="actionbar">
    <button class="bar-btn bar-btn-ghost" id="geneBackAtlasBtn">回到图鉴</button>
    <button class="bar-btn bar-btn-primary" id="geneReflyBtn">再飞一次</button>
  </div>
</main>

<div class="loader" id="loader">正在加载世界地图…</div>

<script src="./assets/cats.js"></script>
<script src="./assets/earth-tex.js"></script>
<script src="./assets/three.min.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
