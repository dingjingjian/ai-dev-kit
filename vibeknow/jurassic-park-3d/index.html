<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>侏罗纪公园 · 游览导航</title>
<style>
  /* ===== 侏罗纪公园 · 游览导航 app =====
     致敬 1993 经典电影：大门开启 → 游览车按路线行进 → 化石发现地定位。
     配色：深丛林绿 / 火焰红橙 / 骨白 / 黄铜 / 暗木棕。
     四页：路线选择 / 大门过渡 / 游览车游览 / 游览总结。
     地球为「化石发现地定位组件」，仅在游览页内嵌。

  /* ===== 图片素材图位（逐项规格见 docs/图片素材需求.md）=====
     ① 恐龙图 ×30   assets/dinos/<slug>.webp    512×512，游览页大图，缺图回退色卡
     ② 公园大门     assets/tex/gate.webp        大门过渡页背景，缺图用 CSS 画的大门兜底
     ③ 丛林背景     assets/tex/jungle.webp      路线选择页背景，缺图用 CSS 渐变兜底
     ④ 路线横幅 ×4  assets/tex/route-<key>.webp  路线卡片背景，缺图用主题渐变兜底
     ⑤ 木纹纹理     assets/tex/wood.webp        大门与控制栏木纹，缺图用纯色兜底 */

  :root{
    /* 丛林深绿系（公园本体） */
    --jungle-9:#06120a;--jungle-8:#0a1a0c;--jungle-7:#0f2412;--jungle-6:#163018;--jungle-5:#1f3f22;--jungle-4:#2a5230;--jungle-3:#3d6b45;
    /* 火焰红橙系（强调 / 警示 / 火炬） */
    --flame:#d2622a;--flame-2:#e08040;--flame-3:#cf6b2a;--flame-glow:rgba(210,98,42,.35);
    /* 骨白米白系（文字 / 卡片） */
    --bone:#f4f0e6;--bone-2:#ebe5d4;--bone-3:#ddd5be;--bone-4:#cabfa2;
    /* 黄铜系（边框 / 装饰） */
    --brass:#b0894a;--brass-2:#d8b06a;--brass-glow:rgba(176,137,74,.22);
    /* 暗木棕系（大门 / 栅栏） */
    --wood-9:#1a0c06;--wood-8:#2b150c;--wood-7:#3d1f12;--wood-6:#532b17;--wood-5:#6b3a1e;
    /* 墨色 */
    --ink:#1a1a14;--ink-2:#5a5a4a;--ink-3:#8a8a78;--ink-4:#b0b09c;
    /* 线条 */
    --line:rgba(176,137,74,.30);--line-2:rgba(176,137,74,.45);
    /* 路线主题色（默认 = 公园本体，由 app.js 按 route 切换） */
    --route-dark:var(--jungle-7);--route-mid:var(--jungle-5);--route-light:var(--jungle-3);
    --route-accent:var(--flame);--route-accent-2:var(--flame-2);
    --route-banner:url('./assets/tex/route-predator.webp');

    --serif:Georgia,"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --shadow:0 10px 34px rgba(0,0,0,.45);
    --dishbar:52px;--globem:200px;
    --hero-h:140px;
    --sat:0px;--sattop:8px;--sab:0px;
  }
  @supports (top:env(safe-area-inset-top)){
    :root{--sat:env(safe-area-inset-top,0px);--sattop:calc(8px + env(safe-area-inset-top,0px));--sab:env(safe-area-inset-bottom,0px)}
  }

  /* ===== 路线主题（4 套，由 body[data-route] 切换）===== */
  /* 掠食者之旅：火焰红橙 */
  body[data-route="predator"]{
    --route-dark:#2a0e06;--route-mid:#5c1f0e;--route-light:#9a3c1e;
    --route-accent:#e0453a;--route-accent-2:#f06449;
    --route-banner:url('./assets/tex/route-predator.webp')}
  /* 巨兽之旅：深森林绿 */
  body[data-route="giants"]{
    --route-dark:#08150f;--route-mid:#1a3626;--route-light:#3d6b45;
    --route-accent:#6b9a4a;--route-accent-2:#8ab860;
    --route-banner:url('./assets/tex/route-giants.webp')}
  /* 时空之旅：青铜蓝绿 */
  body[data-route="time"]{
    --route-dark:#0a1520;--route-mid:#1d3450;--route-light:#3a5a80;
    --route-accent:#4a9ab0;--route-accent-2:#6ab8d0;
    --route-banner:url('./assets/tex/route-time.webp')}
  /* 奇异物种之旅：暗紫琥珀 */
  body[data-route="bizarre"]{
    --route-dark:#180a20;--route-mid:#2e1438;--route-light:#5a2e6a;
    --route-accent:#c080d0;--route-accent-2:#d8a0e0;
    --route-banner:url('./assets/tex/route-bizarre.webp')}

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;color:var(--bone);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(ellipse 80% 60% at 50% 10%,var(--jungle-6),var(--jungle-8) 60%,var(--jungle-9) 100%)}

  /* ===== 页面容器 ===== */
  .page{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
  body.mode-routes .page-routes{display:flex}
  body.mode-gate .page-gate{display:flex}
  body.mode-tour .page-tour{display:flex}
  body.mode-summary .page-summary{display:flex}

  /* ===== 路线选择页 ===== */
  .page-routes{overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* 顶部公园大门视觉区 */
  .park-hero{flex:none;position:relative;height:calc(var(--hero-h) + 60px + var(--sattop));padding-top:var(--sattop);overflow:hidden;
    background:radial-gradient(ellipse 90% 70% at 50% 30%,var(--jungle-5),var(--jungle-8) 70%,var(--jungle-9))}
  .park-hero::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background-image:url('./assets/tex/jungle.webp');background-size:cover;background-position:center;opacity:.35}
  .park-hero::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,12,6,.4) 0%,rgba(6,12,6,0) 40%,rgba(6,12,6,.7) 100%)}
  .park-brand{position:relative;z-index:2;text-align:center;padding:20px 16px 0}
  /* 三角 logo（CSS 画） */
  .park-logo{display:inline-block;width:64px;height:56px;position:relative;margin-bottom:8px}
  .park-logo::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;
    background:var(--bone);clip-path:polygon(50% 0,100% 100%,0 100%);
    -webkit-mask:linear-gradient(135deg,transparent 40%,#000 40%)}
  .park-logo::after{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:42px solid var(--bone);
    border-radius:0}
  .park-ttl{font-size:26px;font-weight:700;color:var(--bone);letter-spacing:8px;text-indent:8px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .park-sub{font-size:12px;color:var(--brass-2);margin-top:6px;letter-spacing:3px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  /* 火炬（左右两侧，CSS 动画） */
  .torch{position:absolute;bottom:20px;z-index:2;width:18px;height:60px}
  .torch.left{left:20px}.torch.right{right:20px}
  .torch-stick{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:6px;height:30px;background:linear-gradient(180deg,var(--wood-5),var(--wood-7));border-radius:2px}
  .torch-flame{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:14px;height:28px;
    background:radial-gradient(ellipse 60% 80% at 50% 80%,var(--flame-2),var(--flame) 50%,transparent 80%);
    border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;animation:flicker 1.2s ease-in-out infinite alternate;filter:blur(1px)}
  .torch-flame::before{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:8px;height:18px;
    background:radial-gradient(ellipse 60% 80% at 50% 80%,#ffe080,var(--flame-2) 60%,transparent);border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;filter:blur(.5px)}
  @keyframes flicker{0%{transform:translateX(-50%) scale(1,.95);opacity:.9}50%{transform:translateX(-50%) scale(1.05,1);opacity:1}100%{transform:translateX(-50%) scale(.95,1.05);opacity:.85}}
  /* 大门视觉（CSS 画的简化大门） */
  .gate-mini{position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:1;width:200px;height:50px;
    background:linear-gradient(180deg,var(--wood-7),var(--wood-9));
    border:2px solid var(--brass);border-bottom:none;border-radius:4px 4px 0 0;
    box-shadow:0 -4px 16px rgba(0,0,0,.5)}
  .gate-mini::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:120px;height:3px;background:var(--brass)}
  .gate-mini::after{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:80px;height:2px;background:var(--brass-2);opacity:.6}

  /* 路线列表 */
  .route-section{padding:20px 16px 100px;max-width:680px;margin:0 auto}
  .route-section-title{font-size:14px;color:var(--brass-2);letter-spacing:4px;margin-bottom:16px;text-align:center}
  .route-section-title::before,.route-section-title::after{content:"—";color:var(--brass);margin:0 10px;opacity:.5}
  .route-card{display:block;width:100%;margin-bottom:14px;padding:0;border:none;background:transparent;cursor:pointer;text-align:left;
    text-decoration:none;color:inherit;position:relative;overflow:hidden;border-radius:6px;
    transition:transform .2s,box-shadow .2s}
  .route-card:hover{transform:translateY(-2px)}
  .route-card-bg{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;
    background-image:var(--rc-banner),linear-gradient(135deg,var(--rc-dark),var(--rc-mid));
    background-size:cover,auto;background-position:center,center;background-repeat:no-repeat,no-repeat}
  .route-card-bg::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;
    background:linear-gradient(180deg,rgba(6,12,6,.3) 0%,rgba(6,12,6,.75) 100%)}
  .route-card-inner{position:relative;z-index:1;padding:18px 20px}
  .route-card-head{display:flex;align-items:center;justify-content:space-between}
  .route-card-head > * + *{margin-left:12px}
  .route-name{font-size:20px;font-weight:700;color:var(--bone);letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .route-badge{flex-shrink:0;font-size:11px;color:var(--bone);padding:3px 10px;border-radius:2px;
    background:var(--rc-accent);letter-spacing:1px;font-weight:600;white-space:nowrap}
  .route-desc{margin-top:10px;font-size:13px;line-height:1.8;color:var(--bone-2);letter-spacing:.5px}
  .route-meta{margin-top:12px;display:flex;align-items:center;flex-wrap:wrap}
  .route-meta > * + *{margin-left:14px}
  .route-stat{font-size:12px;color:var(--bone-3);letter-spacing:1px;display:flex;align-items:center}
  .route-stat b{color:var(--rc-accent-2);font-size:14px;font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
  .route-intensity{display:inline-flex;gap:2px}
  .route-intensity i{width:8px;height:8px;border-radius:50%;background:var(--bone-4);opacity:.3}
  .route-intensity i.on{background:var(--rc-accent);opacity:1}
  .route-cta{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--bone);
    padding:8px 18px;border-radius:3px;background:var(--rc-accent);letter-spacing:2px;
    box-shadow:0 3px 12px rgba(0,0,0,.3);transition:background .2s}
  .route-card:hover .route-cta{background:var(--rc-accent-2)}
  .route-cta::after{content:"›";font-size:18px;line-height:1}

  /* 路线选择页底栏 */
  .routes-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + var(--sab));text-align:center;
    background:linear-gradient(180deg,var(--jungle-8),var(--jungle-9));border-top:1px solid var(--line)}
  .routes-bar-text{font-size:11px;color:var(--ink-3);letter-spacing:2px}

  /* ===== 大门过渡页 ===== */
  .page-gate{background:var(--jungle-9);align-items:center;justify-content:center}
  .gate-stage{position:relative;width:100%;max-width:480px;text-align:center;padding:0 20px}
  .gate-walls{position:relative;width:100%;height:200px;margin:0 auto 30px;overflow:hidden;border-radius:4px;
    border:2px solid var(--brass);box-shadow:0 0 40px rgba(0,0,0,.6)}
  .gate-walls::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;
    background-image:url('./assets/tex/gate.webp');background-size:cover;background-position:center;opacity:.7}
  .gate-walls::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;
    background:radial-gradient(ellipse 70% 50% at 50% 50%,var(--jungle-5),var(--jungle-8) 80%)}
  /* 两扇门（CSS 动画向两侧打开） */
  .gate-door{position:absolute;top:0;bottom:0;z-index:2;width:50%;
    background:linear-gradient(180deg,var(--wood-7),var(--wood-9));border:2px solid var(--brass)}
  .gate-door.left{left:0;border-right:3px solid var(--brass-2);transform-origin:left center;animation:doorOpenL 2.2s ease-out forwards}
  .gate-door.right{right:0;border-left:3px solid var(--brass-2);transform-origin:right center;animation:doorOpenR 2.2s ease-out forwards}
  .gate-door::before{content:"";position:absolute;top:10px;bottom:10px;width:3px;background:var(--brass);opacity:.4}
  .gate-door.left::before{right:8px}.gate-door.right::before{left:8px}
  .gate-door::after{content:"";position:absolute;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle,var(--flame-2),var(--flame) 60%,transparent);filter:blur(2px);animation:flicker 1s ease-in-out infinite alternate}
  .gate-door.left::after{right:20px}.gate-door.right::after{left:20px}
  @keyframes doorOpenL{0%{transform:rotateY(0)}100%{transform:rotateY(-95deg)}}
  @keyframes doorOpenR{0%{transform:rotateY(0)}100%{transform:rotateY(95deg)}}
  .gate-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;opacity:0;animation:gateLogo 1s ease 1.5s forwards}
  .gate-logo-inner{width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:52px solid var(--bone);
    filter:drop-shadow(0 0 12px var(--flame-glow))}
  .gate-logo-text{margin-top:8px;font-size:13px;color:var(--brass-2);letter-spacing:4px;text-shadow:0 0 10px var(--flame-glow)}
  @keyframes gateLogo{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .gate-title{font-size:24px;font-weight:700;color:var(--bone);letter-spacing:6px;text-indent:6px;
    text-shadow:0 0 20px var(--flame-glow);opacity:0;animation:gateFade 1s ease 1.8s forwards}
  .gate-subtitle{margin-top:10px;font-size:13px;color:var(--brass-2);letter-spacing:2px;opacity:0;animation:gateFade 1s ease 2.2s forwards}
  .gate-route-name{margin-top:20px;font-size:16px;color:var(--flame-2);letter-spacing:3px;font-weight:600;opacity:0;animation:gateFade 1s ease 2.6s forwards}
  @keyframes gateFade{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}

  /* ===== 地球定位组件 ===== */
  .globe-slot{position:fixed;z-index:15;overflow:hidden;
    background:radial-gradient(ellipse 80% 62% at 50% 12%,var(--jungle-5),var(--jungle-8) 62%,var(--jungle-9));
    box-shadow:0 0 0 1px var(--brass),0 0 0 4px rgba(10,20,8,.92),0 0 0 5px rgba(176,137,74,.3),0 14px 40px rgba(0,0,0,.5)}
  .globe-slot canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none}
  .globe-light{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background:radial-gradient(ellipse 66% 42% at 50% -8%,rgba(255,198,124,.20),transparent 72%),
      radial-gradient(ellipse 120% 92% at 50% 48%,transparent 44%,rgba(6,12,6,.62) 100%)}
  .globe-tags{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
  .globe-cap{position:absolute;left:0;right:0;bottom:0;padding:7px 12px;pointer-events:none;
    font-size:11.5px;color:var(--brass-2);letter-spacing:1.5px;font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;justify-content:space-between;
    background:linear-gradient(0deg,rgba(10,20,8,.85),rgba(10,20,8,0))}
  .globe-cap .gname{color:var(--bone);font-family:var(--serif);letter-spacing:2px;font-size:12.5px}
  .globe-cap .gcoord{font-family:var(--sans);opacity:.85;margin-left:8px}
  .globe-down{position:absolute;top:0;right:0;bottom:0;left:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;padding:0 26px 26px;text-align:center;
    background:radial-gradient(ellipse 74% 58% at 50% 38%,var(--jungle-5),var(--jungle-8) 62%,var(--jungle-9))}
  .globe-down.show{display:flex}
  .globe-down .gd-ttl{font-size:14px;color:var(--bone);letter-spacing:3px}
  .globe-down .gd-sub{margin-top:9px;font-size:11.5px;line-height:1.9;color:var(--ink-3);letter-spacing:1px}

  /* ===== 游览页（游览车视角）===== */
  .page-tour{background:radial-gradient(ellipse 92% 64% at 50% 26%,var(--route-mid),var(--route-dark) 60%,var(--jungle-9))}
  .tour-bar{flex:none;height:calc(var(--dishbar) + var(--sattop));padding:var(--sattop) 14px 0;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,rgba(6,12,6,.96),rgba(6,12,6,0))}
  .tour-bar > * + *{margin-left:12px}
  .tour-vehicle{flex-shrink:0;font-size:11px;color:var(--brass-2);letter-spacing:1.5px;font-variant-numeric:tabular-nums;
    padding:3px 8px;border:1px solid var(--line-2);border-radius:2px;background:rgba(6,12,6,.5)}
  .tour-vehicle b{color:var(--route-accent-2)}
  .tour-crumb{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--ink-4);letter-spacing:1.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tour-progress{flex-shrink:0;font-size:11px;color:var(--brass-2);letter-spacing:1px;font-variant-numeric:tabular-nums}
  .tour-progress b{color:var(--route-accent-2);font-size:13px}

  .tour-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:var(--globem);padding:16px 16px 100px}
  .tour-wrap{width:100%;max-width:680px;margin:0 auto}
  .tour-stage{display:flex;flex-direction:column;align-items:center;text-align:center}
  .tour-img{width:76vw;height:76vw;max-width:320px;max-height:320px;border-radius:4px;background:var(--bone-3);background-size:cover;background-position:center;
    box-shadow:0 0 0 1px var(--brass),0 0 0 10px rgba(244,240,230,.94),0 0 0 11px var(--brass),0 26px 64px rgba(0,0,0,.62)}
  .tour-name{margin-top:24px;font-size:24px;font-weight:700;color:var(--bone);letter-spacing:6px;text-indent:6px;text-shadow:0 2px 8px rgba(0,0,0,.55)}
  .tour-loc{margin-top:8px;font-size:12.5px;color:var(--brass-2);letter-spacing:2px}
  .tour-loc::before{content:"";display:inline-block;width:5px;height:5px;background:var(--brass-2);margin-right:7px;vertical-align:1px}
  .tour-intro{margin-top:16px;max-width:520px;font-size:13px;line-height:1.95;color:var(--ink-4);text-indent:2em;text-align:left}
  .tour-traits{margin-top:16px;max-width:520px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .tour-trait{font-size:12px;color:var(--bone);padding:3px 10px;border-radius:2px;
    background:rgba(176,137,74,.15);border:1px solid var(--line-2);letter-spacing:1px}
  .tour-tags{margin-top:10px;max-width:520px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .tour-tag{font-size:11px;color:var(--route-accent-2);padding:2px 8px;border-radius:2px;
    background:rgba(210,98,42,.10);letter-spacing:1px}

  /* 游览车控制栏 */
  .tour-controls{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px calc(12px + var(--sab));background:linear-gradient(180deg,var(--wood-7),var(--wood-9));
