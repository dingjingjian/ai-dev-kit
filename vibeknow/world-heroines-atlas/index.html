<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>世界女英雄图鉴 · WORLD HEROINES ATLAS</title>
<style>
  /* ===== 配图位（逐项规格、提示词与落位契约见 docs/配图提示词.md）=====
     ① 女英雄配图 ×22   assets/illus/<slug>.webp
        尺寸 1080×360（约 3:1 横幅，上机后按 cover 裁切填 132px 高的图槽），
        主体居中，左右各留约 10%、上下各留约 12% 安全边。
        路径写在 heroines.js 的 img 字段；缺图或加载失败时回退到下方形制化占位，
        不出现空白块，也不改变卡片尺寸（见 app.js 的 IMG_OK 预检）。
        明暗须与深紫红 + 暖白 + 暖橙金的三色定调一致，统一压暗、曙光调。 */
  :root{
    --bg:#1a0a14;
    --panel:rgba(40,16,28,.82);
    --line:rgba(228,200,160,.16);
    --line-2:rgba(232,160,74,.35);
    --txt:#f4e4c1;
    --mut:#c9a98e;
    --acc:#e8a04a;
    --dawn:#f4e4c1;
    --gold:#e8a04a;
    --gold-2:#f4c478;
    --serif:Georgia,"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --top-gap:50px;
    --sat:0px;
    --sab:0px;
  }
  @supports (top:env(safe-area-inset-top)){
    :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none}

  .top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--top-gap) + var(--sat)) 12px 8px;z-index:10;pointer-events:none}
  .brand{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:2px;color:var(--dawn);text-shadow:0 0 12px rgba(232,160,74,.4);text-align:center}
  .brand .sub{display:block;font-size:10px;font-weight:400;letter-spacing:3px;color:var(--acc);margin-top:2px;font-family:var(--sans)}
  .gear{position:absolute;right:12px;top:calc(var(--top-gap) + var(--sat));width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .gear svg{width:18px;height:18px;fill:none;stroke:var(--dawn);stroke-width:1.6}

  .tabs{position:fixed;left:50%;bottom:calc(var(--sab) + 16px);transform:translateX(-50%);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;-webkit-backdrop-filter:blur(14px) saturate(1.35);backdrop-filter:blur(14px) saturate(1.35);box-shadow:0 10px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);z-index:10;pointer-events:auto;max-width:calc(100vw - 20px);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;user-select:none;-webkit-user-select:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs.scrollable{-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent)}
  .tabs button{flex:0 0 auto;margin:0 2px;border:none;background:transparent;color:var(--mut);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;cursor:pointer;transition:color .18s,background .18s,transform .18s;white-space:nowrap;scroll-snap-align:center}
  .tabs button:active{transform:scale(.93)}
  .tabs button.on{background:linear-gradient(135deg,rgba(232,160,74,.92),rgba(244,196,120,.92));color:#1a0a14;box-shadow:0 2px 10px rgba(232,160,74,.35)}
  .tabs button:hover{color:var(--txt)}
  .tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 6px rgba(255,255,255,.25);transition:box-shadow .18s}
  .tabs button.on .dot{box-shadow:0 0 0 2px rgba(26,10,20,.3)}

  .card{position:fixed;left:50%;bottom:calc(var(--sab) + 72px);transform:translate(-50%,24px);width:calc(100vw - 28px);width:min(440px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:16px 18px 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:9;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
  .card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .card .close{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1}
  .card .civ{font-size:11px;color:var(--acc);letter-spacing:2px;font-family:var(--sans)}
  .card .name{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--dawn);margin-top:2px;letter-spacing:1px;padding-right:32px}
  /* 年代/身份行：曙光卡片特有的字段，moon-myths 没有 */
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .card .meta span{font-size:11px;color:var(--gold-2);background:rgba(232,160,74,.12);border:1px solid rgba(232,160,74,.3);border-radius:6px;padding:2px 8px;letter-spacing:.5px}
  .card .story{font-size:13.5px;color:var(--txt);margin-top:10px;line-height:1.72;font-family:var(--serif)}
  .card .tags{display:flex;flex-wrap:wrap;margin-top:12px}
  .card .tags span{font-size:11px;color:var(--acc);background:rgba(232,160,74,.1);border:1px solid rgba(232,160,74,.28);border-radius:6px;padding:3px 9px;margin:0 6px 6px 0}
  .card .loc{font-size:11px;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}
  .card .share{margin-top:12px;width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#b8722c,#e8a04a);color:#1a0a14;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:transform .15s}
  .card .share:active{transform:scale(.98)}
  .card .share:disabled{opacity:.6;cursor:default}

  /* 配图位：有图走 cover 铺满，无图走程序化占位（曙光渐变 + 星点 + 朝阳圆盘 + 文件名） */
  .card .pic{position:relative;height:132px;margin:12px 0 0;border-radius:10px;overflow:hidden;background-color:#1f0c18;
    background-image:
      radial-gradient(circle at 22% 18%,rgba(255,236,200,.55),rgba(255,236,200,0) 1.5%),
      radial-gradient(circle at 63% 76%,rgba(255,220,170,.4),rgba(255,220,170,0) 1.2%),
      radial-gradient(circle at 88% 60%,rgba(255,228,180,.45),rgba(255,228,180,0) 1.3%),
      radial-gradient(circle at 79% 24%,rgba(244,196,120,.2),rgba(244,196,120,0) 42%),
      radial-gradient(circle at 18% 84%,rgba(232,160,74,.18),rgba(232,160,74,0) 46%),
      linear-gradient(158deg,#2a1020,#1a0a14 62%,#241018);
    box-shadow:inset 0 0 0 1px var(--line),inset 0 -22px 40px rgba(0,0,0,.32)}
  .card .pic.has{background-size:cover;background-position:center}
  .card .pic.has .ph{display:none}
  .card .pic .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .card .pic .ph i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff4e0,#f4c478 58%,#b8722c 100%);box-shadow:0 0 16px rgba(244,196,120,.4)}
  .card .pic .ph span{font-size:10.5px;color:var(--mut);letter-spacing:1.5px;margin-top:9px}
  .card .pic .ph em{font-style:normal;font-size:10px;color:rgba(201,169,142,.5);margin-top:3px;font-variant-numeric:tabular-nums}

  /* 抽屉：顶部同样保留安全区（--sat），再加一段与顶部标题同高的 --top-gap */
  .sheet{position:fixed;top:0;right:0;bottom:0;width:86vw;width:min(300px,86vw);background:var(--panel);border-left:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:20;transform:translateX(100%);transition:transform .28s;padding:14px 18px;overflow-y:auto;padding-top:calc(var(--sat) + var(--top-gap));padding-bottom:calc(var(--sab) + 22px)}
  .sheet.show{transform:translateX(0)}
  .sheet h3{font-size:12px;color:var(--mut);letter-spacing:1.5px;margin:18px 0 10px;text-transform:uppercase}
  .sheet h3:first-child{margin-top:8px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
  .row label{font-size:14px}
  .sw{position:relative;width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.12);cursor:pointer;transition:.2s;flex-shrink:0}
  .sw.on{background:var(--acc)}
  .sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on i{left:21px}
  .sheet .close{position:absolute;top:calc(var(--sat) + var(--top-gap) + 2px);right:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);cursor:pointer;font-size:16px}
  .scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.4);z-index:19;opacity:0;transition:opacity .28s;pointer-events:none}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet button.act{flex:1;font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 0;cursor:pointer}
  .sheet button.act.gold{background:linear-gradient(135deg,#b8722c,#e8a04a);border:none;color:#1a0a14}
  .now{font-size:13px;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .now b{color:var(--acc);font-weight:600}
  .now em{display:block;font-style:normal;font-size:11.5px;color:var(--mut);line-height:1.85}

  .tip{position:fixed;left:50%;top:calc(var(--top-gap) + var(--sat) + 104px);transform:translateX(-50%);font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:8;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
  .tip.show{opacity:1}

  /* 标记名牌：圆点 + 描边取该大洲的颜色 */
  .tag{position:absolute;transform:translate(-50%,-140%);font-size:11.5px;color:var(--dawn);background:rgba(26,10,20,.72);border:1px solid var(--line-2);border-radius:10px;padding:3px 9px;white-space:nowrap;pointer-events:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:opacity .25s;z-index:5}
  .tag i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .tag.on{color:var(--gold-2);border-color:var(--acc);background:rgba(40,16,28,.9);box-shadow:0 2px 10px rgba(232,160,74,.28)}

  #loader{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:100;transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  .lt{font-family:var(--serif);font-size:22px;color:var(--dawn);letter-spacing:3px;margin-bottom:10px;text-shadow:0 0 14px rgba(232,160,74,.4)}
  .spin{width:42px;height:42px;border:3px solid rgba(232,160,74,.2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loader p{margin-top:14px;font-size:13px;color:var(--mut)}
  #fallback{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:200;text-align:center;padding:30px}
  #fallback.show{display:flex}
  #fallback h2{color:var(--acc);margin-bottom:10px}
  #fallback p{color:var(--mut);max-width:420px;line-height:1.6}

  @media (max-width:640px){
    .tabs{width:calc(100vw - 20px);max-width:calc(100vw - 20px);padding:5px}
    .tabs button{font-size:13px;padding:7px 11px}
    .tabs button .dot{width:7px;height:7px;margin-right:5px}
    .tag{font-size:12.5px;padding:3px 9px}
    .brand{font-size:16px}
    .card .name{font-size:17px}
    .card .story{font-size:13px}
    .card .pic{height:112px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="top">
  <div class="brand">世界女英雄图鉴<span class="sub">WORLD HEROINES ATLAS</span></div>
  <div class="gear" id="gear">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="11" cy="7" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="8" cy="17" r="2"/></svg>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="tip" id="tip">拖动旋转地球 · 点亮光点读女英雄的故事</div>

<div class="card" id="card">
  <button class="close" id="cClose" aria-label="关闭">×</button>
  <div class="civ" id="cCiv"></div>
  <div class="name" id="cName"></div>
  <div class="meta" id="cMeta"></div>
  <div class="pic" id="cPic"><div class="ph"><i></i><span>配图待生成</span><em id="cPicFile"></em></div></div>
  <div class="story" id="cStory"></div>
  <div class="tags" id="cTags"></div>
  <div class="loc" id="cLoc"></div>
  <button class="share" id="cShare">分享到小红书</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <button class="close" id="sClose" aria-label="关闭">×</button>
  <h3>此刻 · 北京时间</h3>
  <div class="now" id="nowInfo">—</div>
  <h3>显示</h3>
  <div class="row"><label>自动旋转</label><div class="sw on" id="swSpin"><i></i></div></div>
  <div class="row"><label>星空背景</label><div class="sw on" id="swStars"><i></i></div></div>
  <div class="row"><label>云层</label><div class="sw on" id="swClouds"><i></i></div></div>
  <div class="row"><label>标记标签</label><div class="sw on" id="swLabel"><i></i></div></div>
  <h3>视角</h3>
  <div style="display:flex;margin-top:4px">
    <button class="act" id="bReset" style="margin-right:8px">重置视角</button>
    <button class="act gold" id="bTop">俯视</button>
  </div>
</div>

<div id="loader">
  <div class="lt">世界女英雄图鉴</div>
  <div class="spin"></div>
  <p>正在点亮曙光…</p>
</div>
<div id="fallback"><h2>无法启动 3D 场景</h2><p>当前浏览器不支持 WebGL，请使用最新版 Chrome / Edge / Firefox / Safari。</p></div>

<script src="./assets/three.min.js"></script>
<script src="./assets/heroines.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
