<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>罗马军团图鉴 · 兵种志</title>
<style>
  /* ===== 罗马军团图鉴 · 兵种志 =====
     选阵营 → 点兵编排 → 凯旋门 → 逐兵种检阅 → 军团志。
     配色：暗青铜 / 金 / 大理石白 / 帝国红；8 个阵营各一套主题色，切换整页换装。
     视觉口径：主视觉一律用 AI 出图（logo / 过渡画面 / 阵营横幅），页面只做排版与
     一层可读性暗化，不画 CSS 或 SVG 形状。地球为「征召地定位组件」，仅检阅页内嵌。 */

  /* ===== 素材图位（逐项规格见 docs/ 下三份素材需求）=====
     原则：页面里不再画任何 CSS/SVG 装饰，缺什么素材就退到什么底，不留手绘替代图形。
     ① 兵种图 ×96  assets/units/<id>.webp        写实风格 ×48（默认，缺图回退色卡）
                    assets/units/card/<id>.webp  兵牌风格 ×48（检阅页可切换，缺图回退色卡）
                    均为 512×512 方图，两套各自独立出图，规格见 docs/兵种图片素材需求.md
     ② 图鉴 logo    assets/tex/logo.webp          透明底 SPQR 鹰旗徽章，缺图则整块隐藏
     ③ 凯旋门正面   assets/tex/gate-front.webp    过渡页**通用**兜底（横版）；⑨ 全缺时用它
     ④ —            已取消：过渡页不再需要「穿行」第二帧
     ⑤ 竖版单帧     assets/tex/gate-front-portrait.webp
                                                  过渡页竖屏通用兜底，可以先不出
     ⑥ 旧兜底内景   assets/tex/gate.webp          ③⑤ 的最后兜底
     ⑦ 大理石纹理   assets/tex/marble.webp        卡片 / 控制栏底纹 + 首页 hero 轮播的兜底层
     ⑧ 阵营横幅 ×9  assets/tex/faction-<key>.webp 阵营卡片背景 + 首页 hero 轮播（8 个预设阵营）
     ⑨ 过渡画面 ×9  assets/tex/gate-<key>.webp    「即将检阅」页的主素材，**每个阵营一张**
                                                  （key = units.js 的 FACTIONS[].key，自选军团是 custom）；
                                                  缺则退该阵营横幅 → ③ → ⑥，页面照常跑
     ⑩ 背景音乐     assets/audio/bgm.js           base64 音频（源曲目是构建输入，不打进包）
     ⑪ 装备图集 ×52 assets/gear/<id>.webp          128×128 透明底，检阅页右列「装备拆解」用；
                                                   名单是 assets/gear.js 的 GEAR，缺图退成槽位名
     ①      规格见 docs/兵种图片素材需求.md
     ②~⑨   规格见 docs/场景配图需求.md
     ⑩      规格（乐句 / 码率 / 循环点 / 版权）见 docs/背景音乐需求.md
     ⑪      规格（逐件描述 / 统一风格 / 提示词）见 docs/装备图集需求.md */

  :root{
    /* 大理石白系（文字 / 铭牌） */
    --stone:#f3ede1;--stone-2:#e6dfcf;--stone-3:#d2c9b4;--stone-4:#aaa08a;
    /* 金系（边框 / 铭牌 / 徽章） */
    --gold:#c9a13b;--gold-2:#e3c268;--gold-3:#f6e6b4;--gold-glow:rgba(201,161,59,.30);
    /* 暗青铜系（底 / 控制栏 / 画框） */
    --iron-9:#0b0a09;--iron-8:#141210;--iron-7:#1f1c18;--iron-6:#2c2823;--iron-5:#3d372f;
    /* 帝国红（默认强调，罗马本体） */
    --crimson:#d0433a;--crimson-2:#ea6b58;--crimson-glow:rgba(208,67,58,.34);
    /* 墨色 */
    --ink:#1a1510;--ink-2:#5a5248;--ink-3:#8a8175;--ink-4:#b3aa9c;
    /* 线条 */
    --line:rgba(201,161,59,.28);--line-2:rgba(201,161,59,.45);
    /* 阵营主题色（默认 = 罗马本体，由 app.js 按 faction 切换） */
    --f-dark:#2a080a;--f-mid:#5c1418;--f-light:#96302a;
    --f-accent:var(--crimson);--f-accent-2:var(--crimson-2);
    --f-banner:url('./assets/tex/faction-rome.webp');

    --serif:Georgia,"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --shadow:0 10px 34px rgba(0,0,0,.45);
    --bar:52px;
    /* 右上角音乐开关：贴在地球槽右上角那一带、**顶栏之下** —— 不占顶栏空间，
       顶栏就不必为它留右侧空白，标题才能真居中。
       --bgmgap = 开关顶边在地球槽顶边之下多少（要挪位置就改这一个数） */
    --bgmgap:12px;
    --hero-h:140px;
    /* 安全区：基线取容器可注入的 --safe-area-inset-*（PC 模拟器就是靠注入这几个变量
       模拟安全区），增强层再退 env()。两级都不写死固定值，否则模拟器 / 刘海机上
       顶栏与右上角浮层会被状态栏压住。基线层刻意不写 env()：Chrome 61 不支持它，
       写进去会让整条 top 值失效。 */
    --sat:var(--safe-area-inset-top,0px);
    --sattop:calc(8px + var(--safe-area-inset-top,0px));
    --sab:var(--safe-area-inset-bottom,0px);
  }
  @supports (top:env(safe-area-inset-top)){
    :root{
      --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
      --sattop:calc(8px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));
      --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
    }
  }

  /* ===== 阵营主题（8 套 + 自选，由 body[data-faction] 切换）===== */
  body[data-faction="rome"]{
    --f-dark:#2a080a;--f-mid:#5c1418;--f-light:#96302a;
    --f-accent:#d0433a;--f-accent-2:#ea6b58;
    --f-banner:url('./assets/tex/faction-rome.webp')}
  body[data-faction="carthage"]{
    --f-dark:#170a24;--f-mid:#33144d;--f-light:#5c2a85;
    --f-accent:#a463c8;--f-accent-2:#c48ee0;
    --f-banner:url('./assets/tex/faction-carthage.webp')}
  body[data-faction="macedon"]{
    --f-dark:#060f1c;--f-mid:#102541;--f-light:#1d4676;
    --f-accent:#3f8fc0;--f-accent-2:#6fb2dc;
    --f-banner:url('./assets/tex/faction-macedon.webp')}
  body[data-faction="seleucid"]{
    --f-dark:#1d1506;--f-mid:#3d2c0a;--f-light:#7a5a14;
    --f-accent:#d9a13b;--f-accent-2:#f0c469;
    --f-banner:url('./assets/tex/faction-seleucid.webp')}
  body[data-faction="egypt"]{
    --f-dark:#04211e;--f-mid:#0a3d38;--f-light:#12665d;
    --f-accent:#2fae9a;--f-accent-2:#5fd0bf;
    --f-banner:url('./assets/tex/faction-egypt.webp')}
  body[data-faction="parthia"]{
    --f-dark:#0f1a0a;--f-mid:#223a12;--f-light:#3f6b22;
    --f-accent:#7fae45;--f-accent-2:#a3cc6a;
    --f-banner:url('./assets/tex/faction-parthia.webp')}
  body[data-faction="gaul"]{
    --f-dark:#0a1218;--f-mid:#18262f;--f-light:#2f4350;
    --f-accent:#7c98ab;--f-accent-2:#a7becd;
    --f-banner:url('./assets/tex/faction-gaul.webp')}
  body[data-faction="germania"]{
    --f-dark:#1a0d05;--f-mid:#3a1d0c;--f-light:#6b3a18;
    --f-accent:#b0703a;--f-accent-2:#d0975d;
    --f-banner:url('./assets/tex/faction-germania.webp')}
  body[data-faction="custom"]{
    --f-dark:#14110a;--f-mid:#332b12;--f-light:#7a6a25;
    --f-accent:#c9a93e;--f-accent-2:#e8cf6a;
    --f-banner:url('./assets/tex/faction-custom.webp')}

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;color:var(--stone);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(ellipse 80% 60% at 50% 10%,var(--iron-6),var(--iron-8) 60%,var(--iron-9) 100%)}

  /* ===== 页面容器 ===== */
  .page{position:fixed;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
  body.mode-factions .page-factions{display:flex}
  body.mode-builder .page-builder{display:flex}
  body.mode-gate .page-gate{display:flex}
  body.mode-review .page-review{display:flex}
  body.mode-summary .page-summary{display:flex}

  /* ===== 阵营选择页 =====
     版式：通栏横幅固定在顶，列表区自己滚动，横幅不会被带走 */
  .page-factions{overflow:hidden}
  /* 顶部视觉区：整块交给 AI 出的图，只叠一层暗化保文字可读，不做任何 CSS 绘制 */
  .park-hero{flex:none;position:relative;height:calc(var(--hero-h) + 150px + var(--sattop));padding-top:var(--sattop);overflow:hidden;
    background:radial-gradient(ellipse 90% 70% at 50% 30%,var(--iron-5),var(--iron-8) 70%,var(--iron-9))}
  /* 首页 hero = 八大军团**阵营横幅轮播**（与 age-of-sail-3d 的 .hero-shot 同构）：
     8s 一格、纯 CSS 循环交叉淡化，无 JS 定时器；每层自带
     「阵营横幅 → 大理石」回退链，两层都缺就露出上面的径向渐变底，不空屏。
     横幅规格见 docs/场景配图需求.md 七、——它同时做卡片底图与 hero 轮播，焦点须落在画面中部。 */
  .park-shots{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0}
  .park-shot{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;
    background-size:cover,190px auto;background-position:center 50%,center;background-repeat:no-repeat,repeat;
    animation:heroCycle 64s linear infinite}
  .park-shot:nth-child(1){background-image:url('./assets/tex/faction-rome.webp'),url('./assets/tex/marble.webp')}
  .park-shot:nth-child(2){animation-delay:8s;background-image:url('./assets/tex/faction-carthage.webp'),url('./assets/tex/marble.webp')}
  .park-shot:nth-child(3){animation-delay:16s;background-image:url('./assets/tex/faction-macedon.webp'),url('./assets/tex/marble.webp')}
  .park-shot:nth-child(4){animation-delay:24s;background-image:url('./assets/tex/faction-seleucid.webp'),url('./assets/tex/marble.webp')}
  .park-shot:nth-child(5){animation-delay:32s;background-image:url('./assets/tex/faction-egypt.webp'),url('./assets/tex/marble.webp')}
  .park-shot:nth-child(6){animation-delay:40s;background-image:url('./assets/tex/faction-parthia.webp'),url('./assets/tex/marble.webp')}
  .park-shot:nth-child(7){animation-delay:48s;background-image:url('./assets/tex/faction-gaul.webp'),url('./assets/tex/marble.webp')}
  .park-shot:nth-child(8){animation-delay:56s;background-image:url('./assets/tex/faction-germania.webp'),url('./assets/tex/marble.webp')}
  @keyframes heroCycle{0%{opacity:0}1.5%{opacity:1}11%{opacity:1}12.5%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .park-shot{animation:none}
    .park-shot:nth-child(1){opacity:1}}
  .park-hero::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,rgba(8,7,6,.36) 0%,rgba(8,7,6,.10) 24%,rgba(8,7,6,.34) 62%,rgba(8,7,6,.74) 84%,var(--iron-9) 100%)}
  .park-brand{position:absolute;left:0;right:0;bottom:18px;z-index:2;text-align:center;padding:0 16px}
  /* logo 用 AI 出的图；没图就整块隐藏，不留任何 CSS 画的替代图形 */
  .park-logo{display:none;width:auto;height:82px;margin:0 auto 10px;
    background-image:url('./assets/tex/logo.webp');background-size:contain;background-position:center bottom;background-repeat:no-repeat;
    filter:drop-shadow(0 2px 7px rgba(0,0,0,.85)) drop-shadow(0 0 18px rgba(0,0,0,.55))}
  html.has-logo .park-logo{display:block}
  .park-ttl{font-size:27px;font-weight:700;color:var(--stone);letter-spacing:9px;text-indent:9px;
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 26px var(--gold-glow)}
  .park-sub{font-size:11.5px;color:var(--gold-2);margin-top:7px;letter-spacing:3.5px;text-shadow:0 1px 5px rgba(0,0,0,.85)}
  @keyframes blip{0%,100%{opacity:.45}50%{opacity:1}}

  /* 阵营列表（军牌） */
  .route-section{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    width:100%;max-width:820px;margin:0 auto;padding:16px 16px calc(96px + var(--sab))}
  .route-section-title{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold-2);letter-spacing:4px;margin-bottom:18px}
  .route-section-title::before,.route-section-title::after{content:"";flex:1;height:1px;margin:0 12px;
    background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 12px)}
  .route-card{display:block;width:100%;margin-bottom:14px;padding:0;border:none;background:transparent;cursor:pointer;text-align:left;
    text-decoration:none;color:inherit;position:relative;overflow:hidden;border-radius:3px;
    box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 1px rgba(201,161,59,.22);
    transition:transform .2s,box-shadow .2s}
  .route-card:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 0 1px var(--gold)}
  .route-card:active{transform:translateY(0)}
  /* 底图：阵营横幅 → 大理石 → 主题渐变（前者缺图逐级回退），只叠一层左暗右亮渐变保文字可读 */
  .route-card-bg{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;
    background-image:
      linear-gradient(90deg,rgba(8,7,6,.84) 0%,rgba(8,7,6,.48) 60%,rgba(8,7,6,.20) 100%),
      var(--rc-banner),
      url('./assets/tex/marble.webp'),
      linear-gradient(135deg,var(--rc-dark),var(--rc-mid));
    background-size:cover,cover,190px auto,auto;background-position:center,center,center,center;
    background-repeat:no-repeat,no-repeat,repeat,no-repeat}
  /* 牌面：只留一层细描边 */
  .route-card-inner{position:relative;z-index:1;padding:18px 20px 18px 22px;
    box-shadow:inset 0 0 0 1px rgba(201,161,59,.22)}
  .route-card-head{display:flex;align-items:baseline;justify-content:space-between}
  .route-card-head > * + *{margin-left:12px}
  .route-name{font-size:22px;font-weight:700;color:var(--stone);letter-spacing:3px}
  .route-latin{flex:none;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:2px;
    color:var(--rc-accent-2);opacity:.9}
  .route-desc{margin-top:8px;font-size:13px;line-height:1.75;color:var(--stone-2);letter-spacing:.5px}
  .route-meta{margin-top:10px;display:flex;align-items:center;flex-wrap:wrap}
  .route-meta > * + *{margin-left:14px}
  .route-stat{font-size:12px;color:var(--stone-3);letter-spacing:1px;display:flex;align-items:center}
  .route-stat b{color:var(--rc-accent-2);font-size:14px;font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
  .route-intensity{display:inline-flex}
  .route-intensity i{margin-left:2px;width:7px;height:7px;border-radius:50%;background:var(--stone-4);opacity:.3}
  .route-intensity i.on{background:var(--rc-accent);opacity:1}
  /* 预设阵营不再显示 TAB 铭牌、徽章与 CTA（整卡可点，主题由阵营名 + 实力点阵表达） */
  .route-tab,.route-badge,.route-cta{display:none}

  /* 阵营选择页底栏 */
  .routes-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 16px calc(10px + var(--sab));text-align:center;
    background:linear-gradient(180deg,var(--iron-7),var(--iron-9));border-top:1px solid var(--line)}
  .routes-bar-text{font-size:11px;color:var(--ink-3);letter-spacing:2px}

  /* ===== 过渡页（即将检阅） =====
     主素材是**按阵营取的一张过渡画面**：⑨ assets/tex/gate-<key>.webp（1600×900，key = 选中阵营）。
     整段就是 7.1s 的缓慢推近（.gate-shot 的 shotPush 动画），播完即进检阅页。
     兜底链全部由 CSS 的多层 background-image 完成 —— 前一层 404 就露出下一层，
     JS 不参与判定，所以不存在「素材加载 / 起播失败」这类会卡住的状态分支：
       横屏  ⑨ gate-<key> → 该阵营横幅 → ③ gate-front → ⑥ gate
       竖屏  ⑨ gate-<key> → 该阵营横幅 → ⑤ gate-front-portrait → ③ → ⑥
     --gate-art 由 app.js 在 enterGate() 里按阵营写入（两层：专属图 + 该阵营横幅）；
     默认 none，JS 没跑起来时页面退到 ③/⑥ 的通用画面。 */
  .page-gate{background:#050403;align-items:center;justify-content:center;overflow:hidden}
  .gate-stage{--gate-art:none;
    position:relative;width:100%;height:100%;max-width:760px;margin:0 auto;overflow:hidden}
  /* 模糊铺底：contain 留出的信箱边用它填满，画面不空 */
  .gate-bg{position:absolute;top:-5%;right:-5%;bottom:-5%;left:-5%;
    background-image:var(--gate-art),url('./assets/tex/gate-front.webp'),url('./assets/tex/gate.webp');
    background-size:cover;background-position:center;background-repeat:no-repeat;
    filter:blur(26px) saturate(.75);opacity:.42}
  /* contain 而非 cover：保证门 / 入口永远完整可见（竖屏也不会裁掉立柱）。
     只有一帧，所以不做交叉淡化 —— 整段就是一路推近，opacity 恒为 1。 */
  .gate-shot{position:absolute;top:0;right:0;bottom:0;left:0;
    background-size:contain;background-position:center;background-repeat:no-repeat;
    background-image:var(--gate-art),url('./assets/tex/gate-front.webp'),url('./assets/tex/gate.webp');
    animation:shotPush 7s cubic-bezier(.35,.02,.62,1) forwards}
  /* 竖屏：⑨ 与阵营横幅照样优先（每阵营不同 ＞ 竖版更满幅），它们都没有时才轮到 ⑤ */
  @media (orientation:portrait){
    .gate-bg{background-image:var(--gate-art),url('./assets/tex/gate-front-portrait.webp'),
      url('./assets/tex/gate-front.webp'),url('./assets/tex/gate.webp')}
    .gate-shot{background-image:var(--gate-art),url('./assets/tex/gate-front-portrait.webp'),
      url('./assets/tex/gate-front.webp'),url('./assets/tex/gate.webp')}
  }
  @keyframes shotPush{
    0%{transform:scale(1)}
    30%{transform:scale(1.15)}
    100%{transform:scale(1.5)}}
  /* 字幕压字遮罩（只为可读性，不是装饰） */
  .gate-scrim{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,4,3,.34) 0%,rgba(5,4,3,0) 30%,rgba(5,4,3,.10) 58%,rgba(5,4,3,.78) 100%)}
  /* 字幕：早出现、长停留（约 5s 可看清），最后才随整场一起淡出 */
  .gate-caption{position:absolute;left:0;right:0;bottom:8%;z-index:12;text-align:center;padding:0 22px;
    animation:gateCapOut .9s ease 6.2s forwards}
  @keyframes gateCapOut{0%{opacity:1}100%{opacity:0}}
  .gate-title{font-size:23px;font-weight:700;color:var(--stone);letter-spacing:6px;text-indent:6px;
    text-shadow:0 0 22px var(--gold-glow),0 2px 10px rgba(0,0,0,.95);animation:gateFade .9s ease 1.1s both}
  .gate-subtitle{margin-top:9px;font-size:12.5px;color:var(--gold-2);letter-spacing:2px;
    text-shadow:0 1px 6px rgba(0,0,0,.95);animation:gateFade .9s ease 1.6s both}
  .gate-route-name{margin-top:16px;display:inline-block;font-size:13px;color:var(--ink);letter-spacing:2.5px;font-weight:700;
    padding:6px 18px;background:linear-gradient(180deg,var(--gold-3),var(--gold));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 6px 18px rgba(0,0,0,.6);animation:gateFade .9s ease 2.1s both}
  @keyframes gateFade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}

  /* ===== 装备拆解（检阅页右列）=====
     版式：兵种图在左，槽位列表在右，两者同高对齐。
     空槽**不渲染**（一件没有就不占位）；说明固定两行 —— 行高一致，
     48 个兵种横比时槽位才对得齐。
     图位 ./assets/gear/<id>.webp（128×128 透明底，规格见 docs/装备图集需求.md）；
     缺图时把槽位名摊在图标位上，绝不出现空框（由 app.js 预检后加 .has-img）。 */
  .tour-row{display:flex;align-items:center;justify-content:center;width:100%;max-width:430px}
  .tour-row > * + *{margin-left:14px}
  .gear{flex:1;min-width:0}
  .gear-ttl{font-family:var(--sans);font-size:9.5px;color:var(--gold-2);letter-spacing:2px;
    padding-bottom:5px;margin-bottom:5px;box-shadow:inset 0 -1px 0 var(--line)}
  .gear-i{display:flex;align-items:center;padding:3px 0}
  .gear-i + .gear-i{box-shadow:inset 0 1px 0 rgba(201,161,59,.13)}
  .gear-ic{flex:none;width:28px;height:28px;margin-right:8px;background-color:rgba(201,161,59,.08);
    background-size:contain;background-position:center;background-repeat:no-repeat;
    box-shadow:inset 0 0 0 1px rgba(201,161,59,.26)}
  .gear-ic i{display:flex;width:100%;height:100%;align-items:center;justify-content:center;
    font-style:normal;font-family:var(--sans);font-size:9px;color:var(--gold-2);letter-spacing:.5px}
  .gear-ic.has-img i{display:none}
  .gear-tx{min-width:0;flex:1}
  .gear-nm{font-size:11.5px;letter-spacing:.6px;color:var(--stone);line-height:1.25}
  .gear-no{font-family:var(--sans);font-size:9.5px;line-height:1.4;color:var(--ink-3);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ===== 检阅页 ===== */
  .page-review{background:radial-gradient(ellipse 92% 64% at 50% 26%,var(--f-mid),var(--f-dark) 60%,var(--iron-9))}
  /* 顶栏：只留一条（左右信息按需求删除） */
  .tour-bar{flex:none;height:calc(var(--bar) + var(--sattop));padding:var(--sattop) 14px 0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(8,7,6,.97),rgba(8,7,6,.58) 74%,rgba(8,7,6,0))}
  .tour-crumb{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--gold-2);letter-spacing:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 版式：顶栏 → 内容区（兵种图 + 装备拆解 / 档案卡）→ 底部操作栏 */
  .tour-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;
    padding:10px 16px calc(72px + var(--sab))}
  .tour-wrap{width:100%;max-width:820px;margin:0 auto;flex:1;min-height:0;display:flex}
  .tour-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* 兵种图画框：兵种图是 1:1 方图（两种风格都按方图出，规格见 docs/兵种图片素材需求.md），
     所以画框也做成正方形 —— 方图正好填满方框，不会从上下裁掉头与脚。
     边长（宽高同值）随视口高收缩，屏幕多矮都整块等比变小，不裁图、不压扁。
     画框只做容器：金线描边 + 投影。原先那套「青铜铭牌」叠层（扫描线 / 缓扫光泽 /
     暗角 / HUD 角标）已删除 —— 画面表达交给图片本身，页面不再往图上叠任何东西。 */
  .tour-frame{position:relative;flex:0 1 auto;overflow:hidden;
    width:24vh;height:24vh;min-width:88px;min-height:88px;max-width:190px;max-height:190px;
    border-radius:2px;box-shadow:0 0 0 1px rgba(201,161,59,.6),0 12px 30px rgba(0,0,0,.6)}
  /* contain + 深色底：万一画框被 flex 挤成非方形（极矮视口），
     也只会在两侧留深色边，绝不裁图。同样不加滤镜——写实那套要保真。 */
  .tour-img{width:100%;height:100%;border-radius:2px;
    background-color:var(--iron-8);background-size:contain;background-repeat:no-repeat;background-position:center}

  /* 风格切换：写实 / 兵牌两套独立出图，这里只负责选哪一套。
     做成一小段分段开关放在画框之下，不压画面。 */
  .tour-style{display:flex;align-items:center;justify-content:center;margin-top:12px}
  .ts-btn{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:2px;
    padding:5px 14px;border:1px solid var(--line-2);background:rgba(8,7,6,.72);
    color:var(--ink-3);cursor:pointer;transition:.15s}
  .ts-btn + .ts-btn{margin-left:-1px}
  .ts-btn:first-child{border-radius:2px 0 0 2px}
  .ts-btn:last-child{border-radius:0 2px 2px 0}
  .ts-btn.on{color:#1a1408;background:linear-gradient(180deg,var(--gold-2),var(--gold));
    border-color:var(--gold-2);box-shadow:0 0 12px var(--gold-glow)}
  .ts-btn:hover:not(.on){color:var(--stone-2);background:rgba(246,230,180,.10)}
  .ts-off{font-family:var(--sans);font-size:9.5px;letter-spacing:1px;color:var(--ink-4);margin-left:10px}
  body.img-missing .ts-off{display:none}
  /* 档案卡：图片之下的一张信息卡，卡内一律左对齐 */
  .tour-card{width:100%;max-width:540px;margin-top:20px;padding:11px 13px 12px;border-radius:3px;text-align:left;
    background:linear-gradient(180deg,rgba(14,12,10,.80),rgba(8,7,6,.74));
    box-shadow:inset 0 0 0 1px var(--line-2),0 10px 26px rgba(0,0,0,.4)}
  /* 卡头：名称（左）+ 等级徽章（右） */
  .tour-head{display:flex;align-items:baseline;justify-content:space-between}
  .tour-head > * + *{margin-left:10px}
  .tour-name{font-size:21px;font-weight:700;color:var(--stone);letter-spacing:2.5px;line-height:1.25;
    text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .tour-paddock{flex:none;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:var(--ink);
    padding:2px 8px;border-radius:2px;background:linear-gradient(180deg,var(--gold-2),var(--gold));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
  /* 征召地 + 编制数据并作一行 */
  .tour-meta{margin-top:5px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
  .tour-meta > * + *{margin-left:10px}
  .tour-loc{flex:1;min-width:0;font-size:11.5px;color:var(--gold-2);letter-spacing:1.4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tour-data{flex:none;font-family:var(--sans);font-size:10.5px;color:var(--stone-3);letter-spacing:1px;white-space:nowrap}
  .tour-data em{font-style:normal;color:var(--f-accent-2);font-weight:700}
  .tour-data i{font-style:normal;opacity:.35;margin:0 6px}
  .tour-intro{margin-top:9px;font-size:12.5px;line-height:1.75;color:var(--ink-4);letter-spacing:.3px;
    display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  /* 卡底一行：特征 + 标签同排 */
  .tour-chips{margin-top:9px;display:flex;flex-wrap:wrap;align-items:center}
  .tour-traits{display:flex;flex-wrap:wrap;align-items:center}
  .tour-trait{margin:0 6px 0 0;font-size:11.5px;color:var(--stone);padding:2px 9px;border-radius:2px;
    background:rgba(201,161,59,.14);box-shadow:inset 0 0 0 1px var(--line-2);letter-spacing:1px}
  .tour-tagline{flex-shrink:0;font-size:11px;color:var(--f-accent-2);letter-spacing:1.2px;margin-left:auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tour-tagline i{font-style:normal;opacity:.4;margin:0 5px}

  /* ===== 通用底栏与按钮（检阅 / 军团志 / 自选三页共用）===== */
  .tour-controls,.summary-controls,.builder-controls{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:12px 16px calc(12px + var(--sab));
    background:linear-gradient(180deg,var(--iron-6),var(--iron-8) 42%,var(--iron-9));
    border-top:2px solid var(--gold);box-shadow:0 -8px 26px rgba(0,0,0,.62)}
  .tour-controls > * + *,.summary-controls > * + *,.builder-controls > * + *{margin-left:12px}
  .bar-btn{border:none;cursor:pointer;font-family:var(--serif);font-weight:700;transition:.15s;white-space:nowrap;border-radius:2px;
    font-size:14px;letter-spacing:2px;padding:10px 18px}
  .bar-btn-primary{background:linear-gradient(180deg,var(--gold-3),var(--gold));color:var(--ink);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 4px 14px rgba(0,0,0,.45)}
  .bar-btn-primary:hover{background:linear-gradient(180deg,#fff6d8,var(--gold-2))}
  .bar-btn-primary:disabled{opacity:.35;cursor:not-allowed}
  .bar-btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-4)}
  .bar-btn-ghost:hover{background:rgba(201,161,59,.18);color:var(--stone)}
  .bar-btn-ghost:disabled{opacity:.3;cursor:not-allowed}

  /* ===== 军团志（总结页）===== */
  .page-summary{background:radial-gradient(ellipse 80% 60% at 50% 10%,var(--iron-6),var(--iron-8) 60%,var(--iron-9))}
  .summary-bar{flex:none;height:calc(var(--bar) + var(--sattop));padding:var(--sattop) 14px 0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(8,7,6,.97),rgba(8,7,6,.6) 74%,rgba(8,7,6,0));
    box-shadow:inset 0 -1px 0 rgba(201,161,59,.20)}
  .summary-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px calc(96px + var(--sab))}
  .summary-wrap{width:100%;max-width:820px;margin:0 auto}
  .summary-ttl{font-size:22px;font-weight:700;color:var(--stone);letter-spacing:6px;text-indent:6px;text-align:center}
  .summary-sub{font-size:12px;color:var(--gold-2);margin-top:8px;letter-spacing:1.5px;text-align:center}
  .summary-sub b{color:var(--crimson-2);font-size:15px;font-variant-numeric:tabular-nums}
  /* 检阅简报：一句自然播报 */
  .summary-brief{margin:14px auto 2px;max-width:470px;text-align:center;font-size:12.5px;
    line-height:1.95;color:var(--ink-4);letter-spacing:1px}
  .summary-brief b{color:var(--crimson-2);font-weight:700;font-variant-numeric:tabular-nums}
  .sec{display:flex;align-items:center;margin:18px 0 8px;font-size:13.5px;font-weight:700;color:var(--gold-2);letter-spacing:4px}
  .sec:first-child{margin-top:0}
  .sec::after{content:"";flex:1;border-bottom:1px dotted var(--line-2);transform:translateY(-4px)}
  .secnote{margin-left:auto;font-size:11px;font-weight:400;color:var(--ink-3);letter-spacing:1px}
  /* 六维战力雷达图 */
  .radar{display:block;width:100%;max-width:320px;height:auto;margin:2px auto 0}
  .radar .grid{fill:none;stroke:var(--line-2);stroke-width:1}
  .radar .grid.edge{stroke:var(--gold);stroke-width:1.2}
  .radar .axis{stroke:var(--line);stroke-width:1}
  .radar .face{fill:var(--crimson);fill-opacity:.20;stroke:var(--crimson);stroke-width:1.6;stroke-linejoin:round}
  .radar .dot{fill:var(--crimson)}
  .radar .lab{fill:var(--ink-3);font-family:var(--serif);font-size:12px;font-weight:700;letter-spacing:1px}
  .radar .lab.peak{fill:var(--crimson-2)}
  .radar .val{fill:var(--ink-4);font-size:10.5px;font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums}
  .sum-dish{display:flex;align-items:baseline;padding:8px 2px;border-bottom:1px dotted var(--line)}
  .sum-dish > * + *{margin-left:9px}
  .sum-dish .sum-dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px rgba(8,7,6,.35);transform:translateY(1px)}
  /* 大队编号：原先是压在兵种图上的 HUD 角标，铭牌叠层去掉后落到这一行文字里 */
  .sum-dish .sum-dnum{flex:none;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:1px;
    color:var(--gold-2);opacity:.8;min-width:22px}
  .sum-dish .sum-dname{flex:none;font-size:14px;font-weight:700;color:var(--stone);letter-spacing:1.5px}
  .sum-dish .sum-dmeta{flex:1;min-width:12px;font-size:11.5px;color:var(--ink-3);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum-dish .sum-dtags{flex:none;font-size:12px;color:var(--gold-2);letter-spacing:1px;font-variant-numeric:tabular-nums}

  /* ===== 自选军团页 ===== */
  .page-builder{background:radial-gradient(ellipse 86% 56% at 50% 8%,var(--f-mid),var(--f-dark) 58%,var(--iron-9))}
  .builder-bar{flex:none;height:calc(var(--bar) + var(--sattop));padding:var(--sattop) 14px 0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(8,7,6,.97),rgba(8,7,6,.6) 74%,rgba(8,7,6,0));
    box-shadow:inset 0 -1px 0 rgba(201,161,59,.20)}
  .builder-ttl{flex:1;min-width:0;text-align:center;font-size:13.5px;color:var(--stone);letter-spacing:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .builder-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(96px + var(--sab))}
  .builder-wrap{width:100%;max-width:820px;margin:0 auto}
  .builder-note{font-size:12px;line-height:1.9;color:var(--ink-3);letter-spacing:1px;
    padding:10px 12px;background:rgba(8,7,6,.45);border-radius:2px;box-shadow:inset 0 0 0 1px var(--line)}
  /* 已选编制（可调序） */
  .bd-picked{min-height:44px;padding:8px;border-radius:2px;
    background:rgba(8,7,6,.4);box-shadow:inset 0 0 0 1px var(--line)}
  .bd-picked-empty{font-size:12px;color:var(--ink-3);letter-spacing:1px;padding:10px 6px;text-align:center}
  .bd-chip{display:flex;align-items:center;margin-bottom:6px;padding:6px 8px;border-radius:2px;
    background:linear-gradient(90deg,rgba(201,161,59,.14),rgba(201,161,59,.04));
    box-shadow:inset 0 0 0 1px var(--line)}
  .bd-chip > * + *{margin-left:8px}
  .bd-chip .bd-seq{flex:none;width:20px;text-align:center;font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--gold-2);font-variant-numeric:tabular-nums}
  .bd-chip .bd-dot{flex:none;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(8,7,6,.5)}
  .bd-chip .bd-nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--stone);letter-spacing:1.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bd-chip .bd-era{flex:none;font-family:var(--sans);font-size:10px;color:var(--ink-3);letter-spacing:1px}
  .bd-mini{flex:none;width:26px;height:26px;line-height:24px;text-align:center;cursor:pointer;border-radius:2px;
    border:1px solid var(--line-2);background:rgba(8,7,6,.5);color:var(--ink-4);font-size:13px;font-weight:700;
    font-family:var(--serif);transition:.15s;padding:0}
  .bd-mini:hover{background:rgba(201,161,59,.22);color:var(--stone)}
  .bd-mini:disabled{opacity:.25;cursor:not-allowed}
  .bd-mini.bd-del:hover{background:rgba(208,67,58,.3);color:var(--crimson-2);border-color:var(--crimson)}
  /* 名录（按兵种类别分组） */
  .bd-era-group{margin-bottom:14px}
  .bd-era-head{display:flex;align-items:center;font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--gold-2);
    letter-spacing:2px;margin:0 0 8px}
  .bd-era-head::after{content:"";flex:1;height:1px;margin-left:10px;
    background:repeating-linear-gradient(90deg,var(--line-2) 0 5px,transparent 5px 10px)}
  .bd-item{display:flex;align-items:center;width:100%;margin-bottom:6px;padding:6px 9px;border-radius:2px;cursor:pointer;
    border:none;text-align:left;font-family:inherit;color:inherit;
    background:rgba(14,12,10,.5);box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
  .bd-item:hover{background:rgba(201,161,59,.15);box-shadow:inset 0 0 0 1px var(--line-2)}
  .bd-item > * + *{margin-left:9px}
  .bd-thumb{flex:none;width:38px;height:38px;border-radius:2px;background-size:cover;background-position:center;
    box-shadow:inset 0 0 0 1px rgba(201,161,59,.45)}
  .bd-info{display:block;flex:1;min-width:0}
  .bd-info .bd-nm2{display:block;font-size:13.5px;font-weight:700;color:var(--stone);letter-spacing:1.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bd-info .bd-sub{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-3);letter-spacing:1px;margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bd-info .bd-sub b{color:var(--f-accent-2);font-weight:700}
  .bd-add{flex:none;width:30px;height:30px;line-height:28px;text-align:center;border-radius:2px;font-size:16px;font-weight:700;
    color:var(--ink);background:linear-gradient(180deg,var(--gold-3),var(--gold));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .bd-item.picked{opacity:.42;cursor:default}
  .bd-item.picked .bd-add{background:rgba(8,7,6,.6);color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold)}

  /* ===== 征召地标签 ===== */
  .tag{position:absolute;transform:translate(-50%,-142%);font-size:11px;color:var(--ink);padding:2px 7px;white-space:nowrap;pointer-events:none;transition:opacity .25s;font-weight:600;letter-spacing:1px;
    background:linear-gradient(180deg,var(--stone),var(--stone-3));border:1px solid var(--gold);border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.4)}

  /* ===== 提示 ===== */
  .hint{position:fixed;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);font-size:12.5px;color:#fff;padding:7px 16px;z-index:26;opacity:0;transition:opacity .35s;pointer-events:none;letter-spacing:1.5px;font-weight:600;
    white-space:normal;text-align:center;line-height:1.6;width:max-content;max-width:calc(100% - 36px);
    background:linear-gradient(174deg,var(--crimson-2),var(--crimson) 80%);border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 6px 18px rgba(120,20,10,.45)}
  .hint.show{opacity:1}
  /* 阵营选择页的提示改贴底栏上方，避免压住 hero 的标题 */
  body.mode-factions .hint{top:auto;bottom:calc(58px + var(--sab))}
  body.mode-review .hint,
  body.mode-builder .hint{top:calc(var(--bar) + var(--sattop) + 12px)}

  /* ===== 背景音乐开关（音频数据：assets/audio/bgm.js）=====
     容器上传白名单不收音频扩展名、CSP 又禁 data:/blob: 媒体源，所以音频以 base64
     藏在 bgm.js（白名单类型）里，运行时用 Web Audio 解码播放 —— 详见 app.js 的 BGM 段。
     decodeAudioData 成功后才给 <html> 挂 has-bgm，开关才显形；解不出＝整块隐藏，五页照常。
     开 / 关两枚图标是内联 SVG（音符 / 音符＋斜杠），由 .on 换显，不依赖任何图片。 */
  .bgm-btn{position:fixed;right:10px;z-index:24;display:none;align-items:center;
    top:calc(var(--bar) + var(--sattop) + var(--bgmgap));
    border-radius:2px;cursor:pointer;white-space:nowrap;transition:.15s;line-height:1;
    font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:1px;
    padding:4px 8px;color:var(--gold-2);background:rgba(8,7,6,.62);border:1px solid var(--line-2);
    box-shadow:0 2px 8px rgba(0,0,0,.45)}
  html.has-bgm .bgm-btn{display:inline-flex}
  html.is-demo .bgm-btn{display:none}      /* 演示模式录屏不留开关 */
  .bgm-btn:hover{color:var(--stone);background:rgba(201,161,59,.24);border-color:var(--gold-2)}
  /* 出声中＝一块压铸金牌 */
  .bgm-btn.on{color:var(--ink);background:linear-gradient(180deg,var(--gold-3),var(--gold));
    border-color:rgba(255,246,222,.8);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.32),0 2px 8px rgba(0,0,0,.45)}
  .bgm-btn:focus{outline:2px solid var(--gold);outline-offset:1px}
  .bgm-ico{flex:none;width:14px;height:14px;overflow:visible}
  .bgm-ico ellipse{fill:currentColor}
  .bgm-ico path{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .bgm-ico .slash{stroke-width:1.9}
  /* 关闭：同一枚音符压到半透明，再压一道斜杠 */
  .bgm-ico-off{display:none}
  .bgm-ico-off ellipse,.bgm-ico-off path{opacity:.45}
  .bgm-ico-off .slash{opacity:1}
  .bgm-btn:not(.on) .bgm-ico-on{display:none}
  .bgm-btn:not(.on) .bgm-ico-off{display:inline-block}

  /* ===== 加载 ===== */
  #loader{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .6s;
    background:radial-gradient(ellipse 70% 50% at 50% 40%,var(--iron-6),var(--iron-8) 60%,var(--iron-9))}
  #loader.hide{opacity:0;pointer-events:none}
  .spin{width:44px;height:44px;border:3px solid rgba(201,161,59,.22);border-top-color:var(--gold-2);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loader p{margin-top:18px;font-size:14px;color:var(--gold-2);letter-spacing:4px}

  /* ===== 移动端 ===== */

  /* 焦点基线 */
  .route-card:focus,.bar-btn:focus,.bd-item:focus,.bd-mini:focus{outline:2px solid var(--gold);outline-offset:1px}

  /* 矮视口：兵种图与右列一起收，避免被挤爆。
     画面宽高必须同改，否则画框又变长方、方图会被裁。 */
  @media (max-height:560px){
    .tour-frame{width:20vh;height:20vh}
  }
  @media (max-height:520px){.park-hero{height:calc(104px + 92px + var(--sattop))}.park-ttl{font-size:20px}}
  @media (max-height:420px){.park-hero{height:calc(96px + 78px + var(--sattop))}.park-logo{display:none}}
  @media (min-height:820px){:root{--hero-h:170px}}

  /* 增强层：Flex gap */
  .supports-flex-gap .route-card-head{gap:12px}
  .supports-flex-gap .route-card-head > * + *{margin-left:0}
  .supports-flex-gap .route-meta{gap:14px}
  .supports-flex-gap .route-meta > * + *{margin-left:0}
  .supports-flex-gap .tour-bar{gap:12px}
  .supports-flex-gap .tour-bar > * + *{margin-left:0}
  .supports-flex-gap .tour-head{gap:10px}
  .supports-flex-gap .tour-head > * + *{margin-left:0}
  .supports-flex-gap .tour-meta{gap:10px}
  .supports-flex-gap .tour-meta > * + *{margin-left:0}
  .supports-flex-gap .tour-chips{gap:6px}
  .supports-flex-gap .tour-traits{gap:6px}
  .supports-flex-gap .tour-trait{margin-right:0}
  .supports-flex-gap .tour-controls{gap:12px}
  .supports-flex-gap .tour-controls > * + *{margin-left:0}
  .supports-flex-gap .summary-controls{gap:12px}
  .supports-flex-gap .summary-controls > * + *{margin-left:0}
  .supports-flex-gap .sum-dish{gap:9px}
  .supports-flex-gap .sum-dish > * + *{margin-left:0}
  .supports-flex-gap .builder-controls{gap:12px}
  .supports-flex-gap .builder-controls > * + *{margin-left:0}
  .supports-flex-gap .bd-chip{gap:8px}
  .supports-flex-gap .bd-chip > * + *{margin-left:0}
  .supports-flex-gap .bd-item{gap:9px}
  .supports-flex-gap .bd-item > * + *{margin-left:0}
</style>
<script src="./assets/flexgap.js"></script>
</head>
<body class="mode-factions">

<!-- 阵营选择页 -->
<main class="page page-factions" id="pageFactions">
  <header class="park-hero">
    <!-- 阵营横幅轮播（八大军团各一张）：图位与回退链见 CSS 的 .park-shot -->
    <div class="park-shots" aria-hidden="true">
      <span class="park-shot"></span>
      <span class="park-shot"></span>
      <span class="park-shot"></span>
      <span class="park-shot"></span>
      <span class="park-shot"></span>
      <span class="park-shot"></span>
      <span class="park-shot"></span>
      <span class="park-shot"></span>
    </div>
    <div class="park-brand">
      <div class="park-logo"></div>
      <div class="park-ttl">罗马军团图鉴</div>
      <div class="park-sub">ROMA · 兵种志</div>
    </div>
  </header>
  <div class="route-section">
    <div class="route-section-title">选择阵营</div>
    <div id="routeList"></div>
  </div>
  <div class="routes-bar">
    <div class="routes-bar-text">* 8 个阵营 · 48 个兵种 · 检阅时该兵种的征召地实时标注于地球</div>
  </div>
</main>

<!-- 自选军团页 -->
<section class="page page-builder" id="pageBuilder">
  <div class="builder-bar">
    <div class="builder-ttl" id="builderTtl">自选军团 · 自行编排</div>
  </div>
  <div class="builder-body" id="builderBody">
    <div class="builder-wrap">
      <div class="builder-note">跨阵营抽调兵种，编成你自己的一支军团：点名录中的兵种即可加入，用 ↑ ↓ 调整顺序、× 移出。<br>编制会存在本机，下次进来还在。</div>
      <div class="sec">我的军团<span class="secnote">按加入顺序检阅</span></div>
      <div class="bd-picked" id="bdPicked"></div>
      <div class="sec">兵种名录<span class="secnote">按兵种类型分组 · 共 48 种</span></div>
      <div id="bdPool"></div>
    </div>
  </div>
  <div class="builder-controls">
    <button class="bar-btn bar-btn-ghost" id="bdBack">‹ 返回</button>
    <button class="bar-btn bar-btn-ghost" id="bdRandom">随机一支</button>
    <button class="bar-btn bar-btn-primary" id="bdStart">开始检阅</button>
  </div>
</section>

<!-- 过渡页（即将检阅） -->
<section class="page page-gate" id="pageGate">
  <div class="gate-stage">
    <div class="gate-bg" aria-hidden="true"></div>
    <div class="gate-shot" aria-hidden="true"></div>
    <div class="gate-scrim" aria-hidden="true"></div>
    <div class="gate-caption">
      <!-- 标题与副标题由 app.js 的 enterGate() 按**选中的阵营**写入（默认值是罗马那一档，
           只为 JS 没跑起来时兜底，不是通用文案） -->
      <div class="gate-title" id="gateTitle">罗马</div>
      <div class="gate-subtitle" id="gateSubtitle">SPQR · LEGIONVM CODEX</div>
      <div class="gate-route-name" id="gateRouteName"></div>
    </div>
  </div>
</section>

<!-- 检阅页 -->
<section class="page page-review" id="pageReview">
  <div class="tour-bar">
    <div class="tour-crumb" id="tourCrumb"></div>
  </div>
  <div class="tour-body" id="tourBody">
    <div class="tour-wrap">
      <div class="tour-stage">
        <div class="tour-row">
          <div class="tour-frame">
            <div class="tour-img" id="tourImg"></div>
          </div>
          <!-- 装备拆解：槽位列表由 app.js 按 assets/gear.js 的 KIT 渲染，空槽不渲染 -->
          <div class="gear" id="gearCol"></div>
        </div>
        <div class="tour-style" id="tourStyle" role="group" aria-label="兵种图风格">
          <button type="button" class="ts-btn" data-style="real">写实</button>
          <button type="button" class="ts-btn" data-style="card">兵牌</button>
          <span class="ts-off" id="tsNote">素材未生成</span>
        </div>
        <div class="tour-card">
          <div class="tour-head">
            <h1 class="tour-name" id="tourName"></h1>
            <span class="tour-paddock" id="tourPaddock"></span>
          </div>
          <div class="tour-meta">
            <div class="tour-loc" id="tourLoc"></div>
            <div class="tour-data" id="tourData"></div>
          </div>
          <p class="tour-intro" id="tourIntro"></p>
          <div class="tour-chips">
            <div class="tour-traits" id="tourTraits"></div>
            <div class="tour-tagline" id="tourTagline"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tour-controls">
    <button class="bar-btn bar-btn-ghost" id="tcPrev">‹ 上一队</button>
    <button class="bar-btn bar-btn-primary" id="tcNext">下一队 ›</button>
    <button class="bar-btn bar-btn-ghost" id="tcQuit">收兵归营</button>
  </div>
</section>

<!-- 军团志 -->
<section class="page page-summary" id="pageSummary">
  <div class="summary-bar">
    <div class="tour-crumb" id="summaryCrumb">军团志</div>
  </div>
  <div class="summary-body" id="summaryBody">
    <div class="summary-wrap">
      <div class="summary-ttl">检阅完毕</div>
      <div class="summary-sub">本次检阅 <b id="sumCount">0</b> 个兵种 · 覆盖 <b id="sumKind">0</b> 种兵种类型 <b id="sumRegion">0</b> 个征召行省</div>
      <div class="summary-brief" id="sumBrief"></div>
      <div class="sec">战力图谱<span class="secnote">六维 · 本次均值 · 满分 5</span></div>
      <div id="sumBars"></div>
      <div class="sec">兵种档案<span class="secnote">各队最突出的两维</span></div>
      <div id="sumDishes"></div>
    </div>
  </div>
  <div class="summary-controls">
    <button class="bar-btn bar-btn-ghost" id="scAgain">再阅一次</button>
    <button class="bar-btn bar-btn-primary" id="scBack">返回选择阵营</button>
  </div>
</section>

<div class="hint" id="hint"></div>
<!-- 音乐开关：显示的是**当前有没有在出声**，不是"用户想不想听"。
     autoplay 策略要求用户手势，所以首屏一定还没出声，初始态就写成未播放的样子
     （不带 .on、aria-pressed=false、斜杠音符），由 app.js 在真正起播 / 停声时改写。
     两枚图标都常驻 DOM，由 CSS 的 .on 换显，不做 innerHTML 拼装。 -->
<button class="bgm-btn" id="bgmBtn" type="button" aria-pressed="false" aria-label="背景音乐" title="背景音乐">
  <svg class="bgm-ico bgm-ico-on" viewBox="0 0 16 16" aria-hidden="true">
    <ellipse cx="4.8" cy="12.4" rx="3.3" ry="2.6"/>
    <path d="M8.1 12.4V2.9c2.3.7 4.1 2 4.3 4.3"/>
  </svg>
  <svg class="bgm-ico bgm-ico-off" viewBox="0 0 16 16" aria-hidden="true">
    <ellipse cx="4.8" cy="12.4" rx="3.3" ry="2.6"/>
    <path d="M8.1 12.4V2.9c2.3.7 4.1 2 4.3 4.3"/>
    <path class="slash" d="M1.6 1.6 14.4 14.4"/>
  </svg>
</button>
<div id="loader"><div class="spin"></div><p>正在集结</p></div>

<script src="./assets/units.js"></script>
<script src="./assets/gear.js"></script>
<!-- 音频数据（base64）必须在 app.js 之前就位：容器上传白名单不收音频扩展名，
     所以音频藏在 .js 里，由 app.js 交给 Web Audio 解码播放。 -->
<script src="./assets/audio/bgm.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
